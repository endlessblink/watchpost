<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../dusk-tokens.css">
    <link rel="stylesheet" href="dusk.css">
</head>
<body>
<div class="page">

    <!-- Header: compact Dusk toolbar -->
    <header class="header">
        <div class="header-top">
            <h1 class="header-title">
                Agent log
                <span class="live-dot" id="live-dot" title="Live updates connected" role="status" aria-label="Live updates"></span>
            </h1>
            <div class="header-stats" id="header-stats" aria-label="Totals for this range">
                <span class="stat-item" title="Actions">
                    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12L16 12h5"/></svg>
                    <span class="stat-value" id="stat-actions">—</span>
                    <span class="sr">actions</span>
                </span>
                <span class="stat-item" title="Sessions">
                    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg>
                    <span class="stat-value" id="stat-sessions">—</span>
                    <span class="sr">sessions</span>
                </span>
                <span class="stat-item" title="Files changed">
                    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V9z"/><path d="M14 4v5h5"/></svg>
                    <span class="stat-value" id="stat-files">—</span>
                    <span class="sr">files changed</span>
                </span>
            </div>
        </div>

        <div class="header-controls">
            <!-- Time range -->
            <div class="range-group" role="group" aria-label="Time range">
                <button class="range-btn" data-range="1h" title="Last hour">1h</button>
                <button class="range-btn" data-range="6h" title="Last 6 hours">6h</button>
                <button class="range-btn active" data-range="24h" title="Last 24 hours">24h</button>
                <button class="range-btn" data-range="7d" title="Last 7 days">7d</button>
                <button class="range-btn" data-range="all" title="Everything">All</button>
            </div>

            <!-- Project filter -->
            <label class="proj" title="Filter by project">
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 015.5 5H9l2 2h7.5A2.5 2.5 0 0121 9.5v7a2.5 2.5 0 01-2.5 2.5h-13A2.5 2.5 0 013 16.5z"/></svg>
                <select class="filter-select" id="project-filter" aria-label="Filter by project">
                    <option value="all">All projects</option>
                    <!-- Populated dynamically -->
                </select>
                <svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
            </label>

            <span class="grow"></span>

            <!-- File search (expands on focus) -->
            <div class="search-wrapper">
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
                <input
                    type="text"
                    class="search-input"
                    id="file-search"
                    placeholder="Files or commands"
                    aria-label="Search files or commands"
                    autocomplete="off"
                    spellcheck="false"
                />
            </div>

            <!-- Tool filter (icon button, native select underneath) -->
            <label class="tb tool-tb" title="Filter by tool">
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
                <span class="mark" aria-hidden="true"></span>
                <select class="filter-select" id="tool-filter" aria-label="Filter by tool">
                    <option value="all">All tools</option>
                    <option value="Write">Write</option>
                    <option value="Edit">Edit</option>
                    <option value="Bash">Bash</option>
                    <option value="Agent">Agent</option>
                    <option value="Read">Read</option>
                    <option value="Grep">Grep</option>
                    <option value="Glob">Glob</option>
                </select>
            </label>

            <!-- Clear filters (appears only when a filter is on) -->
            <button class="clear-btn tb" id="clear-filters" title="Clear filters" aria-label="Clear filters">
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 7L7 17M7 7l10 10"/></svg>
                <span class="filter-active-dot" id="filter-dot" aria-hidden="true"></span>
            </button>
        </div>
    </header>

    <!-- Content area: timeline + detail -->
    <div class="content-area">
    <div class="timeline-container" id="timeline-container">
        <!-- New items notification -->
        <div class="new-items-bar" id="new-items-bar">
            <div class="new-items-pill" id="new-items-pill" role="button" tabindex="0">
                <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
                <span id="new-items-text">New actions</span>
            </div>
        </div>

        <!-- Content rendered by JS -->
        <div id="timeline-content">
            <div class="loading-state">
                <div class="spinner"></div>
                Fetching agent actions…
            </div>
        </div>
    </div><!-- end timeline-container -->

    <!-- Detail Panel -->
    <aside class="detail-panel" id="detail-panel" aria-label="Action details">
        <button class="ib detail-close" id="detail-close" type="button" title="Close details" aria-label="Close details">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 7L7 17M7 7l10 10"/></svg>
        </button>
        <div class="detail-empty" id="detail-empty">
            <svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
            <div>Click an action to see details</div>
        </div>
        <div id="detail-content" style="display:none;"></div>
    </aside>

    </div><!-- end content-area -->

</div>

<script>
// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let allActions = [];
let pendingNewActions = [];
let activeRange = '24h';
let activeToolFilter = 'all';
let activeFileFilter = '';
let activeSessionFilter = '';
let activeProjectFilter = 'all';
let sseSource = null;
let sseConnected = false;

// Session color palette (deterministic from session ID)
// Dusk: soft, low-chroma hues that sit quietly on the dark background
const SESSION_COLORS = [
    '#7CC3B3', '#D9B26F', '#B59AD9', '#8DBF9A',
    '#8DA2CB', '#D49AB8', '#86B9CF', '#D58E8E',
    '#B5C48A', '#D9A07F',
];

function sessionColor(sessionId) {
    if (!sessionId) return '#868DA2';
    let hash = 0;
    for (let i = 0; i < sessionId.length; i++) {
        hash = (hash * 31 + sessionId.charCodeAt(i)) >>> 0;
    }
    return SESSION_COLORS[hash % SESSION_COLORS.length];
}

// ─────────────────────────────────────────────
// Tool badge config
// ─────────────────────────────────────────────
// Dusk palette: each tool gets a soft hue and an icon instead of a text label
const TOOL_ICONS = {
    write: '<path d="M14 4H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V9z"/><path d="M14 4v5h5M12 12v5M9.5 14.5h5"/>',
    edit:  '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
    bash:  '<path d="M5 8l4 4-4 4M12 17h7"/>',
    agent: '<path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/>',
    read:  '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.5"/>',
    grep:  '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
    glob:  '<path d="M3 7.5A2.5 2.5 0 015.5 5H9l2 2h7.5A2.5 2.5 0 0121 9.5v7a2.5 2.5 0 01-2.5 2.5h-13A2.5 2.5 0 013 16.5z"/>',
    other: '<circle cx="12" cy="12" r="3"/>',
};
const TOOL_CONFIG = {
    Write:  { color: '#8DBF9A', bg: '#22302A', icon: TOOL_ICONS.write },
    Edit:   { color: '#8DA2CB', bg: '#232A3A', icon: TOOL_ICONS.edit },
    Bash:   { color: '#D9B26F', bg: '#33291A', icon: TOOL_ICONS.bash },
    Agent:  { color: '#B59AD9', bg: '#2E2640', icon: TOOL_ICONS.agent },
    Task:   { color: '#B59AD9', bg: '#2E2640', icon: TOOL_ICONS.agent },
    Read:   { color: '#9BA2B4', bg: '#252936', icon: TOOL_ICONS.read },
    Grep:   { color: '#7CC3B3', bg: '#22332F', icon: TOOL_ICONS.grep },
    Glob:   { color: '#86B9CF', bg: '#20303A', icon: TOOL_ICONS.glob },
};
const TOOL_FALLBACK = { color: '#868DA2', bg: '#252936', icon: TOOL_ICONS.other };

function toolStyle(tool) {
    const cfg = TOOL_CONFIG[tool] || TOOL_FALLBACK;
    return `color:${cfg.color};background:${cfg.bg};`;
}

// Round tool chip: icon only, the tool name lives in title + aria-label
function toolBadge(tool) {
    const cfg = TOOL_CONFIG[tool] || TOOL_FALLBACK;
    const name = escHtml(tool);
    return `<div class="tool-badge" data-tool="${name}" style="${toolStyle(tool)}" title="${name}" role="img" aria-label="${name}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${cfg.icon}</svg></div>`;
}

// ─────────────────────────────────────────────
// Time helpers
// ─────────────────────────────────────────────
function relativeTime(iso) {
    const now = Date.now();
    const ts = new Date(iso).getTime();
    const diff = Math.floor((now - ts) / 1000);
    if (diff < 5) return 'just now';
    if (diff < 60) return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
}

function absoluteTime(iso) {
    return new Date(iso).toLocaleString(undefined, {
        month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
}

function sinceISO(range) {
    const now = new Date();
    if (range === 'all') return null;
    const map = { '1h': 3600, '6h': 21600, '24h': 86400, '7d': 604800 };
    const secs = map[range] || 86400;
    return new Date(now.getTime() - secs * 1000).toISOString();
}

// ─────────────────────────────────────────────
// API
// ─────────────────────────────────────────────
const API_BASE = '';

async function fetchActions(since) {
    const params = new URLSearchParams({ limit: '300' });
    if (since) params.set('since', since);
    if (activeProjectFilter !== 'all') params.set('project', activeProjectFilter);
    const res = await fetch(`${API_BASE}/api/changelog/actions?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return data.actions || [];
}

async function fetchStats(period) {
    const params = new URLSearchParams({ period });
    if (activeProjectFilter !== 'all') params.set('project', activeProjectFilter);
    const res = await fetch(`${API_BASE}/api/changelog/stats?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return data.stats || {};
}

async function loadProjects() {
    try {
        const res = await fetch('/api/changelog/sessions?limit=100');
        if (!res.ok) return;
        const data = await res.json();
        const projects = [...new Set((data.sessions || []).map(s => s.project).filter(Boolean))].sort();
        const select = document.getElementById('project-filter');
        // Keep "All projects" option, remove others
        while (select.options.length > 1) select.remove(1);
        for (const p of projects) {
            const opt = document.createElement('option');
            opt.value = p;
            opt.textContent = p;
            select.appendChild(opt);
        }
        // Re-apply active selection if set
        if (activeProjectFilter !== 'all') select.value = activeProjectFilter;
    } catch {}
}

// ─────────────────────────────────────────────
// SSE
// ─────────────────────────────────────────────
function connectSSE() {
    if (sseSource) { sseSource.close(); sseSource = null; }

    try {
        sseSource = new EventSource(`${API_BASE}/api/changelog/events`);

        sseSource.addEventListener('new-actions', async (e) => {
            try {
                const data = JSON.parse(e.data);
                const count = data.count || 1;
                // Fetch latest actions since the most recent we have
                const latestTs = allActions.length ? allActions[0].ts : null;
                const newOnes = await fetchActions(latestTs);
                if (newOnes.length > 0) {
                    // Auto-merge new actions into the timeline
                    const existingIds = new Set(allActions.map(a => a.id));
                    const fresh = newOnes.filter(a => !existingIds.has(a.id));
                    if (fresh.length > 0) {
                        allActions = [...fresh, ...allActions];
                        rerender();
                        // Also refresh stats
                        fetchStats(activeRange === 'all' ? '30d' : activeRange)
                            .then(updateStats).catch(() => {});
                    }
                }
            } catch(err) {
                console.warn('SSE fetch error:', err);
            }
        });

        sseSource.onopen = () => {
            sseConnected = true;
            const dot = document.getElementById('live-dot');
            if (dot) { dot.style.cssText = ''; dot.title = 'Live — connected'; }
        };

        sseSource.onerror = () => {
            sseConnected = false;
            const dot = document.getElementById('live-dot');
            if (dot) {
                dot.style.background = '#6e7681';
                dot.style.boxShadow = 'none';
                dot.style.animation = 'none';
                dot.title = 'Disconnected — will retry';
            }
            // Auto-reconnect after 10s
            setTimeout(connectSSE, 10000);
        };
    } catch (err) {
        console.warn('SSE not available:', err);
    }
}

// ─────────────────────────────────────────────
// Rendering
// ─────────────────────────────────────────────
function truncatePath(path, maxLen = 60) {
    if (!path || path.length <= maxLen) return path || '';
    const parts = path.split('/');
    if (parts.length <= 2) return '…' + path.slice(-(maxLen - 1));
    // Show filename + a few parent dirs
    let result = parts[parts.length - 1];
    let i = parts.length - 2;
    while (i >= 0 && result.length + parts[i].length + 1 < maxLen - 4) {
        result = parts[i] + '/' + result;
        i--;
    }
    return (i >= 0 ? '…/' : '') + result;
}

function renderActionCard(action, idx) {
    const tool = action.tool || 'Unknown';
    const style = toolStyle(tool);
    const relTime = relativeTime(action.ts);
    const absTime = absoluteTime(action.ts);

    let mainContent = '';
    if (action.file_path) {
        const displayPath = truncatePath(action.file_path);
        mainContent += `<span class="action-path" title="${escHtml(action.file_path)}" data-path="${escHtml(action.file_path)}">${escHtml(displayPath)}</span>`;
    }
    if (action.command) {
        const cmd = action.command.length > 100 ? action.command.slice(0, 97) + '…' : action.command;
        mainContent += `<div class="action-command" title="${escHtml(action.command)}">${escHtml(cmd)}</div>`;
    }
    if (action.input_summary) {
        let summary = action.input_summary;
        // Try to extract description from JSON summary
        try {
            const parsed = JSON.parse(summary);
            summary = parsed.description || parsed.file_path || parsed.command || summary;
        } catch (e) { /* use as-is */ }
        const truncated = summary.length > 120 ? summary.slice(0, 117) + '…' : summary;
        const hasMore = summary.length > 120;
        mainContent += `<div class="action-summary" title="${escHtml(summary)}">${escHtml(truncated)}</div>`;
        if (hasMore) {
            mainContent += `<div class="action-expand-hint">click to expand</div>`;
        }
    }

    const projectBadge = action.project
        ? `<span class="project-badge">${escHtml(action.project)}</span>`
        : '';
    const agentLabel = action.agent_id
        ? `<span class="agent-label">${escHtml(action.agent_id)}</span>`
        : '';

    const hasMore = action.input_summary && action.input_summary.length > 120;

    return `<div class="action-card ${hasMore ? 'has-more' : ''}" data-id="${action.id}" data-session="${escHtml(action.session_id || '')}" style="animation-delay:${Math.min(idx * 20, 300)}ms" tabindex="0" role="button">
        <div class="action-time" title="${absTime}">${relTime}</div>
        ${toolBadge(tool)}
        <div class="action-body">${mainContent}</div>
        <div class="action-meta">${projectBadge}${agentLabel}</div>
    </div>`;
}

function groupBySession(actions) {
    const groups = [];
    let current = null;
    for (const action of actions) {
        const sid = action.session_id || '__nosession__';
        if (!current || current.sessionId !== sid) {
            current = { sessionId: sid, actions: [] };
            groups.push(current);
        }
        current.actions.push(action);
    }
    return groups;
}

function renderGroups(actions) {
    if (actions.length === 0) {
        return `<div class="empty-state">
            <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
            <div class="empty-title">No actions recorded yet</div>
            <div class="empty-desc">The changelog hook captures actions automatically as agents run.</div>
        </div>`;
    }

    const groups = groupBySession(actions);
    return groups.map(group => {
        const sid = group.sessionId;
        const firstAction = group.actions[0];
        const sessionStart = firstAction ? absoluteTime(firstAction.ts) : '';
        const shortId = sid === '__nosession__' ? 'no session' : sid.slice(0, 8);
        const color = sessionColor(sid);
        const count = group.actions.length;

        const sessionHeader = `<div class="session-header">
            <div class="session-header-line"></div>
            <div class="session-header-label">
                <span class="session-id-chip" data-session="${escHtml(sid)}" style="color:${color};background:${color}1F;" title="Show only this session" role="button" tabindex="0" aria-label="Show only session ${escHtml(shortId)}">${escHtml(shortId)}</span>
                <span class="session-when">${sessionStart}</span>
                <span class="session-count" title="${count} action${count !== 1 ? 's' : ''}">${count}</span>
            </div>
            <div class="session-header-line"></div>
        </div>`;

        const cards = group.actions.map((a, i) => renderActionCard(a, i)).join('');
        return `<div class="session-group">${sessionHeader}<div class="action-list">${cards}</div></div>`;
    }).join('');
}

function escHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// ─────────────────────────────────────────────
// Filtering
// ─────────────────────────────────────────────
function applyFilters(actions) {
    let result = actions;

    if (activeToolFilter !== 'all') {
        result = result.filter(a => {
            const tool = (a.tool || '').toLowerCase();
            const filter = activeToolFilter.toLowerCase();
            // Agent filter matches both "Agent" and "Task"
            if (filter === 'agent') return tool === 'agent' || tool === 'task';
            return tool === filter;
        });
    }

    if (activeFileFilter) {
        const q = activeFileFilter.toLowerCase();
        result = result.filter(a => {
            return (a.file_path && a.file_path.toLowerCase().includes(q))
                || (a.command && a.command.toLowerCase().includes(q))
                || (a.input_summary && a.input_summary.toLowerCase().includes(q));
        });
    }

    if (activeSessionFilter) {
        result = result.filter(a => a.session_id === activeSessionFilter);
    }

    return result;
}

function updateFilterIndicators() {
    const anyActive = activeToolFilter !== 'all' || activeFileFilter || activeSessionFilter || activeProjectFilter !== 'all';
    document.getElementById('filter-dot').classList.toggle('visible', !!anyActive);
    document.getElementById('clear-filters').classList.toggle('visible', !!anyActive);
    // Dusk toolbar: icon controls show a small mark when their own filter is on
    document.querySelector('.tool-tb')?.classList.toggle('has-filter', activeToolFilter !== 'all');
    document.querySelector('.proj')?.classList.toggle('has-filter', activeProjectFilter !== 'all');
    document.querySelector('.search-wrapper')?.classList.toggle('has-q', !!activeFileFilter);
}

function rerender() {
    const filtered = applyFilters(allActions);
    document.getElementById('timeline-content').innerHTML = renderGroups(filtered);
    attachCardListeners();
    updateFilterIndicators();
}

// ─────────────────────────────────────────────
// Detail panel
// ─────────────────────────────────────────────
let selectedActionId = null;

function showDetail(action) {
    selectedActionId = action.id;

    // Highlight selected card
    document.querySelectorAll('.action-card.selected').forEach(c => c.classList.remove('selected'));
    const card = document.querySelector(`.action-card[data-id="${action.id}"]`);
    if (card) card.classList.add('selected');

    document.getElementById('detail-empty').style.display = 'none';
    const content = document.getElementById('detail-content');
    content.style.display = 'block';
    document.body.classList.add('detail-open');

    const tool = action.tool || 'Unknown';
    const style = toolStyle(tool);

    // Parse and pretty-print the summary JSON
    let prettyInput = action.input_summary || '—';
    try {
        const parsed = JSON.parse(prettyInput);
        prettyInput = JSON.stringify(parsed, null, 2);
    } catch (e) { /* use as-is */ }

    // Build human-readable description
    let humanDesc = '';
    if (tool === 'Write' || tool === 'Edit' || tool === 'Read') {
        const verb = tool === 'Write' ? 'Wrote' : tool === 'Edit' ? 'Edited' : 'Read';
        const filename = action.file_path ? action.file_path.split('/').pop() : 'unknown file';
        humanDesc = `${verb} <strong>${escHtml(filename)}</strong>`;
        if (tool === 'Edit') {
            try {
                const p = JSON.parse(action.input_summary);
                if (p.old_string && p.new_string) {
                    humanDesc += `<br><span style="color:var(--text-muted)">Replaced text in the file</span>`;
                }
            } catch(e) {}
        }
    } else if (tool === 'Bash') {
        humanDesc = `Ran command: <code style="color:var(--tool-bash)">${escHtml(action.command || '?')}</code>`;
    } else if (tool === 'Agent') {
        try {
            const p = JSON.parse(action.input_summary);
            humanDesc = `Spawned agent: <strong>${escHtml(p.description || p.subagent_type || '?')}</strong>`;
            if (p.subagent_type) humanDesc += `<br><span style="color:var(--text-muted)">Type: ${escHtml(p.subagent_type)}</span>`;
        } catch(e) {
            humanDesc = 'Spawned a sub-agent';
        }
    } else if (tool === 'Grep') {
        try {
            const p = JSON.parse(action.input_summary);
            humanDesc = `Searched for <code>${escHtml(p.pattern || '?')}</code>`;
            if (p.path) humanDesc += ` in <span style="color:var(--text-secondary)">${escHtml(truncatePath(p.path, 40))}</span>`;
        } catch(e) {
            humanDesc = 'Searched code';
        }
    } else if (tool === 'Glob') {
        try {
            const p = JSON.parse(action.input_summary);
            humanDesc = `Found files matching <code>${escHtml(p.pattern || '?')}</code>`;
        } catch(e) {
            humanDesc = 'Found files';
        }
    } else {
        humanDesc = `${escHtml(tool)} action`;
    }

    let sections = '';

    // Human-readable description
    sections += `<div class="detail-section">
        <div class="detail-section-title">What happened</div>
        <div style="font-size:0.95rem;color:var(--text-primary);line-height:1.6">${humanDesc}</div>
    </div>`;

    // File path
    if (action.file_path) {
        sections += `<div class="detail-section">
            <div class="detail-section-title">File</div>
            <div class="detail-value">${escHtml(action.file_path)}</div>
        </div>`;
    }

    // Command
    if (action.command) {
        sections += `<div class="detail-section">
            <div class="detail-section-title">Command</div>
            <div class="detail-value">${escHtml(action.command)}</div>
        </div>`;
    }

    // Full input (pretty-printed JSON)
    sections += `<div class="detail-section">
        <div class="detail-section-title">Full Input</div>
        <div class="detail-value summary">${escHtml(prettyInput)}</div>
    </div>`;

    // Metadata grid
    sections += `<div class="detail-section">
        <div class="detail-section-title">Metadata</div>
        <div class="detail-meta">
            <span class="detail-meta-key">Session</span>
            <span class="detail-meta-val">${escHtml(action.session_id || '—')}</span>
            <span class="detail-meta-key">Agent</span>
            <span class="detail-meta-val">${escHtml(action.agent_id || 'conductor')}</span>
            <span class="detail-meta-key">Project</span>
            <span class="detail-meta-val">${escHtml(action.project || '—')}</span>
            <span class="detail-meta-key">Tool Use ID</span>
            <span class="detail-meta-val">${escHtml(action.tool_use_id || '—')}</span>
            <span class="detail-meta-key">Timestamp</span>
            <span class="detail-meta-val">${absoluteTime(action.ts)}</span>
            ${action.git_branch ? `<span class="detail-meta-key">Branch</span><span class="detail-meta-val">${escHtml(action.git_branch)}</span>` : ''}
        </div>
    </div>`;

    content.innerHTML = `
        <div class="detail-header">
            ${toolBadge(tool)}
            <div class="detail-header-text"><strong>${escHtml(tool)}</strong> ${escHtml(action.agent_id || 'conductor')}</div>
            <div class="detail-header-time">${relativeTime(action.ts)}</div>
        </div>
        ${sections}
    `;
}

// Dusk: the detail panel only takes space while an action is open
function closeDetail() {
    selectedActionId = null;
    document.querySelectorAll('.action-card.selected').forEach(c => c.classList.remove('selected'));
    document.getElementById('detail-content').style.display = 'none';
    document.getElementById('detail-empty').style.display = '';
    document.body.classList.remove('detail-open');
}
document.getElementById('detail-close').addEventListener('click', closeDetail);
// Narrow screens: tapping the dimmed backdrop (content-area::after) closes the sheet
document.querySelector('.content-area').addEventListener('click', (e) => {
    if (e.target === e.currentTarget && window.matchMedia('(max-width: 860px)').matches) closeDetail();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('detail-open')) closeDetail();
});

// Keyboard: Enter/Space on a focusable row or chip acts like a click
document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const el = e.target.closest?.('.action-card, .session-id-chip, .new-items-pill');
    if (!el || el !== e.target) return;
    e.preventDefault();
    el.click();
});

// ─────────────────────────────────────────────
// Card interaction listeners
// ─────────────────────────────────────────────
function attachCardListeners() {
    // Click card → show detail (and expand if has-more)
    document.querySelectorAll('.action-card').forEach(card => {
        card.addEventListener('click', (e) => {
            if (e.target.closest('.action-path') || e.target.closest('.session-id-chip')) return;
            const id = parseInt(card.dataset.id, 10);
            const action = allActions.find(a => a.id === id);
            if (action) showDetail(action);
            if (card.classList.contains('has-more')) card.classList.toggle('expanded');
        });
    });

    // File path click — filter to that path
    document.querySelectorAll('.action-path[data-path]').forEach(el => {
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            const path = el.dataset.path;
            const searchEl = document.getElementById('file-search');
            searchEl.value = path;
            activeFileFilter = path;
            rerender();
        });
    });

    // Session chip click — filter to that session
    document.querySelectorAll('.session-id-chip[data-session]').forEach(el => {
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            const sid = el.dataset.session;
            if (sid === '__nosession__') return;
            activeSessionFilter = sid;
            rerender();
        });
    });
}

// ─────────────────────────────────────────────
// New items bar
// ─────────────────────────────────────────────
function showNewItemsBar(count) {
    const bar = document.getElementById('new-items-bar');
    const text = document.getElementById('new-items-text');
    text.textContent = `${count} new action${count !== 1 ? 's' : ''} — click to load`;
    bar.classList.add('visible');
}

function hideNewItemsBar() {
    document.getElementById('new-items-bar').classList.remove('visible');
}

document.getElementById('new-items-pill').addEventListener('click', () => {
    // Merge pending into allActions (dedupe by id)
    const existingIds = new Set(allActions.map(a => a.id));
    const fresh = pendingNewActions.filter(a => !existingIds.has(a.id));
    allActions = [...fresh, ...allActions];
    pendingNewActions = [];
    hideNewItemsBar();
    rerender();
    // Scroll to top to see new items
    document.getElementById('timeline-container').scrollTo({ top: 0, behavior: 'smooth' });
});

// ─────────────────────────────────────────────
// Stats display
// ─────────────────────────────────────────────
function updateStats(stats) {
    const set = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.textContent = val ?? '—';
    };
    set('stat-actions', stats.total_actions != null ? stats.total_actions.toLocaleString() : '—');
    set('stat-sessions', stats.sessions != null ? stats.sessions.toLocaleString() : '—');
    set('stat-files', stats.files_changed != null ? stats.files_changed.toLocaleString() : '—');
}

// ─────────────────────────────────────────────
// Load
// ─────────────────────────────────────────────
async function loadData() {
    const content = document.getElementById('timeline-content');
    content.innerHTML = '<div class="loading-state"><div class="spinner"></div>Fetching agent actions…</div>';

    try {
        const since = sinceISO(activeRange);
        const period = activeRange === 'all' ? '30d' : activeRange;

        const [actions, stats] = await Promise.allSettled([
            fetchActions(since),
            fetchStats(period),
        ]);

        if (actions.status === 'fulfilled') {
            allActions = actions.value;
        } else {
            allActions = [];
            content.innerHTML = `<div class="error-state">Could not fetch actions: ${escHtml(actions.reason?.message || 'Unknown error')}</div>
                <div class="empty-state">
                    <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
                    <div class="empty-title">No actions recorded yet</div>
                    <div class="empty-desc">The changelog hook captures actions automatically as agents run.</div>
                </div>`;
            return;
        }

        if (stats.status === 'fulfilled') {
            updateStats(stats.value);
        }

        rerender();
    } catch (err) {
        content.innerHTML = `<div class="error-state">Error loading data: ${escHtml(err.message)}</div>`;
    }
}

// ─────────────────────────────────────────────
// Controls
// ─────────────────────────────────────────────
document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeRange = btn.dataset.range;
        pendingNewActions = [];
        hideNewItemsBar();
        loadData();
    });
});

document.getElementById('tool-filter').addEventListener('change', (e) => {
    activeToolFilter = e.target.value;
    rerender();
});

document.getElementById('project-filter').addEventListener('change', (e) => {
    activeProjectFilter = e.target.value;
    pendingNewActions = [];
    hideNewItemsBar();
    loadData();
});

document.getElementById('file-search').addEventListener('input', (e) => {
    activeFileFilter = e.target.value.trim();
    rerender();
});

document.getElementById('clear-filters').addEventListener('click', () => {
    activeToolFilter = 'all';
    activeFileFilter = '';
    activeSessionFilter = '';
    activeProjectFilter = 'all';
    document.getElementById('tool-filter').value = 'all';
    document.getElementById('file-search').value = '';
    document.getElementById('project-filter').value = 'all';
    loadData();
});

// ─────────────────────────────────────────────
// Periodic relative time refresh
// ─────────────────────────────────────────────
setInterval(() => {
    document.querySelectorAll('.action-time[title]').forEach(el => {
        const absTime = el.title;
        // Find the corresponding action by walking up to action-card
        const card = el.closest('.action-card');
        if (!card) return;
        const id = parseInt(card.dataset.id, 10);
        const action = allActions.find(a => a.id === id);
        if (action) el.textContent = relativeTime(action.ts);
    });
}, 30000);

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────

// Auto-select project from URL params (for iframe integration)
const urlParams = new URLSearchParams(window.location.search);
const autoProject = urlParams.get('project');
if (autoProject) {
    activeProjectFilter = autoProject;
}

// Listen for project-switch messages from parent
window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'project-switch' && e.data.project) {
        activeProjectFilter = e.data.project;
        const select = document.getElementById('project-filter');
        if (select) select.value = e.data.project;
        loadData();
    }
});

loadProjects();
loadData();
connectSSE();
</script>
<script src="../dusk-select.js"></script>
</body>
</html>
