<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bots — Watchpost</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../dusk-tokens.css">
    <link rel="stylesheet" href="dusk.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="4"/><path d="M12 8V4M9 14h.01M15 14h.01"/></symbol>
            <symbol id="i-telegram" viewBox="0 0 24 24"><path d="M21 4L3 11.2l6.3 2.3L18 7.5l-6.7 7.2L17.5 20z"/><path d="M9.3 13.5V19l2.6-3"/></symbol>
            <symbol id="i-discord" viewBox="0 0 24 24"><path d="M5 6.5C7 5 9 4.5 9 4.5l.8 1.6h4.4L15 4.5s2 .5 4 2c1.6 2.8 2.3 6 2 9.5-1.6 1.4-3.5 2.3-5 2.5l-1.1-1.8M5 6.5C3.4 9.3 2.7 12.5 3 16c1.6 1.4 3.5 2.3 5 2.5l1.1-1.8M7 16c3.2 1.4 6.8 1.4 10 0"/><path d="M9.5 12h.01M14.5 12h.01"/></symbol>
            <symbol id="i-whatsapp" viewBox="0 0 24 24"><path d="M4 20l1.3-4A8 8 0 1112 20a8 8 0 01-4-1.1z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a3.5 3.5 0 01-1.8-1.8l.8-1-1-2z"/></symbol>
            <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6.5A2.5 2.5 0 0013.5 4h-7A2.5 2.5 0 004 6.5v7A2.5 2.5 0 006.5 16H8"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
            <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
            <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 01-14.3 4.9M4 12A8 8 0 0118.3 7.1"/><path d="M18.5 3v4.2h-4.2M5.5 21v-4.2h4.2"/></symbol>
            <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v5M12 16.5h.01"/></symbol>
            <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12L16 12h5"/></symbol>
            <symbol id="i-commit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M3 12h5.5M15.5 12H21"/></symbol>
            <symbol id="i-persona" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0114 0"/></symbol>
        </defs>
    </svg>

    <div class="topbar">
        <h1>Bots</h1>
        <span class="meta" id="meta">Loading…</span>
        <span class="spacer"></span>
        <button class="tb" id="copy-index" aria-label="Copy agent index" title="Copy agent index">
            <svg class="ic base"><use href="#i-copy"/></svg><svg class="ic ok"><use href="#i-check"/></svg><svg class="ic fail"><use href="#i-x"/></svg>
        </button>
        <button class="tb" id="refresh" aria-label="Refresh" title="Refresh"><svg class="ic"><use href="#i-refresh"/></svg></button>
    </div>

    <div id="banners"></div>
    <div id="content"><div class="empty"><svg class="ic"><use href="#i-bot"/></svg>Loading the fleet…</div></div>

    <div class="overlay" id="overlay">
        <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Bot details"></div>
    </div>

    <script>
        const PLATFORM_LABELS = {
            telegram: 'Telegram',
            discord: 'Discord',
            whatsapp: 'WhatsApp',
            unknown: 'Unclassified'
        };

        let catalog = null;
        let lastFocus = null;

        const escapeHtml = value => String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

        const icon = name => `<svg class="ic" aria-hidden="true"><use href="#i-${name}"/></svg>`;
        const platformIcon = key => icon(['telegram', 'discord', 'whatsapp'].includes(key) ? key : 'bot');

        async function load(force) {
            const refreshButton = document.getElementById('refresh');
            document.getElementById('meta').textContent = 'Loading…';
            if (force) refreshButton.classList.add('busy');
            try {
                const res = await fetch('/api/bots' + (force ? '?refresh=1' : ''));
                catalog = await res.json();
                render();
            } catch (err) {
                document.getElementById('content').innerHTML =
                    `<div class="empty">${icon('alert')}Could not load the catalog: ${escapeHtml(err.message)}</div>`;
                document.getElementById('meta').textContent = '';
            } finally {
                refreshButton.classList.remove('busy');
            }
        }

        function renderBanners() {
            const banners = [];
            if (catalog.sshError) {
                banners.push(`Runtime status is unavailable this run (${escapeHtml(catalog.sshError)}). Everything else below is still accurate.`);
            }
            if (catalog.personaError) {
                banners.push(`Live persona read failed (${escapeHtml(catalog.personaError)}). Personas shown may be the declared set from each repo.`);
            }
            if (catalog.orphanPersonas.length) {
                banners.push(`${catalog.orphanPersonas.length} persona(s) are configured on a live bot but not declared in any repo manifest.`);
            }
            document.getElementById('banners').innerHTML =
                banners.map(text => `<div class="banner" role="status">${icon('alert')}<span>${text}</span></div>`).join('');
        }

        function cardHtml(bot, index) {
            const driftErrors = bot.drift.filter(d => d.level === 'error');
            const personaChips = bot.personas.map(persona => `
                <span class="persona-chip ${persona.source === 'declared' ? 'declared' : ''}"
                      title="${escapeHtml(persona.source === 'live' ? 'From the running config' : 'Declared in the repo manifest, not confirmed live')}">
                    ${escapeHtml(persona.name)}${persona.topicId ? ' · ' + escapeHtml(persona.topicId) : ''}
                </span>`).join('');

            const target = bot.deployment.container || bot.deployment.service || bot.deployment.kind;
            const runsAs = `${bot.deployment.kind}${target && target !== bot.deployment.kind ? ' · ' + target : ''}`;
            const commitLine = bot.git && bot.git.lastCommitDate
                ? `<span class="r" title="Last commit ${escapeHtml(bot.git.lastCommitDate.slice(0, 10))} · ${escapeHtml(bot.git.commits7d)} in 7d">${icon('commit')}${escapeHtml(bot.git.lastCommitDate.slice(5, 10))}</span>`
                : '';
            const hoverTitle = [bot.statusDetail, bot.project.root].filter(Boolean).join('\n');

            return `
                <div class="card s-${escapeHtml(bot.status)} ${bot.lifecycle === 'retired' ? 'retired' : ''}" data-index="${index}"
                     tabindex="0" role="button" aria-label="${escapeHtml(bot.name)}, ${escapeHtml(bot.statusDetail)}. Open details" title="${escapeHtml(hoverTitle)}">
                    <div class="card-head">
                        <span class="bav">${platformIcon(bot.platform)}</span>
                        <span class="who">
                            <span class="card-name">${escapeHtml(bot.name)}</span>
                            <span class="sub">${escapeHtml(runsAs)}</span>
                        </span>
                        ${bot.lifecycle !== 'active' ? `<span class="badge muted">${escapeHtml(bot.lifecycle)}</span>` : ''}
                        ${bot.registryOnly ? '<span class="badge warn">no manifest</span>' : ''}
                        <span class="dot ${escapeHtml(bot.status)}" aria-hidden="true"></span>
                    </div>
                    ${bot.summary ? `<p class="card-summary">${escapeHtml(bot.summary)}</p>` : ''}
                    ${personaChips ? `<div class="personas">${personaChips}</div>` : ''}
                    ${bot.drift.length ? `<div class="drift ${driftErrors.length ? 'error' : ''}">${icon('alert')}<span>${bot.drift.map(d => escapeHtml(d.message)).join('<br>')}</span></div>` : ''}
                    <div class="bf"><span class="st">${icon('pulse')}${escapeHtml(bot.statusDetail)}</span>${commitLine}</div>
                </div>`;
        }

        function render() {
            renderBanners();

            const generated = new Date(catalog.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const running = catalog.bots.filter(bot => bot.status === 'green').length;
            const meta = document.getElementById('meta');
            meta.textContent = `${catalog.bots.length} bots · ${running} healthy · ${generated}`;
            meta.title = `Updated ${new Date(catalog.timestamp).toLocaleString()}`;

            if (!catalog.bots.length) {
                document.getElementById('content').innerHTML = `<div class="empty">${icon('bot')}No bots in the catalog yet.</div>`;
                return;
            }

            const groups = {};
            catalog.bots.forEach((bot, index) => {
                const key = bot.platform || 'unknown';
                (groups[key] = groups[key] || []).push({ bot, index });
            });

            const order = ['telegram', 'discord', 'whatsapp', 'unknown'];
            const keys = Object.keys(groups).sort(
                (a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99)
            );

            document.getElementById('content').innerHTML = keys.map(key => `
                <section class="group" aria-label="${escapeHtml(PLATFORM_LABELS[key] || key)}">
                    <div class="group-title">${platformIcon(key)}${escapeHtml(PLATFORM_LABELS[key] || key)}<span class="n">${groups[key].length}</span></div>
                    <div class="grid">${groups[key].map(entry => cardHtml(entry.bot, entry.index)).join('')}</div>
                </section>`).join('');
        }

        function openDrawer(bot) {
            const personaBlocks = bot.personas.length ? bot.personas.map(persona => `
                <div>
                    <div class="kv"><span>${escapeHtml(persona.name)}</span><span>${persona.topicId ? 'topic ' + escapeHtml(persona.topicId) : ''} · ${escapeHtml(persona.source)}${persona.allowed === false ? ' · NOT allow-listed' : ''}</span></div>
                    <div class="prompt">${escapeHtml(persona.prompt || 'No prompt text available.')}</div>
                </div>`).join('') : '<div class="card-summary">No personas configured.</div>';

            const commits = bot.git && bot.git.recentCommits.length
                ? bot.git.recentCommits.map(c => `<div class="commit"><code>${escapeHtml(c.hash)}</code><span>${escapeHtml(c.message)}</span></div>`).join('')
                : '<div class="card-summary">No git history available.</div>';

            document.getElementById('drawer').innerHTML = `
                <div class="drawer-head s-${escapeHtml(bot.status)}">
                    <span class="bav">${platformIcon(bot.platform)}</span>
                    <div>
                        <h2>${escapeHtml(bot.name)}</h2>
                        <div class="meta">${escapeHtml(bot.platform)} · ${escapeHtml(bot.lifecycle)} · ${escapeHtml(bot.status)} (${escapeHtml(bot.statusDetail)})</div>
                    </div>
                    <button class="tb drawer-close" id="drawer-close" aria-label="Close" title="Close">${icon('x')}</button>
                </div>
                ${bot.summary ? `<section><div class="card-summary">${escapeHtml(bot.summary)}</div></section>` : ''}

                <section>
                    <h3>Where it lives</h3>
                    <div class="kv"><span>Deployment</span><span>${escapeHtml(bot.deployment.kind)}</span></div>
                    ${bot.deployment.container ? `<div class="kv"><span>Container</span><span>${escapeHtml(bot.deployment.container)}</span></div>` : ''}
                    ${bot.deployment.service ? `<div class="kv"><span>Service</span><span>${escapeHtml(bot.deployment.service)}</span></div>` : ''}
                    ${bot.deployment.host ? `<div class="kv"><span>Host</span><span>${escapeHtml(bot.deployment.host)}</span></div>` : ''}
                    ${bot.project.root ? `<div class="kv"><span>Code</span><span>${escapeHtml(bot.project.root)}</span></div>` : ''}
                    ${bot.git && bot.git.lastCommitDate ? `<div class="kv"><span>Last commit</span><span>${escapeHtml(bot.git.lastCommitDate.slice(0, 10))} · ${escapeHtml(bot.git.commits7d)} in 7d</span></div>` : ''}
                    ${bot.chats.map(chat => `<div class="kv"><span>Chat</span><span>${escapeHtml(chat.label || 'chat')} (${escapeHtml(chat.id)})</span></div>`).join('')}
                    ${bot.aliases.length ? `<div class="kv"><span>Also called</span><span>${escapeHtml(bot.aliases.join(', '))}</span></div>` : ''}
                </section>

                <section>
                    <h3>Personas${bot.personaSourceKey ? ` — live from ${escapeHtml(bot.personaSourceKey)}` : ''}</h3>
                    ${personaBlocks}
                </section>

                ${bot.notes ? `<section><h3>Notes</h3><div class="card-summary">${escapeHtml(bot.notes)}</div></section>` : ''}

                ${bot.drift.length ? `<section><h3>Drift</h3><div class="drift">${icon('alert')}<span>${bot.drift.map(d => `(${escapeHtml(d.level)}) ${escapeHtml(d.message)}`).join('<br>')}</span></div></section>` : ''}

                <section>
                    <h3>Recent commits</h3>
                    ${commits}
                </section>`;

            lastFocus = document.activeElement;
            document.getElementById('overlay').classList.add('open');
            document.getElementById('drawer-close').focus();
        }

        function closeDrawer() {
            const overlay = document.getElementById('overlay');
            if (!overlay.classList.contains('open')) return;
            overlay.classList.remove('open');
            if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
        }

        document.getElementById('content').addEventListener('click', event => {
            const card = event.target.closest('.card');
            if (card) openDrawer(catalog.bots[Number(card.dataset.index)]);
        });

        document.getElementById('content').addEventListener('keydown', event => {
            const card = event.target.closest('.card');
            if (card && (event.key === 'Enter' || event.key === ' ')) {
                event.preventDefault();
                openDrawer(catalog.bots[Number(card.dataset.index)]);
            }
        });

        document.getElementById('overlay').addEventListener('click', event => {
            if (event.target.id === 'overlay' || event.target.closest('#drawer-close')) closeDrawer();
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeDrawer();
        });

        document.getElementById('refresh').addEventListener('click', () => load(true));

        document.getElementById('copy-index').addEventListener('click', async event => {
            const button = event.currentTarget;
            button.classList.remove('ok', 'fail');
            try {
                const markdown = await (await fetch('/api/bots/index.md')).text();
                await navigator.clipboard.writeText(markdown);
                button.classList.add('ok');
                button.title = 'Copied';
            } catch {
                button.classList.add('fail');
                button.title = 'Copy failed';
            }
            setTimeout(() => {
                button.classList.remove('ok', 'fail');
                button.title = 'Copy agent index';
            }, 1800);
        });

        load(false);
        setInterval(() => load(false), 60000);
    </script>
</body>
</html>
