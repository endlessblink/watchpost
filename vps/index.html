<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server — Watchpost</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../dusk-tokens.css">
    <link rel="stylesheet" href="dusk.css">
</head>
<body>

<!-- Top bar -->
<header class="topbar">
    <h1 class="page-title">Server</h1>
    <span class="up-chip" id="upChip" role="status"><i></i><span id="upChipText"></span></span>
    <div class="topbar-spacer"></div>
    <div class="subtabs" role="group" aria-label="Server view">
        <button class="subtab active" data-tab="services" aria-label="Services" title="Services" aria-pressed="true">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2.5"/><rect x="3" y="13" width="18" height="7" rx="2.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
            <span class="lbl">Services</span>
        </button>
        <button class="subtab" data-tab="health" aria-label="Health" title="Health" aria-pressed="false">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12L16 12h5"/></svg>
            <span class="lbl">Health</span>
        </button>
    </div>
    <span class="last-checked" id="lastChecked">—</span>
    <button class="btn-refresh" id="btnRefresh" title="Refresh" aria-label="Refresh">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 11-2.4-5.7M20 4v5h-5"/></svg>
    </button>
</header>

<!-- Error banner -->
<div class="error-banner" id="errorBanner" role="alert">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5M12 16h.01"/></svg>
    <span id="errorMsg">Cannot reach server</span>
</div>

<!-- Services tab -->
<main class="tab-panel active" id="panel-services">
    <div class="service-grid" id="serviceGrid" aria-busy="true">
        <!-- skeleton rows -->
        <section class="category-section">
            <div class="category-header"><span class="skeleton" style="height:12px;width:90px"></span></div>
            <div class="category-grid">
                <div class="skel-row"><span class="skeleton" style="width:40px;height:40px;border-radius:11px"></span><span class="skeleton" style="height:12px;width:55%"></span></div>
                <div class="skel-row"><span class="skeleton" style="width:40px;height:40px;border-radius:11px"></span><span class="skeleton" style="height:12px;width:40%"></span></div>
                <div class="skel-row"><span class="skeleton" style="width:40px;height:40px;border-radius:11px"></span><span class="skeleton" style="height:12px;width:48%"></span></div>
            </div>
        </section>
    </div>
</main>

<!-- Health tab -->
<main class="tab-panel" id="panel-health">
    <div class="health-layout">
        <section class="pane" id="metricCards">
            <h3><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12L16 12h5"/></svg>Load</h3>
            <div class="meter"><span class="skeleton" style="height:12px;width:40%"></span><span class="skeleton" style="height:8px;width:100%"></span></div>
            <div class="meter"><span class="skeleton" style="height:12px;width:50%"></span><span class="skeleton" style="height:8px;width:100%"></span></div>
            <div class="meter"><span class="skeleton" style="height:12px;width:35%"></span><span class="skeleton" style="height:8px;width:100%"></span></div>
        </section>
        <section class="pane" id="healthInfo">
            <h3><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2.5"/><rect x="3" y="13" width="18" height="7" rx="2.5"/></svg>System</h3>
        </section>
        <div class="proc-grid" id="procGrid"></div>
    </div>
</main>

<script>
// ── State ──
let activeSubTab = 'services';
let lastStatusData = null;
let lastHealthData = null;
let refreshTimer = null;
let healthLoaded = false;
const logsOpen = {};

// ── Sub-tab switching ──
document.querySelectorAll('.subtab').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.subtab').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        activeSubTab = btn.dataset.tab;
        document.getElementById('panel-' + activeSubTab).classList.add('active');
        startAutoRefresh();
        if (activeSubTab === 'health' && !healthLoaded) fetchHealth();
        else if (activeSubTab === 'services' && !lastStatusData) fetchStatus();
    });
});

document.getElementById('btnRefresh').addEventListener('click', () => {
    if (activeSubTab === 'services') fetchStatus();
    else fetchHealth();
});

function startAutoRefresh() {
    clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
        if (activeSubTab === 'services') fetchStatus();
        else fetchHealth();
    }, 30000);
}

function setTimestamp(ts) {
    const el = document.getElementById('lastChecked');
    const d = new Date(ts);
    el.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    el.title = 'Last checked ' + el.textContent;
    el.classList.remove('stale');
    setTimeout(() => el.classList.add('stale'), 90000);
}

function showError(msg) {
    const el = document.getElementById('errorBanner');
    document.getElementById('errorMsg').textContent = msg || 'Cannot reach server';
    el.classList.add('visible');
}
function hideError() { document.getElementById('errorBanner').classList.remove('visible'); }

function setRefreshing(on) {
    document.getElementById('btnRefresh').classList.toggle('spinning', on);
}

// ══════════════════ SERVICES ══════════════════

async function fetchStatus() {
    setRefreshing(true);
    try {
        const statusRes = await fetch('/api/vps/status');
        const status = await statusRes.json();

        if (status.error) {
            showError('Cannot reach server — ' + (status.message || status.error));
        } else {
            lastStatusData = { status };
            renderServices(status);
            setTimestamp(status.timestamp);
            // Degraded mode: SSH discovery timed out but services still rendered
            // from HTTP health pings — warn instead of blanking the tab.
            if (status.sshError) {
                showError('Live SSH unavailable (' + status.sshError + ') — showing health-check status only');
            } else {
                hideError();
            }
        }
    } catch (e) {
        showError('Network error: ' + e.message);
    } finally {
        setRefreshing(false);
    }
}

const ICON = {
    bots:     '<path d="M12 8V4M9 14h.01M15 14h.01"/><rect x="4" y="8" width="16" height="12" rx="4"/>',
    apps:     '<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
    infra:    '<rect x="3" y="4" width="18" height="7" rx="2.5"/><rect x="3" y="13" width="18" height="7" rx="2.5"/><path d="M7 7.5h.01M7 16.5h.01"/>',
    box:      '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
    other:    '<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
    open:     '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 01-2 2H6a2 2 0 01-2-2V8a2 2 0 012-2h4"/>',
    restart:  '<path d="M20 12a8 8 0 11-2.4-5.7M20 4v5h-5"/>',
    update:   '<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/>',
    logs:     '<path d="M9 7h11M9 12h11M9 17h11M4.5 7h.01M4.5 12h.01M4.5 17h.01"/>',
    link:     '<path d="M10 13a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.7-1.7"/>',
    auto:     '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
    pulse:    '<path d="M3 12h4l2.5-6 4 12L16 12h5"/>',
    gauge:    '<path d="M4 16a8 8 0 1116 0"/><path d="M12 16l4-5"/>',
    clock:    '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    net:      '<path d="M7 4v16M7 4L4 7M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"/>',
    up:       '<path d="M12 19V5M6 11l6-6 6 6"/>',
    down:     '<path d="M12 5v14M6 13l6 6 6-6"/>',
    cpu:      '<rect x="6" y="6" width="12" height="12" rx="2.5"/><path d="M10 2.5V6M14 2.5V6M10 18v3.5M14 18v3.5M2.5 10H6M2.5 14H6M18 10h3.5M18 14h3.5"/>',
    mem:      '<rect x="3" y="7" width="18" height="10" rx="2.5"/><path d="M7 17v3M12 17v3M17 17v3M7 11h.01M12 11h.01M17 11h.01"/>'
};
function icon(name) { return `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[name] || ICON.other}</svg>`; }

const CATEGORY_CONFIG = {
    bots:           { label: 'Bots', icon: 'bots' },
    apps:           { label: 'Apps', icon: 'apps' },
    infrastructure: { label: 'Infrastructure', icon: 'infra' },
    containers:     { label: 'Containers', icon: 'box' },
    other:          { label: 'Other', icon: 'other' }
};

const STATUS_WORD = { green: 'Running', amber: 'Not responding', red: 'Down', unknown: 'Unknown', loading: 'Checking' };

function renderServiceCard(svc) {
    const gradFrom = svc.gradientFrom || '#1C1F28';
    const gradTo = svc.gradientTo || '#2B3040';
    const initial = svc.name.charAt(0).toUpperCase();
    const coverUrl = `/api/vps/cover/${svc.id}?t=${Date.now()}`;
    const statusWord = STATUS_WORD[svc.status] || svc.status;

    return `
    <article class="service-card status-${svc.status}" id="card-${svc.id}" title="${esc(svc.description)}">
        <div class="svc-row">
            <div class="svc-thumb">
                <div class="svc-thumb-bg" style="background: linear-gradient(135deg, ${gradFrom} 0%, ${gradTo} 100%)">
                    <img src="${coverUrl}" alt="" onerror="this.style.display='none'">
                    <span class="svc-initial" aria-hidden="true">${initial}</span>
                </div>
                <span class="cover-status-dot ${svc.status}" id="dot-${svc.id}" role="img" aria-label="${esc(statusWord)}" title="${esc(statusWord)}"></span>
            </div>

            <div class="svc-text">
                <div class="svc-name">
                    <span>${esc(svc.name)}</span>
                    ${svc.projectAlias ? `<span class="svc-tag" title="Linked project: ${esc(svc.projectAlias)}" aria-label="Linked project: ${esc(svc.projectAlias)}">${icon('link')}</span>` : ''}
                    ${svc.autoDiscovered ? `<span class="svc-tag" title="Found automatically" aria-label="Found automatically">${icon('auto')}</span>` : ''}
                </div>
                <div class="card-detail" id="detail-${svc.id}">${esc(svc.detail || statusWord)}</div>
                <span class="card-desc sr">${esc(svc.description)}</span>
            </div>

            <span class="restarting-badge" id="restarting-${svc.id}" role="status">${icon('restart')}Restarting…</span>
            <span class="restarting-badge" id="updating-${svc.id}" role="status">${icon('restart')}Updating…</span>

            <div class="card-actions">
                ${svc.dashboardUrl ? `
                    <a class="btn-dash ${svc.status === 'red' ? 'dimmed' : ''}"
                       href="${esc(svc.dashboardUrl)}" target="_blank" rel="noopener"
                       title="${esc(svc.dashboardLabel || 'Open')}" aria-label="${esc(svc.dashboardLabel || 'Open')}">${icon('open')}</a>` : ''}

                ${svc.canRestart ? `
                    <button class="btn-icon restart" onclick="restartService('${jsArg(svc.id)}','${jsArg(svc.name)}')" title="Restart" aria-label="Restart ${esc(svc.name)}">${icon('restart')}</button>` : ''}

                ${svc.canUpdateWaha ? `
                    <button class="btn-icon update" onclick="updateService('${jsArg(svc.id)}','${jsArg(svc.name)}')" title="${esc(svc.updateLabel || 'Update WAHA')}: pull latest WAHA image and recreate WAHA only" aria-label="${esc(svc.updateLabel || 'Update WAHA')}">${icon('update')}</button>` : ''}

                <button class="btn-icon" id="logsBtn-${svc.id}" onclick="toggleLogs('${svc.id}')" title="View logs" aria-label="View logs for ${esc(svc.name)}">${icon('logs')}</button>
            </div>
        </div>

        <div class="log-viewer" id="logs-${svc.id}">
            <pre id="logContent-${svc.id}"></pre>
        </div>
    </article>`;
}

function renderUpChip(services) {
    const chip = document.getElementById('upChip');
    if (!chip) return;
    const total = services.length;
    const up = services.filter(s => s.status === 'green').length;
    const down = services.filter(s => s.status === 'red').length;
    chip.classList.toggle('visible', total > 0);
    chip.classList.toggle('bad', down > 0);
    chip.classList.toggle('warn', !down && up < total);
    document.getElementById('upChipText').textContent = up === total ? `All ${total} up` : `${up} of ${total} up`;
}

function renderServices(data) {
    const grid = document.getElementById('serviceGrid');
    grid.removeAttribute('aria-busy');
    if (!data.services || !data.services.length) {
        renderUpChip([]);
        grid.innerHTML = '<p class="empty-note">No services found.</p>';
        return;
    }
    renderUpChip(data.services);

    // Group by category
    const groups = {};
    for (const svc of data.services) {
        const cat = svc.category || 'other';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(svc);
    }

    // Render in order
    const categoryOrder = ['bots', 'apps', 'infrastructure', 'containers', 'other'];
    let html = '';
    for (const cat of categoryOrder) {
        if (!groups[cat] || !groups[cat].length) continue;
        const cfg = CATEGORY_CONFIG[cat] || { label: cat, icon: 'other' };
        html += `<section class="category-section">
            <h2 class="category-header">
                <span class="category-icon">${icon(cfg.icon)}</span>
                <span class="category-label">${cfg.label}</span>
                <span class="category-count">${groups[cat].length}</span>
            </h2>
            <div class="category-grid">
                ${groups[cat].map(renderServiceCard).join('')}
            </div>
        </section>`;
    }
    grid.innerHTML = html;
}

async function restartService(id, name) {
    if (!confirm(`Restart "${name}"?\n\nThe service will be unavailable for ~30 seconds.`)) return;
    const badge = document.getElementById('restarting-' + id);
    if (badge) badge.classList.add('visible');
    try {
        const res = await fetch('/api/vps/restart/' + id, { method: 'POST' });
        const data = await res.json();
        if (!data.ok) showError('Restart failed: ' + (data.error || 'unknown error'));
        else setTimeout(fetchStatus, 4000);
    } catch (e) {
        showError('Restart error: ' + e.message);
    } finally {
        if (badge) badge.classList.remove('visible');
    }
}

async function updateService(id, name) {
    const warning = [
        `Update WAHA for "${name}"?`,
        '',
        'This pulls the latest WAHA image, backs up waha-sessions, and recreates only the WAHA container.',
        'The existing WhatsApp session should stay linked unless WhatsApp invalidates it.'
    ].join('\n');
    if (!confirm(warning)) return;

    const badge = document.getElementById('updating-' + id);
    if (badge) badge.classList.add('visible');
    try {
        const res = await fetch('/api/vps/update/' + id, { method: 'POST' });
        const data = await res.json();
        if (!data.ok) {
            showError('WAHA update failed: ' + (data.error || data.output || 'unknown error'));
        } else {
            setTimeout(fetchStatus, 5000);
        }
    } catch (e) {
        showError('WAHA update error: ' + e.message);
    } finally {
        if (badge) badge.classList.remove('visible');
    }
}

async function toggleLogs(id) {
    const viewer = document.getElementById('logs-' + id);
    const btn = document.getElementById('logsBtn-' + id);
    const content = document.getElementById('logContent-' + id);
    if (logsOpen[id]) {
        logsOpen[id] = false;
        viewer.classList.remove('visible');
        btn.classList.remove('logs-active');
        return;
    }
    logsOpen[id] = true;
    viewer.classList.add('visible');
    btn.classList.add('logs-active');
    content.textContent = 'Loading…';
    try {
        const res = await fetch('/api/vps/logs/' + id);
        const data = await res.json();
        content.textContent = data.error ? 'Error: ' + data.error : (data.lines?.join('\n') || '(no output)');
    } catch (e) {
        content.textContent = 'Error: ' + e.message;
    }
}

// ══════════════════ HEALTH ════════════════════

async function fetchHealth() {
    setRefreshing(true);
    try {
        const res = await fetch('/api/vps/health');
        const data = await res.json();
        if (data.error) { showError('Cannot reach server — ' + data.error); }
        else {
            hideError();
            healthLoaded = true;
            lastHealthData = data;
            renderHealth(data);
            setTimestamp(data.timestamp);
        }
    } catch (e) { showError('Network error: ' + e.message); }
    finally { setRefreshing(false); }
}

function colorClass(pct) {
    if (pct >= 85) return 'red';
    if (pct >= 65) return 'amber';
    return 'green';
}
function loadColor(val) {
    const n = parseFloat(val);
    if (n >= 3.0) return 'red';
    if (n >= 1.0) return 'amber';
    return 'green';
}
function formatBytes(bytes) {
    const b = parseInt(bytes) || 0;
    if (b > 1e9) return (b / 1e9).toFixed(1) + ' GB';
    if (b > 1e6) return (b / 1e6).toFixed(1) + ' MB';
    return (b / 1e3).toFixed(0) + ' KB';
}
function buildSparkline(history) {
    if (!history || history.length < 2) return '';
    const w = 200, h = 28, pad = 3;
    const max = Math.max(...history, 1);
    const pts = history.map((v, i) => {
        const x = pad + (i / (history.length - 1)) * (w - pad * 2);
        const y = h - pad - ((v / max) * (h - pad * 2));
        return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const last = history[history.length - 1] || 0;
    const col = last >= 85 ? 'var(--pause)' : last >= 65 ? 'var(--act)' : 'var(--accent)';
    return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
        <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    </svg>`;
}

function renderHealth(d) {
    const cpuPct = parseInt(d.cpu) || 0;
    const ramPct = parseInt(d.ram?.pct) || Math.round((d.ram?.used / d.ram?.total) * 100) || 0;
    const diskPct = parseInt(d.disk?.pct) || 0;

    const meter = (label, value, pct) => `
        <div class="meter">
            <div class="top2"><span>${label}</span><span class="mono">${value}</span></div>
            ${label === 'Processor' ? buildSparkline(d.history) : ''}
            <div class="progress-bar" role="progressbar" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="progress-fill ${colorClass(pct)}" style="width:${pct}%"></div></div>
        </div>`;
    const gb = v => (v / 1024).toFixed(1);

    document.getElementById('metricCards').innerHTML = `
        <h3>${icon('pulse')}Load</h3>
        ${meter('Processor', cpuPct + '%', cpuPct)}
        ${meter('Memory', `${gb(d.ram?.used)} of ${gb(d.ram?.total)} GB`, ramPct)}
        ${meter('Disk', `${diskPct}% of ${esc(d.disk?.total || '?')}`, diskPct)}`;

    const loads = d.load || {};
    document.getElementById('healthInfo').innerHTML = `
        <h3>${icon('infra')}System</h3>
        <div class="info-row">
            <span class="info-row-label">${icon('gauge')}Load</span>
            <div class="load-dots">
                <span class="load-pill ${loadColor(loads['1m'])}">${esc(loads['1m'] || '?')} <small>1m</small></span>
                <span class="load-pill ${loadColor(loads['5m'])}">${esc(loads['5m'] || '?')} <small>5m</small></span>
                <span class="load-pill ${loadColor(loads['15m'])}">${esc(loads['15m'] || '?')} <small>15m</small></span>
            </div>
        </div>
        <div class="info-row">
            <span class="info-row-label">${icon('clock')}Uptime</span>
            <span class="info-row-value">${esc(d.uptime || 'unknown')}</span>
        </div>
        <div class="info-row">
            <span class="info-row-label">${icon('net')}Network</span>
            <div class="net-badges">
                <span class="net-badge" title="Sent">${icon('up')}${formatBytes(d.network?.txBytes)}<span class="sr"> sent</span></span>
                <span class="net-badge" title="Received">${icon('down')}${formatBytes(d.network?.rxBytes)}<span class="sr"> received</span></span>
            </div>
        </div>`;

    const procRows = list => (list || []).map(p => `<div class="proc-row"><span class="proc-name">${esc(p.name)}</span><span class="proc-val">${esc(p.value)}</span></div>`).join('')
        || '<div class="proc-empty">No data</div>';
    document.getElementById('procGrid').innerHTML = `
        <section class="pane proc-card">
            <h3>${icon('cpu')}Top by processor</h3>
            ${procRows(d.topCpu)}
        </section>
        <section class="pane proc-card">
            <h3>${icon('mem')}Top by memory</h3>
            ${procRows(d.topRam)}
        </section>`;
}

function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function jsArg(s) {
    return esc(String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n'));
}

// ── Init ──
fetchStatus();
startAutoRefresh();

window.addEventListener('message', e => {
    if (e.data?.type === 'tab-activated') {
        if (activeSubTab === 'services') fetchStatus();
        else fetchHealth();
    }
});
</script>
</body>
</html>
