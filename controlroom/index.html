<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchpost - Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../dusk-tokens.css">
    <link rel="stylesheet" href="dusk.css">
</head>
<body>

<!-- Toolbar: title on the left, quiet icon tools on the right -->
<header class="topbar">
    <h1 class="topbar-title">Projects <span class="count" id="projectCount">—</span></h1>

    <div class="topbar-spacer"></div>

    <label class="search-wrap" title="Filter projects">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <input class="search-input" id="searchInput" type="text" placeholder="Filter projects" aria-label="Filter projects" autocomplete="off">
    </label>

    <label class="tb archived-toggle" title="Show archived projects">
        <input type="checkbox" id="showArchived" aria-label="Show archived projects">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="5" rx="2"/><path d="M5 9.5v8a2 2 0 002 2h10a2 2 0 002-2v-8M10 13.5h4"/></svg>
        <span class="mark" aria-hidden="true"></span>
    </label>

    <div class="view-toggle" role="group" aria-label="Layout">
        <button class="view-btn active" id="viewGrid" title="Grid view" aria-label="Grid view">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
        </button>
        <button class="view-btn" id="viewList" title="List view" aria-label="List view">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01" stroke-width="2.6"/></svg>
        </button>
    </div>

    <label class="tb tb-select tb-group" title="Group projects by">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg>
        <span class="mark" aria-hidden="true"></span>
        <select class="sort-dropdown" id="groupBySelect" aria-label="Group projects by">
            <option value="category">Group: Category</option>
            <option value="activity">Group: Activity</option>
            <option value="status">Group: Task Status</option>
            <option value="none">Group: None</option>
        </select>
    </label>

    <label class="tb tb-select tb-sort" title="Sort projects">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M3.5 16.5L7 20l3.5-3.5"/><path d="M14 7h6M14 12h4.5M14 17h3"/></svg>
        <span class="mark" aria-hidden="true"></span>
        <select class="sort-dropdown" id="sortSelect" aria-label="Sort projects">
            <option value="lastActive">Last Active</option>
            <option value="nameAZ">Name A-Z</option>
            <option value="nameZA">Name Z-A</option>
            <option value="mostTasks">Most Tasks</option>
            <option value="custom">Custom Order</option>
        </select>
    </label>
</header>

<!-- Category / group filter pills -->
<nav class="filter-chips" id="filterChips" aria-label="Filter by group">
    <button class="filter-chip active" data-category="all">All</button>
</nav>

<!-- Main layout: projects on the left, notes beside them on wide screens -->
<main class="layout">
    <div class="content-scroll" id="contentScroll">
        <div id="categorizedGrid">
            <div class="loading-state"><div class="spinner"></div> Loading projects</div>
        </div>

        <!-- Legacy flat containers (used internally by category renderer) -->
        <div class="project-grid hidden" id="projectGrid"></div>
        <div class="project-list hidden" id="projectList"></div>

        <!-- Personal notes -->
        <aside class="notes-section" id="notesSection" aria-label="My notes and tasks">
            <div class="notes-header" id="notesHeaderToggle">
                <h2 class="section-label">
                    <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8a3 3 0 013 3v10a3 3 0 01-3 3H8a3 3 0 01-3-3V7a3 3 0 013-3z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
                    <span>Notes &amp; tasks</span>
                </h2>
                <button class="notes-toggle-btn" id="notesToggleBtn" title="Collapse" aria-label="Collapse notes" aria-expanded="true" aria-controls="notesBody">
                    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                </button>
            </div>
            <div class="notes-body" id="notesBody">
                <div class="notes-add-row">
                    <input class="notes-input" id="noteInput" type="text" placeholder="Add a note, press Enter" aria-label="New note" autocomplete="off">
                    <button class="notes-add-btn" id="noteAddBtn" title="Add" aria-label="Add note">
                        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </div>
                <div class="notes-filter" id="notesFilter" role="group" aria-label="Show notes">
                    <button class="notes-filter-btn active" data-filter="all">All</button>
                    <button class="notes-filter-btn" data-filter="active">Open</button>
                    <button class="notes-filter-btn" data-filter="done">Done</button>
                </div>
                <div class="notes-list" id="notesList">
                    <div class="loading-state"><div class="spinner"></div></div>
                </div>
            </div>
        </aside>
    </div>
</main>

<!-- Detail panel -->
<div class="detail-overlay" id="detailOverlay">
    <div class="detail-panel" id="detailPanel" role="dialog" aria-modal="true" aria-label="Project details">
        <div class="detail-scroll" id="detailScroll">
            <!-- Filled dynamically — cover + close button injected here -->
        </div>
        <div class="detail-actions" id="detailFooter">
            <!-- Filled dynamically -->
        </div>
    </div>
</div>

<!-- Context menu -->
<div class="context-menu" id="contextMenu" role="menu" style="display:none;"></div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

<script>
// ── Utilities ──────────────────────────────────────────────────────────────
function projectGradient(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    const h1 = Math.abs(hash % 360);
    const h2 = (h1 + 40) % 360;
    // Dusk: low-saturation tints so placeholder covers stay calm next to real ones
    return `linear-gradient(135deg, hsl(${h1}, 26%, 30%), hsl(${h2}, 22%, 21%))`;
}

function timeAgo(dateStr) {
    if (!dateStr) return '—';
    const seconds = Math.floor((new Date() - new Date(dateStr)) / 1000);
    if (seconds < 60) return 'just now';
    if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
    if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
    if (seconds < 604800) return Math.floor(seconds / 86400) + 'd ago';
    return Math.floor(seconds / 604800) + 'w ago';
}

function escHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showToast(message, iconType = 'clipboard') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast';

    const iconSvgs = {
        clipboard: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>',
        rocket: '<svg viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/></svg>',
        check: '<svg viewBox="0 0 24 24"><path d="M5.5 12.5l4 4 9-9"/></svg>',
        error: '<svg viewBox="0 0 24 24" style="stroke: var(--color-danger)"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 16h.01"/></svg>',
    };
    iconSvgs.warning = iconSvgs.error;
    if (iconType === 'error' || iconType === 'warning') toast.classList.add('error');

    toast.innerHTML = (iconSvgs[iconType] || iconSvgs.check) + `<span>${escHtml(message)}</span>`;
    container.appendChild(toast);

    setTimeout(() => {
        toast.classList.add('leaving');
        setTimeout(() => toast.remove(), 200);
    }, 2200);
}

function copyText(text) {
    return navigator.clipboard.writeText(text).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
    });
}

// ── Category logic ────────────────────────────────────────────────────────
const CATEGORY_FOLDER_MAP = {
    'bots+automation': 'Bots & Automation',
    'content-creation': 'Content Creation',
    'productivity': 'Productivity',
    'freelance': 'Freelance',
    'game-dev': 'Game Dev',
    'devops': 'DevOps',
    'cc-linux-enhancments': 'Linux Tools',
    'misc': 'Misc',
};

const CATEGORY_COLORS = {
    // Dusk palette: soft, low-contrast hues
    'Bots & Automation': '#D58E8E',
    'Content Creation': '#B59AD9',
    'Productivity': '#7CC3B3',
    'Freelance': '#D9B26F',
    'Game Dev': '#8FBCC8',
    'DevOps': '#8DA2CB',
    'Linux Tools': '#8DBF9A',
    'Misc': '#868DA2',
    'Uncategorized': '#6B7186',
};

const GROUP_COLORS = {
    'High Activity': '#7CC3B3',
    'Medium Activity': '#D9B26F',
    'Low Activity': '#868DA2',
    'In Progress': '#D9B26F',
    'Planned': '#8DA2CB',
    'Completed': '#8DBF9A',
    'No Tasks': '#6B7186',
    'All Projects': '#868DA2',
};

function getGroupColor(groupName) {
    return GROUP_COLORS[groupName] || CATEGORY_COLORS[groupName] || CATEGORY_COLORS['Uncategorized'];
}

function getCategoryFromPath(root) {
    if (!root) return 'Uncategorized';
    const marker = 'ai-development/';
    const idx = root.indexOf(marker);
    if (idx === -1) return 'Uncategorized';
    const after = root.substring(idx + marker.length);
    const folder = after.split('/')[0];
    return CATEGORY_FOLDER_MAP[folder] || 'Uncategorized';
}

function getCategoryColor(category) {
    return CATEGORY_COLORS[category] || CATEGORY_COLORS['Uncategorized'];
}

// ── State ──────────────────────────────────────────────────────────────────
let allProjects = [];
let notes = [];
let notesFilter = 'all';
let notesCollapsed = false;
let currentView = 'grid'; // 'grid' | 'list'
let showArchived = false;
let activeCategory = 'all';
let collapsedCategories = new Set();
let currentSort = 'lastActive'; // 'lastActive' | 'nameAZ' | 'nameZA' | 'mostTasks' | 'custom'
let currentGroupBy = 'category'; // 'category' | 'activity' | 'status' | 'none'
let customOrder = []; // project names in user-defined order (used when currentSort === 'custom')
let detailProject = null;
let openContextMenu = null;

// ── API helpers ────────────────────────────────────────────────────────────
async function apiFetch(url, opts = {}) {
    try {
        const res = await fetch(url, opts);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
    } catch (e) {
        return null;
    }
}

// ── Load projects ──────────────────────────────────────────────────────────
async function loadProjects() {
    const data = await apiFetch('/api/projects/enriched');

    if (!data || !Array.isArray(data)) {
        // Fallback: try basic /api/projects
        const basic = await apiFetch('/api/projects');
        if (basic && Array.isArray(basic)) {
            allProjects = basic.map(p => {
                const root = p.root || p.path || '';
                return {
                    name: p.name || p.id || 'Unknown',
                    root,
                    archived: p.archived || false,
                    updatedAt: p.updatedAt || p.updated_at || null,
                    stats: { done: 0, active: 0, planned: 0 },
                    stack: [],
                    _category: getCategoryFromPath(root),
                };
            });
        } else {
            document.getElementById('categorizedGrid').innerHTML =
                '<div class="empty-state"><div class="empty-icon"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><path d="M16.5 13.5v6M13.5 16.5h6"/></svg></div><p>No projects yet</p><p class="empty-sub">Register a project with Watchpost to see it here</p></div>';
            document.getElementById('projectCount').textContent = '0';
            return;
        }
    } else {
        allProjects = data.map(p => {
            const root = p.root || p.path || '';
            return {
                name: p.name || p.id || 'Unknown',
                root,
                archived: p.archived || false,
                updatedAt: p.updatedAt || p.updated_at || p.lastActivity || null,
                stats: {
                    done: p.taskStats?.done ?? p.stats?.done ?? 0,
                    active: p.taskStats?.inProgress ?? p.stats?.active ?? 0,
                    planned: p.taskStats?.planned ?? p.stats?.planned ?? 0,
                },
                stack: p.stack || p.technologies || [],
                cover: p.coverUrl || p.cover || null,
                commits7d: p.commits7d ?? 0,
                _category: getCategoryFromPath(root),
            };
        });
    }

    renderProjects();
}

// ── Render projects ────────────────────────────────────────────────────────
function sortProjects(projects) {
    const sorted = [...projects];
    if (currentSort === 'lastActive') {
        sorted.sort((a, b) => {
            const aTime = a.updatedAt ? new Date(a.updatedAt).getTime() : 0;
            const bTime = b.updatedAt ? new Date(b.updatedAt).getTime() : 0;
            return bTime - aTime;
        });
    } else if (currentSort === 'nameAZ') {
        sorted.sort((a, b) => a.name.localeCompare(b.name));
    } else if (currentSort === 'nameZA') {
        sorted.sort((a, b) => b.name.localeCompare(a.name));
    } else if (currentSort === 'mostTasks') {
        sorted.sort((a, b) => {
            const aTotal = a.stats.done + a.stats.active + a.stats.planned;
            const bTotal = b.stats.done + b.stats.active + b.stats.planned;
            return bTotal - aTotal;
        });
    } else if (currentSort === 'custom') {
        sorted.sort((a, b) => {
            const ai = customOrder.indexOf(a.name);
            const bi = customOrder.indexOf(b.name);
            // Projects in customOrder come first; unknown projects go to end
            const aIdx = ai === -1 ? Infinity : ai;
            const bIdx = bi === -1 ? Infinity : bi;
            if (aIdx !== bIdx) return aIdx - bIdx;
            return a.name.localeCompare(b.name);
        });
    }
    return sorted;
}

function getFilteredProjects() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const filtered = allProjects.filter(p => {
        if (!showArchived && p.archived) return false;
        if (query && !p.name.toLowerCase().includes(query)) return false;
        if (activeCategory !== 'all') {
            if (currentGroupBy === 'category' || currentGroupBy === 'none') {
                if (p._category !== activeCategory) return false;
            } else if (currentGroupBy === 'activity') {
                const c = p.commits7d || 0;
                const level = c >= 7 ? 'High Activity' : c >= 1 ? 'Medium Activity' : 'Low Activity';
                if (level !== activeCategory) return false;
            } else if (currentGroupBy === 'status') {
                const { done, active, planned } = p.stats;
                const total = done + active + planned;
                let dominant;
                if (total === 0) dominant = 'No Tasks';
                else if (active > 0) dominant = 'In Progress';
                else if (planned > done) dominant = 'Planned';
                else dominant = 'Completed';
                if (dominant !== activeCategory) return false;
            }
        }
        return true;
    });
    return sortProjects(filtered);
}

function groupByCategory(projects) {
    const groups = {};
    for (const p of projects) {
        const cat = p._category || 'Uncategorized';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(p);
    }

    // Sort categories: most recently active first, then alphabetical
    const sorted = Object.entries(groups).sort((a, b) => {
        const aLatest = a[1].reduce((max, p) => {
            const t = p.updatedAt ? new Date(p.updatedAt).getTime() : 0;
            return t > max ? t : max;
        }, 0);
        const bLatest = b[1].reduce((max, p) => {
            const t = p.updatedAt ? new Date(p.updatedAt).getTime() : 0;
            return t > max ? t : max;
        }, 0);
        if (aLatest !== bLatest) return bLatest - aLatest;
        return a[0].localeCompare(b[0]);
    });

    return sorted;
}

function groupByActivityLevel(projects) {
    const groups = { 'High Activity': [], 'Medium Activity': [], 'Low Activity': [] };
    for (const p of projects) {
        const c = p.commits7d || 0;
        if (c >= 7) groups['High Activity'].push(p);
        else if (c >= 1) groups['Medium Activity'].push(p);
        else groups['Low Activity'].push(p);
    }
    return Object.entries(groups).filter(([, arr]) => arr.length > 0);
}

function groupByTaskStatus(projects) {
    const groups = {};
    for (const p of projects) {
        const { done, active, planned } = p.stats;
        const total = done + active + planned;
        let dominant;
        if (total === 0) dominant = 'No Tasks';
        else if (active > 0) dominant = 'In Progress';
        else if (planned > done) dominant = 'Planned';
        else dominant = 'Completed';
        if (!groups[dominant]) groups[dominant] = [];
        groups[dominant].push(p);
    }
    // Fixed order
    const order = ['In Progress', 'Planned', 'Completed', 'No Tasks'];
    return order.filter(k => groups[k]?.length).map(k => [k, groups[k]]);
}

function getGroups(projects) {
    if (currentGroupBy === 'activity') return groupByActivityLevel(projects);
    if (currentGroupBy === 'status') return groupByTaskStatus(projects);
    if (currentGroupBy === 'none') return [['All Projects', projects]];
    return groupByCategory(projects);
}

function renderFilterChips() {
    const chips = document.getElementById('filterChips');
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const visible = allProjects.filter(p => {
        if (!showArchived && p.archived) return false;
        if (query && !p.name.toLowerCase().includes(query)) return false;
        return true;
    });

    // When not grouping by category, show group-based chips
    if (currentGroupBy !== 'category') {
        const groups = getGroups(visible);
        let html = `<button class="filter-chip${activeCategory === 'all' ? ' active' : ''}" data-category="all">All <span class="filter-chip-count">${visible.length}</span></button>`;
        for (const [groupName, groupProjects] of groups) {
            const color = getGroupColor(groupName);
            const isActive = activeCategory === groupName;
            html += `<button class="filter-chip${isActive ? ' active' : ''}" data-category="${escHtml(groupName)}">
                <span class="filter-chip-dot" style="background:${color}"></span>
                ${escHtml(groupName)}
                <span class="filter-chip-count">${groupProjects.length}</span>
            </button>`;
        }
        chips.innerHTML = html;
        return;
    }

    // Category mode — existing behavior
    const catCounts = {};
    for (const p of visible) {
        const cat = p._category || 'Uncategorized';
        catCounts[cat] = (catCounts[cat] || 0) + 1;
    }

    // Sort same as groups
    const cats = Object.entries(catCounts).sort((a, b) => a[0].localeCompare(b[0]));

    let html = `<button class="filter-chip${activeCategory === 'all' ? ' active' : ''}" data-category="all">All <span class="filter-chip-count">${visible.length}</span></button>`;

    for (const [cat, count] of cats) {
        const color = getCategoryColor(cat);
        const isActive = activeCategory === cat;
        html += `<button class="filter-chip${isActive ? ' active' : ''}" data-category="${escHtml(cat)}">
            <span class="filter-chip-dot" style="background:${color}"></span>
            ${escHtml(cat)}
            <span class="filter-chip-count">${count}</span>
        </button>`;
    }

    chips.innerHTML = html;
}

function renderProjects() {
    const projects = getFilteredProjects();
    document.getElementById('projectCount').textContent = projects.length + ' project' + (projects.length !== 1 ? 's' : '');

    renderFilterChips();

    const container = document.getElementById('categorizedGrid');

    if (!projects.length) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></div><p>No matching projects</p></div>';
        return;
    }

    const groups = getGroups(projects);

    // If filtering to a single category, skip the header
    if (activeCategory !== 'all') {
        if (currentView === 'grid') {
            container.innerHTML = `<div class="categories-container"><div class="category-grid">${projects.map(p => cardHtml(p)).join('')}</div></div>`;
            bindCardEvents(container, 'card');
        } else {
            container.innerHTML = `<div class="categories-container"><div class="project-list">${projects.map(p => listRowHtml(p)).join('')}</div></div>`;
            bindCardEvents(container, 'list-row');
        }
        return;
    }

    let html = '<div class="categories-container">';
    for (const [cat, catProjects] of groups) {
        const color = getGroupColor(cat);
        const isCollapsed = collapsedCategories.has(cat);
        html += `<div class="category-group${isCollapsed ? ' collapsed' : ''}" data-category="${escHtml(cat)}">`;
        html += `<div class="category-header" data-toggle-category="${escHtml(cat)}" role="button" tabindex="0" aria-expanded="${isCollapsed ? 'false' : 'true'}" title="${isCollapsed ? 'Show' : 'Hide'} ${escHtml(cat)}">
            <span class="category-dot" style="background:${color}"></span>
            <span class="category-name">${escHtml(cat)}</span>
            <span class="category-count" aria-label="${catProjects.length} project${catProjects.length !== 1 ? 's' : ''}">${catProjects.length}</span>
            <svg class="category-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </div>`;

        if (currentView === 'grid') {
            html += `<div class="category-grid">${catProjects.map(p => cardHtml(p)).join('')}</div>`;
        } else {
            html += `<div class="project-list">${catProjects.map(p => listRowHtml(p)).join('')}</div>`;
        }

        html += '</div>';
    }
    html += '</div>';

    container.innerHTML = html;

    // Bind card events on the whole container
    bindCardEvents(container, currentView === 'grid' ? 'card' : 'list-row');

    // Bind category toggle
    container.querySelectorAll('[data-toggle-category]').forEach(header => {
        header.addEventListener('click', () => {
            const cat = header.dataset.toggleCategory;
            const group = header.closest('.category-group');
            if (collapsedCategories.has(cat)) {
                collapsedCategories.delete(cat);
                group.classList.remove('collapsed');
            } else {
                collapsedCategories.add(cat);
                group.classList.add('collapsed');
            }
            header.setAttribute('aria-expanded', String(!collapsedCategories.has(cat)));
        });
        header.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); header.click(); }
        });
    });

    // Enable drag-to-reorder when custom sort is active
    if (currentSort === 'custom') {
        bindDragReorder(container);
    }
}

// ── Drag-to-reorder (custom sort only) ────────────────────────────────────
function bindDragReorder(container) {
    const cards = Array.from(container.querySelectorAll('.project-card'));
    let dragSrc = null;

    cards.forEach(card => {
        card.setAttribute('draggable', 'true');

        card.addEventListener('dragstart', (e) => {
            dragSrc = card;
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', card.dataset.name);
        });

        card.addEventListener('dragend', () => {
            card.classList.remove('dragging');
            container.querySelectorAll('.project-card.drag-over').forEach(c => c.classList.remove('drag-over'));
            dragSrc = null;
        });

        card.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (dragSrc && card !== dragSrc) {
                container.querySelectorAll('.project-card.drag-over').forEach(c => c.classList.remove('drag-over'));
                card.classList.add('drag-over');
            }
        });

        card.addEventListener('dragleave', () => {
            card.classList.remove('drag-over');
        });

        card.addEventListener('drop', (e) => {
            e.preventDefault();
            card.classList.remove('drag-over');
            if (!dragSrc || dragSrc === card) return;

            // Determine new order from DOM positions
            const allCards = Array.from(container.querySelectorAll('.project-card'));
            const srcIdx = allCards.indexOf(dragSrc);
            const dstIdx = allCards.indexOf(card);

            // Re-insert dragSrc before or after card depending on direction
            if (srcIdx < dstIdx) {
                card.after(dragSrc);
            } else {
                card.before(dragSrc);
            }

            // Derive new order from updated DOM
            const newOrder = Array.from(container.querySelectorAll('.project-card'))
                .map(c => c.dataset.name)
                .filter(Boolean);

            // Persist to localStorage and server
            customOrder = newOrder;
            localStorage.setItem('cr-custom-order', JSON.stringify(customOrder));

            fetch('/api/projects/reorder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order: newOrder })
            }).catch(err => console.warn('[DragReorder] Server persist failed:', err));
        });
    });
}

function bindCardEvents(container, rowSelector) {
    // The container persists across renders: bind once, otherwise every re-render
    // stacked another listener and one click fired several activations/toasts.
    if (container._crCardsBound) return;
    container._crCardsBound = true;
    container.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        if (!e.target.matches('.project-card, .list-row')) return;
        e.preventDefault();
        activateProject(e.target.dataset.name);
    });
    container.addEventListener('click', async (e) => {
        const row = e.target.closest(`[data-name]`);
        if (!row) return;
        const name = row.dataset.name;
        const action = e.target.closest('[data-action]')?.dataset?.action;

        if (action === 'copy-path') {
            e.stopPropagation();
            const project = allProjects.find(p => p.name === name);
            if (project) {
                await copyText('cd ' + project.root);
                showToast('Path copied!', 'clipboard');
            }
            return;
        }

        if (action === 'kickstart') {
            e.stopPropagation();
            const data = await apiFetch(`/api/projects/${encodeURIComponent(name)}/kickstart`);
            const prompt = data?.prompt || data?.text || data?.kickstart || null;
            if (prompt) {
                await copyText(prompt);
                showToast('Kickstart prompt copied!', 'rocket');
            } else {
                const project = allProjects.find(p => p.name === name);
                if (project) {
                    await copyText(`Project: ${project.name}\nPath: ${project.root}\n\nPlease review this project and help me continue work on it.`);
                    showToast('Basic prompt copied!', 'rocket');
                }
            }
            return;
        }

        if (action === 'more') {
            e.stopPropagation();
            showContextMenu(e, name);
            return;
        }

        if (action === 'details') {
            e.stopPropagation();
            openDetail(name);
            return;
        }

        if (action === 'open' || !action) {
            activateProject(name);
        }
    });
}

async function activateProject(name) {
    try {
        const res = await fetch('/api/projects/' + encodeURIComponent(name) + '/activate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            showToast('Error: ' + (err.error || 'Failed to switch'), 'warning');
            return;
        }
        showToast('Switched to ' + name, 'check');
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'activate-and-navigate', target: 'kanban' }, '*');
        }
    } catch (err) {
        showToast('Network error switching project', 'warning');
    }
}

// ── Context Menu ───────────────────────────────────────────────────────────
function showContextMenu(e, projectName) {
    closeContextMenu();

    const menu = document.getElementById('contextMenu');
    const project = allProjects.find(p => p.name === projectName);
    const isArchived = project?.archived;

    menu.innerHTML = `
        <button type="button" class="context-item" role="menuitem" data-cmd="details">${ICONS.info}Details</button>
        <button type="button" class="context-item" role="menuitem" data-cmd="copy-path">${ICONS.copy}Copy path</button>
        <button type="button" class="context-item" role="menuitem" data-cmd="kickstart">${ICONS.spark}Copy kickstart</button>
        <div class="context-divider" role="separator"></div>
        <button type="button" class="context-item" role="menuitem" data-cmd="generate-cover">${ICONS.image}${project?.cover ? 'Regenerate cover' : 'Create cover'}</button>
        <button type="button" class="context-item" role="menuitem" data-cmd="${isArchived ? 'unarchive' : 'archive'}">${ICONS.archive}${isArchived ? 'Unarchive' : 'Archive'}</button>
        <button type="button" class="context-item danger" role="menuitem" data-cmd="delete">${ICONS.trash}Delete project</button>
    `;

    const btn = e.target.closest('[data-action="more"]');
    const rect = (btn || e.target).getBoundingClientRect();
    let top = rect.bottom + 4;
    let left = rect.left;

    // Viewport edge detection
    const menuW = 236;
    const menuH = 280;
    if (left + menuW > window.innerWidth) left = window.innerWidth - menuW - 8;
    if (top + menuH > window.innerHeight) top = rect.top - menuH - 4;

    menu.style.display = 'block';
    menu.style.top = top + 'px';
    menu.style.left = left + 'px';

    openContextMenu = { menu, projectName };

    menu.addEventListener('click', async (ev) => {
        const item = ev.target.closest('[data-cmd]');
        if (!item) return;
        const cmd = item.dataset.cmd;
        closeContextMenu();
        await handleContextCommand(cmd, projectName);
    }, { once: true });
}

function closeContextMenu() {
    if (openContextMenu) {
        openContextMenu.menu.style.display = 'none';
        openContextMenu = null;
    }
}

async function handleContextCommand(cmd, projectName) {
    const project = allProjects.find(p => p.name === projectName);
    if (!project) return;

    if (cmd === 'details') {
        openDetail(projectName);

    } else if (cmd === 'copy-path') {
        await copyText('cd ' + project.root);
        showToast('Path copied!', 'clipboard');

    } else if (cmd === 'kickstart') {
        const data = await apiFetch(`/api/projects/${encodeURIComponent(projectName)}/kickstart`);
        const prompt = data?.prompt || data?.text || `Project: ${project.name}\nPath: ${project.root}`;
        await copyText(prompt);
        showToast('Kickstart prompt copied!', 'rocket');

    } else if (cmd === 'archive' || cmd === 'unarchive') {
        const res = await apiFetch(`/api/projects/${encodeURIComponent(projectName)}/archive`, { method: 'POST' });
        project.archived = !project.archived;
        showToast(project.archived ? 'Project archived' : 'Project unarchived', 'check');
        renderProjects();
        if (detailProject?.name === projectName) openDetail(projectName);

    } else if (cmd === 'generate-cover') {
        // Find the card element and show a loading overlay
        const card = document.querySelector(`[data-name="${CSS.escape(projectName)}"]`);
        const coverEl = card?.querySelector('.card-cover-gradient, .list-thumb');
        const origContent = coverEl?.innerHTML;
        if (coverEl) {
            coverEl.style.position = 'relative';
            coverEl.insertAdjacentHTML('beforeend', '<div class="cover-generating" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(22,24,31,0.72);border-radius:inherit;" title="Generating cover"><div class="spinner"></div></div>');
        }
        showToast('Generating AI cover...', 'rocket');
        let res;
        try {
            const raw = await fetch(`/api/projects/${encodeURIComponent(projectName)}/generate-cover`, { method: 'POST' });
            res = await raw.json();
        } catch { res = null; }
        // Remove loading overlay
        const overlay = coverEl?.querySelector('.cover-generating');
        if (overlay) overlay.remove();
        if (res?.success && res?.coverUrl) {
            project.cover = res.coverUrl + '?t=' + Date.now();
            showToast('Cover generated!', 'check');
            renderProjects();
            if (detailProject?.name === projectName) openDetail(projectName);
        } else {
            showToast(res?.error || 'Cover generation failed', 'error');
        }

    } else if (cmd === 'delete') {
        if (!confirm(`Delete project "${projectName}" from Watchpost?\n\nThis only removes it from Watchpost — your files stay on disk.`)) return;
        await apiFetch(`/api/projects/${encodeURIComponent(projectName)}`, { method: 'DELETE' });
        allProjects = allProjects.filter(p => p.name !== projectName);
        showToast('Project removed', 'check');
        renderProjects();
        if (detailProject?.name === projectName) closeDetail();
    }
}

async function loadDetailExtras(name) {
    const [statsData, summaryData] = await Promise.all([
        apiFetch(`/api/projects/${encodeURIComponent(name)}/stats`),
        apiFetch(`/api/projects/${encodeURIComponent(name)}/summary`),
    ]);

    const summaryEl = document.getElementById('detailSummaryText');
    if (summaryEl) {
        const text = summaryData?.narrative || summaryData?.summary || summaryData?.text || null;
        summaryEl.style.fontStyle = text ? 'normal' : 'italic';
        summaryEl.textContent = text || 'No summary available.';
    }

    const commitsEl = document.getElementById('detailCommits');
    if (commitsEl) {
        const commits = summaryData?.recentCommits || statsData?.commits || summaryData?.commits || [];
        if (commits.length) {
            commitsEl.innerHTML = commits.slice(0, 6).map(c => {
                const msg = typeof c === 'string' ? c : (c.message || c.msg || JSON.stringify(c));
                return `<div class="commit-item">${escHtml(msg)}</div>`;
            }).join('');
        } else {
            commitsEl.innerHTML = '<div style="color:var(--text-subtle);font-size:var(--font-sm);font-style:italic;">No recent commits found.</div>';
        }
    }
}

function closeDetail() {
    document.getElementById('detailOverlay').classList.remove('open');
    detailProject = null;
}

// ── Notes ──────────────────────────────────────────────────────────────────
async function loadNotes() {
    const data = await apiFetch('/api/notes');
    if (Array.isArray(data)) {
        notes = data;
    } else {
        notes = [];
    }
    renderNotes();
}

function renderNotes() {
    const list = document.getElementById('notesList');
    let filtered = notes;

    if (notesFilter === 'active') filtered = notes.filter(n => !n.done);
    if (notesFilter === 'done') filtered = notes.filter(n => n.done);

    if (!filtered.length) {
        list.innerHTML = '<div class="empty-state small"><p>' + (notes.length ? 'Nothing here' : 'No notes yet') + '</p></div>';
        return;
    }

    list.innerHTML = filtered.map(n => `
        <div class="note-item" data-id="${escHtml(String(n.id))}">
            <input type="checkbox" class="note-check" ${n.done ? 'checked' : ''} data-note-id="${escHtml(String(n.id))}" aria-label="Mark done">
            <span class="note-text${n.done ? ' done' : ''}">${escHtml(n.text || n.title || n.content || '')}</span>
            <button class="note-delete" data-note-id="${escHtml(String(n.id))}" title="Delete" aria-label="Delete note">${ICONS.close}</button>
        </div>
    `).join('');
}

async function addNote(text) {
    if (!text.trim()) return;
    const data = await apiFetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text.trim(), type: 'task' })
    });

    if (data) {
        notes.unshift(data);
    } else {
        // Optimistic fallback
        notes.unshift({ id: Date.now(), text: text.trim(), done: false, createdAt: new Date().toISOString() });
    }
    renderNotes();
}

async function toggleNote(id) {
    const note = notes.find(n => String(n.id) === String(id));
    if (!note) return;
    note.done = !note.done;
    renderNotes();

    await apiFetch(`/api/notes/${encodeURIComponent(id)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done: note.done })
    });
}

async function deleteNote(id) {
    notes = notes.filter(n => String(n.id) !== String(id));
    renderNotes();
    await apiFetch(`/api/notes/${encodeURIComponent(id)}`, { method: 'DELETE' });
}

// ── Event wiring ───────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', renderProjects);

document.getElementById('filterChips').addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    const cat = chip.dataset.category;
    if (activeCategory === cat && cat !== 'all') {
        activeCategory = 'all'; // Toggle off
    } else {
        activeCategory = cat;
    }
    renderProjects();
});

document.getElementById('showArchived').addEventListener('change', (e) => {
    showArchived = e.target.checked;
    renderProjects();
});

document.getElementById('viewGrid').addEventListener('click', () => {
    currentView = 'grid';
    document.getElementById('viewGrid').classList.add('active');
    document.getElementById('viewList').classList.remove('active');
    renderProjects();
});

document.getElementById('viewList').addEventListener('click', () => {
    currentView = 'list';
    document.getElementById('viewList').classList.add('active');
    document.getElementById('viewGrid').classList.remove('active');
    renderProjects();
});

document.getElementById('sortSelect').addEventListener('change', (e) => {
    currentSort = e.target.value;
    localStorage.setItem('cr-sort', currentSort);

    if (currentSort === 'custom') {
        // Initialize customOrder from the current visible order if empty
        if (!customOrder.length) {
            customOrder = getFilteredProjects().map(p => p.name);
            localStorage.setItem('cr-custom-order', JSON.stringify(customOrder));
        }
        // Auto-switch group-by to none for flat drag-friendly layout
        if (currentGroupBy !== 'none') {
            currentGroupBy = 'none';
            localStorage.setItem('cr-groupby', currentGroupBy);
            document.getElementById('groupBySelect').value = 'none';
        }
    }

    renderProjects();
});

document.getElementById('groupBySelect').addEventListener('change', (e) => {
    currentGroupBy = e.target.value;
    localStorage.setItem('cr-groupby', currentGroupBy);
    activeCategory = 'all';
    collapsedCategories.clear();
    renderProjects();
});

// Close on overlay background click (but not on panel itself)
document.getElementById('detailOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('detailOverlay')) closeDetail();
});
// Close button is injected dynamically — use event delegation on panel
document.getElementById('detailPanel').addEventListener('click', (e) => {
    if (e.target.closest('#detailClose')) closeDetail();
});

document.getElementById('notesHeaderToggle').addEventListener('click', (e) => {
    if (e.target.closest('button') === null) return; // Only toggle on btn click
});

document.getElementById('notesToggleBtn').addEventListener('click', () => {
    notesCollapsed = !notesCollapsed;
    const body = document.getElementById('notesBody');
    const btn = document.getElementById('notesToggleBtn');
    if (notesCollapsed) {
        body.classList.add('hidden');
        btn.classList.add('collapsed');
        btn.title = 'Expand';
    } else {
        body.classList.remove('hidden');
        btn.classList.remove('collapsed');
        btn.title = 'Collapse';
    }
    btn.setAttribute('aria-expanded', String(!notesCollapsed));
    btn.setAttribute('aria-label', notesCollapsed ? 'Expand notes' : 'Collapse notes');
    document.getElementById('notesSection').classList.toggle('is-collapsed', notesCollapsed);
});

document.getElementById('noteInput').addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') {
        const val = e.target.value;
        e.target.value = '';
        await addNote(val);
    }
});

document.getElementById('noteAddBtn').addEventListener('click', async () => {
    const input = document.getElementById('noteInput');
    const val = input.value;
    input.value = '';
    await addNote(val);
});

document.getElementById('notesList').addEventListener('change', async (e) => {
    if (e.target.classList.contains('note-check')) {
        await toggleNote(e.target.dataset.noteId);
    }
});

document.getElementById('notesList').addEventListener('click', async (e) => {
    const btn = e.target.closest('.note-delete');
    if (btn) {
        await deleteNote(btn.dataset.noteId);
    }
});

document.getElementById('notesFilter').addEventListener('click', (e) => {
    const btn = e.target.closest('.notes-filter-btn');
    if (!btn) return;
    notesFilter = btn.dataset.filter;
    document.querySelectorAll('.notes-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderNotes();
});

// Close context menu on outside click
document.addEventListener('click', (e) => {
    if (openContextMenu && !openContextMenu.menu.contains(e.target)) {
        closeContextMenu();
    }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        if (openContextMenu) { closeContextMenu(); return; }
        if (detailProject) { closeDetail(); return; }
    }
});

// Listen for tab-activated message from parent
window.addEventListener('message', (e) => {
    if (e.data?.type === 'tab-activated') {
        loadProjects();
        loadNotes();
    }
});

// ── Init ───────────────────────────────────────────────────────────────────
loadProjects();
loadNotes();

// Restore sort preference from localStorage
currentSort = localStorage.getItem('cr-sort') || 'lastActive';
document.getElementById('sortSelect').value = currentSort;

// Restore custom order from localStorage
const savedCustomOrder = localStorage.getItem('cr-custom-order');
if (savedCustomOrder) {
    try { customOrder = JSON.parse(savedCustomOrder); } catch (e) { customOrder = []; }
}

// Restore group-by preference from localStorage
currentGroupBy = localStorage.getItem('cr-groupby') || 'category';
document.getElementById('groupBySelect').value = currentGroupBy;
</script>
</body>
</html>
