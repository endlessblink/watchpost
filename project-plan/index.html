<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project plan · Watchpost</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dusk-tokens.css">
  <style>
    :root { color-scheme: dark; }
    body { max-width: 1180px; margin: 0 auto; padding: 18px 24px 56px; height: auto; }
    .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
    h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
    .lede { margin: 6px 0 0; color: var(--text-3); font-size: 13.5px; line-height: 1.5; max-width: 70ch; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 18px 0 14px; }
    nav .views { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface); }
    nav a { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 9px; color: var(--text-3); font-size: 13.5px; font-weight: 500; transition: background .15s, color .15s; }
    nav a:hover { color: var(--text); }
    nav a[aria-current="page"] { background: var(--card-2); color: var(--text); }
    #refresh { width: 40px; height: 40px; margin-left: auto; border: 0; border-radius: var(--r-btn); background: transparent; color: var(--text-2); display: grid; place-items: center; transition: background .15s, color .15s; }
    #refresh:hover { background: var(--card); color: var(--text); }
    #refresh:active svg { transform: rotate(-90deg); transition: transform .2s; }
    #notice { margin: 0 0 12px; color: var(--text-3); font-size: 13px; line-height: 1.5; }
    .scroll { overflow-x: auto; background: var(--surface); border-radius: var(--r-col); padding: 6px; }
    table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 650px; font-size: 13.5px; }
    th, td { padding: 11px 12px; text-align: left; vertical-align: top; line-height: 1.45; }
    th { color: var(--text-3); font-size: 12px; font-weight: 500; }
    td { border-top: 1px solid var(--line); color: var(--text-2); }
    tbody tr:hover td { background: var(--card); }
    tbody tr:hover td:first-child { border-radius: 10px 0 0 10px; }
    tbody tr:hover td:last-child { border-radius: 0 10px 10px 0; }
    td:first-child { white-space: nowrap; font-family: var(--f-mono); font-size: 12px; color: var(--text-3); }
    td:nth-child(2) { color: var(--text); }
    td:nth-child(3), td:nth-child(4), td:nth-child(5), td:nth-child(6) { font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
    details { margin-top: 16px; background: var(--surface); border-radius: var(--r-card); }
    summary { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; cursor: pointer; color: var(--text-2); font-size: 14px; list-style: none; border-radius: var(--r-card); }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: ""; width: 7px; height: 7px; border-right: 1.75px solid var(--text-3); border-bottom: 1.75px solid var(--text-3); transform: rotate(-45deg); transition: transform .2s; }
    details[open] > summary::before { transform: rotate(45deg); border-color: var(--accent); }
    summary:hover { background: var(--card); color: var(--text); }
    pre { margin: 0; padding: 4px 18px 18px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; font-family: var(--f-mono); font-size: 12.5px; color: var(--text-2); }
    #updated { margin: 14px 2px 0; font-family: var(--f-mono); font-size: 11.5px; color: var(--text-3); overflow-wrap: anywhere; }
    @media (max-width: 600px) { body { padding: 14px 14px 40px; } .scroll { border-radius: var(--r-card); } }
  </style>
</head>
<body>
  <div class="top"><h1 id="title">Project plan</h1></div>
  <p class="lede">Read-only view of the saved master plan. This page does not switch Watchpost’s active project or change task status.</p>
  <nav aria-label="Task categories">
    <div class="views">
      <a data-category="all" href="?project=imaginebox&amp;category=all">All tasks</a>
      <a data-project="finetuned" href="?project=finetuned">Finetuned</a>
      <a data-project="imaginebox" href="?project=imaginebox">ImagineBox</a>
    </div>
    <button id="refresh" type="button" title="Refresh" aria-label="Refresh"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4.5V11h-6.5"/></svg></button>
  </nav>
  <p id="notice" role="status">Loading saved plan…</p>
  <div class="scroll"><table aria-label="Project tasks"><thead><tr><th>Task</th><th>Work</th><th>Priority</th><th>Status</th><th>Dependencies</th><th>Category</th></tr></thead><tbody id="tasks"></tbody></table></div>
  <details><summary>Full master plan, decisions and acceptance checks</summary><pre id="plan"></pre></details>
  <p id="updated"></p>
  <script src="view.js"></script>
</body>
</html>
