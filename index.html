<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchpost - AI Agent Orchestration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dusk-tokens.css">
    <link rel="stylesheet" href="shell.css">
</head>

<body>
    <div class="shell">
    <aside class="rail" aria-label="Watchpost">
        <div class="mark" title="Watchpost" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M3 12a9 9 0 019-9M21 12a9 9 0 01-9 9"/></svg></div>
        <nav class="tabs" aria-label="Sections">
            <button class="tab projects" data-panel="projects" title="Projects" aria-label="Projects"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></span><span class="label">Projects</span></button>
            <button class="tab kanban active" data-panel="kanban" title="Board" aria-label="Board"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg></span><span class="label">Board</span></button>
            <button class="tab flow" data-panel="flow" title="Flow" aria-label="Flow"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 8.5v7M18 11.5c0 4-12 1-12 4"/></svg></span><span class="label">Flow</span></button>
            <button class="tab changelog" data-panel="changelog" title="Agent log" aria-label="Agent log"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h11a2 2 0 012 2v11a3 3 0 01-3 3H7a3 3 0 01-3-3V7"/><path d="M4 7a3 3 0 013-3M9 9h7M9 13h7"/></svg></span><span class="label">Agent log</span></button>
            <button class="tab docs" data-panel="docs" title="Docs" aria-label="Docs"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/></svg></span><span class="label">Docs</span></button>
            <button class="tab skills" data-panel="skills" title="Skills" aria-label="Skills"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></span><span class="label">Skills</span></button>
            <button class="tab stats" data-panel="stats" title="Stats" aria-label="Stats"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg></span><span class="label">Stats</span></button>
            <button class="tab health" data-panel="health" title="Health" aria-label="Health"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12L16 12h5"/></svg></span><span class="label">Health</span></button>
            <button class="tab vps" data-panel="vps" title="Server" aria-label="Server"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2.5"/><rect x="3" y="13" width="18" height="7" rx="2.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></span><span class="label">Server</span></button>
            <button class="tab bots" data-panel="bots" title="Bots" aria-label="Bots"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="4"/><path d="M12 8V4M9 14h.01M15 14h.01"/></svg></span><span class="label">Bots</span></button>
        </nav>
        <div class="spacer"></div>
        <div class="rail-foot">
        <div class="project-switcher-wrap">
            <button id="active-project-badge" class="project-switcher-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="project-switcher-popover" title="Switch active project">
                <span class="initial" id="active-project-initial" aria-hidden="true">?</span>
                <span class="project-switcher-dot" aria-hidden="true"></span>
                <span class="project-switcher-label">Active</span>
                <span id="active-project-badge-name" class="project-switcher-name">—</span>
                <svg class="project-switcher-caret" viewBox="0 0 20 20" width="12" height="12" fill="none" aria-hidden="true">
                    <path d="M5 7l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div id="project-switcher-popover" class="project-switcher-popover" role="listbox" aria-label="Switch project" hidden>
                <div class="project-switcher-header">
                    <input id="project-switcher-search" class="project-switcher-search" type="text" placeholder="Search projects…" autocomplete="off" spellcheck="false" />
                </div>
                <div id="project-switcher-list" class="project-switcher-list" role="presentation">
                    <div class="project-switcher-empty">Loading…</div>
                </div>
                <button id="project-switcher-manage" class="project-switcher-footer" type="button">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                    <span>Manage all projects</span>
                    <span class="project-switcher-footer-arrow" aria-hidden="true">→</span>
                </button>
            </div>
        </div>

        <div class="usage-chip" id="usage-chip">
            <button class="usage-btn" id="usage-btn" type="button" aria-haspopup="true" aria-expanded="false" title="Usage" aria-label="Usage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16a8 8 0 1116 0"/><path d="M12 16l4-5"/></svg><span class="usage-pct" id="usage-pct"></span></button>
            <div class="usage-pop" id="usage-pop" hidden></div>
        </div>

        
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode">
            <!-- Moon icon - shown in dark mode (click to switch to light) -->
            <svg class="icon-moon" viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <!-- Sun icon - shown in light mode (click to switch to dark) -->
            <svg class="icon-sun" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5" />
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
        </button>
        </div>
    </aside>

    <div id="project-toast" class="project-toast"></div>

    <main class="content">
        <div id="projects" class="panel">
            <iframe data-src="controlroom/index.html" title="Projects"></iframe>
        </div>
        <div id="kanban" class="panel active">
            <iframe src="kanban/index.html" title="Development Kanban"></iframe>
        </div>
        <div id="flow" class="panel">
            <!-- Lazy load so the canvas measures a visible container on first render. -->
            <iframe data-src="flow/index.html" title="Work Lanes"></iframe>
        </div>
        <div id="skills" class="panel">
            <!-- Lazy load: src set on first tab activation to ensure container has dimensions -->
            <iframe data-src="skills/index.html" title="Skills Dashboard"></iframe>
        </div>
        <div id="docs" class="panel">
            <!-- Lazy load: src set on first tab activation to ensure container has dimensions -->
            <iframe data-src="docs/index.html" title="Documentation Canvas"></iframe>
        </div>
        <div id="stats" class="panel">
            <!-- Lazy load: src set on first tab activation -->
            <iframe data-src="stats/index.html" title="Statistics Dashboard"></iframe>
        </div>
        <div id="health" class="panel">
            <!-- Lazy load: src set on first tab activation -->
            <iframe data-src="health/index.html" title="Health Dashboard"></iframe>
        </div>
        <div id="changelog" class="panel">
            <!-- Lazy load: src set on first tab activation -->
            <iframe data-src="changelog/index.html" title="Agent Changelog"></iframe>
        </div>
        <div id="vps" class="panel">
            <!-- Lazy load: src set on first tab activation -->
            <iframe data-src="vps/index.html" title="VPS Monitor"></iframe>
        </div>
        <div id="bots" class="panel">
            <!-- Lazy load: src set on first tab activation -->
            <iframe data-src="bots/index.html" title="Bots & Personas"></iframe>
        </div>
    </main>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const panels = document.querySelectorAll('.panel');

        // Restore saved tab
        const savedTab = localStorage.getItem('watchpost-tab');
        if (savedTab) {
            switchTab(savedTab);
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const panelId = tab.dataset.panel;
                switchTab(panelId);
                localStorage.setItem('watchpost-tab', panelId);
            });
        });

        function switchTab(panelId) {
            tabs.forEach(t => t.classList.remove('active'));
            panels.forEach(p => p.classList.remove('active'));

            const activeTab = document.querySelector(`.tab[data-panel="${panelId}"]`);
            const activePanel = document.getElementById(panelId);

            if (activeTab && activePanel) {
                activeTab.classList.add('active');
                activePanel.classList.add('active');

                const iframe = activePanel.querySelector('iframe');
                if (iframe) {
                    // Lazy load iframe on first activation
                    if (iframe.dataset.src && !iframe.src) {
                        iframe.src = iframe.dataset.src;
                    } else if (iframe.contentWindow) {
                        // Send refresh message on subsequent activations
                        // This fixes Chromium canvas disappearing bug
                        iframe.contentWindow.postMessage({ type: 'tab-activated' }, '*');
                    }
                }
            }
        }

        // Theme Toggle Functionality
        const themeToggle = document.getElementById('theme-toggle');
        const THEME_KEY = 'watchpost-theme';

        // Initialize theme from localStorage or default to dark
        function initTheme() {
            const savedTheme = localStorage.getItem(THEME_KEY);
            // Dusk is dark only; the old light theme is retired.
            setTheme('dark');
        }

        // Set theme and update UI
        function setTheme(theme) {
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggle.setAttribute('aria-label', 'Switch to dark mode');
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.setAttribute('aria-label', 'Switch to light mode');
            }
            // Notify iframes about theme change
            notifyIframesThemeChange(theme);
        }

        // Toggle between light and dark themes
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
            localStorage.setItem(THEME_KEY, newTheme);
        }

        // Notify all iframes about theme change
        function notifyIframesThemeChange(theme) {
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                if (iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'theme-change', theme: theme }, '*');
                }
            });
        }

        // Event listener for toggle button
        themeToggle.addEventListener('click', toggleTheme);

        // Initialize theme on page load
        initTheme();

        // --- Project Switcher ---
        const projectToast = document.getElementById('project-toast');
        let toastTimer = null;

        function showToast(message) {
            projectToast.textContent = message;
            projectToast.classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => projectToast.classList.remove('visible'), 2500);
        }

        let activeProjectName = '';

        function setActiveBadge(name) {
            activeProjectName = name || '';
            const el = document.getElementById('active-project-badge-name');
            if (el) el.textContent = activeProjectName || '—';
            const ini = document.getElementById('active-project-initial');
            if (ini) ini.textContent = (activeProjectName || '?').trim().charAt(0).toUpperCase() || '?';
            const trg = document.getElementById('active-project-badge');
            if (trg) trg.title = 'Project: ' + (activeProjectName || 'none') + ' (switch)';
        }

        function refreshKanban() {
            const kanbanIframe = document.querySelector('#kanban iframe');
            if (kanbanIframe && kanbanIframe.contentWindow) {
                kanbanIframe.contentWindow.location.reload();
            }
        }

        // Notify ALL loaded iframes about project switch
        function broadcastProjectSwitch(projectInfo) {
            const project = typeof projectInfo === 'string' ? { name: projectInfo } : (projectInfo || {});
            document.querySelectorAll('.panel iframe').forEach(iframe => {
                if (iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'project-switch', project: project.name }, '*');
                    iframe.contentWindow.postMessage({
                        type: 'switch-project',
                        project: project.name,
                        projectRoot: project.root || '',
                        masterPlanPath: project.masterPlan || ''
                    }, '*');
                }
            });
        }

        window.addEventListener('message', (event) => {
            if (event.data?.type !== 'activate-and-navigate' || !event.data.target) return;
            const targetPanel = document.getElementById(event.data.target);
            if (!targetPanel) return;
            const targetIframe = targetPanel.querySelector('iframe');
            const alreadyLoaded = targetIframe && !!targetIframe.src;
            switchTab(event.data.target);
            localStorage.setItem('watchpost-tab', event.data.target);
            if (alreadyLoaded && targetIframe.contentWindow && event.data.taskId) {
                targetIframe.contentWindow.postMessage({ type: 'focus-task', taskId: event.data.taskId }, '*');
            }
        });

        // SSE: listen for project-changed events from other clients
        const evtSource = new EventSource('/api/events');
        evtSource.addEventListener('message', (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'project-changed' && msg.project) {
                    setActiveBadge(msg.project.name);
                    if (window.reloadProjectSwitcher) window.reloadProjectSwitcher();
                    showToast('Project changed to ' + msg.project.name);
                    refreshKanban();
                    broadcastProjectSwitch(msg.project);
                }
            } catch (_) {}
        });

        // ── Project Switcher init ──────────────────────────────────────────
        (function initProjectSwitcher() {
            const trigger = document.getElementById('active-project-badge');
            const popover = document.getElementById('project-switcher-popover');
            const search = document.getElementById('project-switcher-search');
            const list = document.getElementById('project-switcher-list');
            const manageBtn = document.getElementById('project-switcher-manage');
            if (!trigger || !popover || !search || !list || !manageBtn) return;

            let projects = null;
            let activeMasterPlan = '';
            let filter = '';
            let highlight = 0;
            let isOpen = false;
            let fetching = false;

            function escapeHtml(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            function initialOf(name) {
                const ch = (name || '?').trim().charAt(0).toUpperCase();
                return ch || '?';
            }

            function composeMeta(p) {
                if (p.planDoor) return p.planCategory === 'finetuned' ? 'Finetuned production' : 'ImagineBox product';
                const parts = [];
                const s = p.taskStats || {};
                if (s.inProgress) parts.push(`${s.inProgress} active`);
                if (s.done) parts.push(`${s.done} done`);
                if (p.commits7d) parts.push(`${p.commits7d} commits · 7d`);
                if (!parts.length) parts.push(p.archived ? 'archived' : 'no activity');
                return parts.join(' <span class="dot">·</span> ');
            }

            function isActiveProject(p) {
                if (activeProjectName) return p.name === activeProjectName;
                if (activeMasterPlan && p.masterPlan) return p.masterPlan === activeMasterPlan;
                return p.name === activeProjectName;
            }

            function sortProjects(items) {
                return items.slice().sort((a, b) => {
                    const aActive = isActiveProject(a) ? 1 : 0;
                    const bActive = isActiveProject(b) ? 1 : 0;
                    if (aActive !== bActive) return bActive - aActive;
                    const aArch = a.archived ? 1 : 0;
                    const bArch = b.archived ? 1 : 0;
                    if (aArch !== bArch) return aArch - bArch;
                    const aT = Date.parse(a.lastActivity || '') || 0;
                    const bT = Date.parse(b.lastActivity || '') || 0;
                    return bT - aT;
                });
            }

            function applyFilter(items) {
                if (!filter) return items;
                const q = filter.toLowerCase();
                return items.filter(p =>
                    (p.name && p.name.toLowerCase().includes(q)) ||
                    (p.root && p.root.toLowerCase().includes(q))
                );
            }

            function render() {
                if (fetching && !projects) {
                    list.innerHTML = '<div class="project-switcher-empty">Loading…</div>';
                    return;
                }
                if (!projects) {
                    list.innerHTML = `
                        <div class="project-switcher-error">
                            Couldn't load projects.
                            <br><button class="project-switcher-retry" type="button" data-action="retry">Retry</button>
                        </div>`;
                    return;
                }
                const filtered = applyFilter(sortProjects(projects));
                if (!filtered.length) {
                    list.innerHTML = `<div class="project-switcher-empty">No projects match "${escapeHtml(filter)}"</div>`;
                    return;
                }
                if (highlight >= filtered.length) highlight = 0;

                list.innerHTML = filtered.map((p, i) => {
                    const isActive = isActiveProject(p);
                    const isDisabled = !p.masterPlan;
                    const classes = [
                        'project-switcher-item',
                        isActive ? 'is-active' : '',
                        p.archived ? 'is-archived' : '',
                        isDisabled ? 'is-disabled' : '',
                        i === highlight ? 'is-highlighted' : ''
                    ].filter(Boolean).join(' ');

                    const coverInner = p.coverUrl
                        ? `<img src="${escapeHtml(p.coverUrl)}" alt="" onerror="this.remove()" />`
                        : escapeHtml(initialOf(p.name));

                    const checkMark = isActive
                        ? `<svg class="project-switcher-item-check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>`
                        : '';

                    const metaBits = [];
                    if (isDisabled) metaBits.push('<span style="color:#f59e0b">no MASTER_PLAN.md</span>');
                    else metaBits.push(composeMeta(p));

                    return `
                        <button type="button" class="${classes}" role="option" aria-selected="${isActive ? 'true' : 'false'}" data-idx="${i}" ${isDisabled ? 'aria-disabled="true"' : ''}>
                            <span class="project-switcher-item-cover">${coverInner}</span>
                            <span class="project-switcher-item-body">
                                <span class="project-switcher-item-name">${escapeHtml(p.name)}</span>
                                <span class="project-switcher-item-meta">${metaBits.join('')}</span>
                            </span>
                            ${checkMark}
                        </button>
                    `;
                }).join('');

                list.querySelectorAll('.project-switcher-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const idx = Number(el.dataset.idx);
                        const p = filtered[idx];
                        if (p) activateProject(p);
                    });
                    el.addEventListener('mousemove', () => {
                        const idx = Number(el.dataset.idx);
                        if (idx !== highlight) {
                            highlight = idx;
                            updateHighlightClasses();
                        }
                    });
                });
                const retryBtn = list.querySelector('[data-action="retry"]');
                if (retryBtn) retryBtn.addEventListener('click', loadProjectList);

                const hl = list.querySelector('.is-highlighted');
                if (hl) hl.scrollIntoView({ block: 'nearest' });
            }

            function updateHighlightClasses() {
                const items = list.querySelectorAll('.project-switcher-item');
                items.forEach((el, i) => {
                    el.classList.toggle('is-highlighted', i === highlight);
                });
                const hl = items[highlight];
                if (hl) hl.scrollIntoView({ block: 'nearest' });
            }

            async function loadProjectList() {
                fetching = true;
                render();
                try {
                    const [enrichedRes, statusRes] = await Promise.all([
                        fetch('/api/projects/enriched'),
                        fetch('/api/status').catch(() => null)
                    ]);
                    if (!enrichedRes.ok) throw new Error(`HTTP ${enrichedRes.status}`);
                    const data = await enrichedRes.json();
                    projects = Array.isArray(data) ? data : [];
                    if (statusRes && statusRes.ok) {
                        const status = await statusRes.json();
                        activeMasterPlan = status.masterPlanPath || '';
                        const activeProj = projects.find(p => p.name === status.projectName) || projects.find(p => p.masterPlan === activeMasterPlan);
                        if (activeProj) setActiveBadge(activeProj.name);
                    }
                } catch (err) {
                    projects = null;
                    console.warn('[project-switcher] Failed to load projects:', err);
                } finally {
                    fetching = false;
                    render();
                }
            }

            window.reloadProjectSwitcher = () => {
                projects = null;
                if (isOpen) loadProjectList();
            };

            async function activateProject(p) {
                if (!p.masterPlan) {
                    showTransientError(`${p.name} has no MASTER_PLAN.md`);
                    return;
                }
                if (isActiveProject(p)) {
                    closePopover();
                    switchTab('kanban');
                    localStorage.setItem('watchpost-tab', 'kanban');
                    return;
                }
                try {
                    const res = await fetch('/api/projects/' + encodeURIComponent(p.name) + '/activate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err.error || `HTTP ${res.status}`);
                    }
                    const data = await res.json();
                    activeMasterPlan = p.masterPlan;
                    setActiveBadge(p.name);
                    projects = null;
                    closePopover();
                    showToast('Switched to ' + p.name);
                    refreshKanban();
                    broadcastProjectSwitch(data.activated || { name: p.name, root: p.root, masterPlan: p.masterPlan });
                    switchTab('kanban');
                    localStorage.setItem('watchpost-tab', 'kanban');
                } catch (err) {
                    console.error('[project-switcher] Switch failed:', err);
                    showTransientError(`Switch failed: ${err.message || err}`);
                }
            }

            function showTransientError(msg) {
                const existing = list.querySelector('.project-switcher-error.transient');
                if (existing) existing.remove();
                const div = document.createElement('div');
                div.className = 'project-switcher-error transient';
                div.textContent = msg;
                list.prepend(div);
                setTimeout(() => div.remove(), 3500);
            }

            function openPopover() {
                if (isOpen) return;
                isOpen = true;
                popover.hidden = false;
                trigger.setAttribute('aria-expanded', 'true');
                filter = '';
                highlight = 0;
                search.value = '';
                if (!projects) loadProjectList(); else render();
                requestAnimationFrame(() => search.focus());
            }

            function closePopover() {
                if (!isOpen) return;
                isOpen = false;
                popover.hidden = true;
                trigger.setAttribute('aria-expanded', 'false');
            }

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isOpen) closePopover(); else openPopover();
            });

            popover.addEventListener('click', (e) => { e.stopPropagation(); });

            search.addEventListener('input', () => {
                filter = search.value;
                highlight = 0;
                render();
            });

            search.addEventListener('keydown', (e) => {
                const items = list.querySelectorAll('.project-switcher-item');
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (items.length) { highlight = (highlight + 1) % items.length; updateHighlightClasses(); }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (items.length) { highlight = (highlight - 1 + items.length) % items.length; updateHighlightClasses(); }
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    const el = items[highlight];
                    if (el) el.click();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closePopover();
                    trigger.focus();
                }
            });

            manageBtn.addEventListener('click', () => {
                closePopover();
                switchTab('projects');
                localStorage.setItem('watchpost-tab', 'projects');
            });

            document.addEventListener('click', (e) => {
                if (!isOpen) return;
                if (popover.contains(e.target) || trigger.contains(e.target)) return;
                closePopover();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isOpen) {
                    closePopover();
                    trigger.focus();
                }
            });

            document.querySelectorAll('.tab').forEach(t => {
                t.addEventListener('click', () => { if (isOpen) closePopover(); });
            });

            window.addEventListener('blur', () => { if (isOpen) closePopover(); });

            // Prime the active badge on startup
            loadProjectList();
        })();
    </script>
<script>
(function(){
  var b=document.getElementById('usage-btn'),p=document.getElementById('usage-pop');
  function load(){fetch('/api/usage').then(function(r){return r.json()}).then(function(d){
    var w=d.windows||[];
    if(!w.length){p.textContent='No usage data yet.';return}
    var pc=document.getElementById('usage-pct');if(pc)pc.textContent=(100-w[0].percentUsed);b.title=w[0].label+': '+(100-w[0].percentUsed)+'% left';
    p.innerHTML=w.map(function(x){return '<div class="usage-row"><div><span>'+x.label+'</span><span>'+(100-x.percentUsed)+'% left</span></div><div class="usage-bar"><i class="'+(x.percentUsed>=80?'hot':'')+'" style="width:'+x.percentUsed+'%"></i></div><div class="usage-sub">Resets in '+x.resetsIn+'</div></div>'}).join('')
  }).catch(function(){p.textContent='Usage unavailable.'})}
  b.addEventListener('click',function(e){e.stopPropagation();p.hidden=!p.hidden;b.setAttribute('aria-expanded',!p.hidden);if(!p.hidden)load()});
  document.addEventListener('click',function(e){if(!p.contains(e.target)){p.hidden=true}});
  load();
})();
</script>
