<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docs · Watchpost</title>
    <script src="https://unpkg.com/d3@7"></script>
    <script src="https://unpkg.com/force-graph"></script>
    <script src="https://unpkg.com/marked@9.1.6/marked.min.js"></script>
    <script src="https://unpkg.com/mermaid@11/dist/mermaid.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../dusk-tokens.css">
    <link rel="stylesheet" href="dusk.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">Docs</h1>

            <div class="stats" aria-label="Document counts">
                <div class="stat" title="Active docs">
                    <span class="sr">Active:</span>
                    <span class="stat-value" id="activeCount">0</span>
                    <span class="stat-unit" aria-hidden="true">docs</span>
                </div>
                <div class="stat stat-archived" title="Archived docs">
                    <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="4.5" rx="1.5"/><path d="M5 9v8.5A2.5 2.5 0 007.5 20h9a2.5 2.5 0 002.5-2.5V9M10 13h4"/></svg>
                    <span class="sr">Archived:</span>
                    <span class="stat-value" id="archivedCount">0</span>
                </div>
            </div>

            <div class="header-actions">
                <div class="search-box" id="searchBox">
                    <label class="search-icon" for="search" title="Search docs">
                        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
                    </label>
                    <input type="search" class="search-input" id="search" placeholder="Search docs" aria-label="Search docs" autocomplete="off">
                </div>

                <div class="toggle-group">
                    <label class="toggle-label tb" title="Hide archived docs">
                        <input type="checkbox" class="toggle-checkbox" id="hideArchived" checked aria-label="Hide archived docs">
                        <svg class="ic ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.5-6.5 9-6.5S21 12 21 12s-3.5 6.5-9 6.5S3 12 3 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
                        <svg class="ic ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M9.6 5.9A9.6 9.6 0 0112 5.5c5.5 0 9 6.5 9 6.5a15 15 0 01-2.6 3.3M6.4 7.6A14.6 14.6 0 003 12s3.5 6.5 9 6.5a9 9 0 004-.9M10.2 10.2a2.6 2.6 0 003.6 3.6"/></svg>
                    </label>
                </div>
            </div>
        </header>

        <div class="graph-container">
            <div id="graph"></div>

            <div class="controls" role="group" aria-label="Zoom">
                <button class="control-btn" id="zoomIn" title="Zoom in" aria-label="Zoom in"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
                <button class="control-btn" id="zoomOut" title="Zoom out" aria-label="Zoom out"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
                <button class="control-btn" id="zoomFit" title="Fit to view" aria-label="Fit to view"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V6.5A2.5 2.5 0 016.5 4H9M15 4h2.5A2.5 2.5 0 0120 6.5V9M20 15v2.5a2.5 2.5 0 01-2.5 2.5H15M9 20H6.5A2.5 2.5 0 014 17.5V15"/></svg></button>
            </div>

            <!-- Content panel - slide-in from right -->
            <aside class="content-panel" id="contentPanel" aria-label="Document">
                <div class="content-panel-header">
                    <div class="content-panel-heading">
                        <div class="content-panel-title" id="contentTitle"></div>
                        <div class="content-panel-path" id="contentPath"></div>
                    </div>
                    <button class="content-panel-usage" id="usageToggle" title="Usage" aria-label="Show usage" aria-expanded="false" aria-controls="usageStats"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg></button>
                    <button class="content-panel-close" id="contentClose" title="Close (Esc)" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
                </div>
                <div class="usage-stats" id="usageStats"></div>
                <div class="content-panel-body" id="contentBody">
                    <div class="content-loading">Loading...</div>
                </div>
            </aside>

            <div class="legend" tabindex="0" aria-label="Categories">
                <div class="legend-title">Categories</div>
                <div class="legend-items" id="legendItems"></div>
            </div>
        </div>
    </div>

    <script>
        // Category colors
        // Dusk palette: soft, low-contrast tones per category (data colours are ignored on purpose)
        const COLORS = {
            'reports': '#D9B26F',
            'conflict-systems-resolution': '#B59AD9',
            'archive': '#5E6477',
            'debug': '#D58E8E',
            'guides': '#8DBF9A',
            'planning': '#8DA2CB',
            'plan': '#8DA2CB',
            'architecture': '#B59AD9',
            'reference': '#D9B26F',
            'default': '#7E869A',
            'other': '#7E869A'
        };
        const DUSK = {
            surface: '#1C1F28', card: '#252936', text: '#D3D8E2', text2: '#9BA2B4', text3: '#868DA2',
            accent: '#7CC3B3', line: 'rgba(155, 162, 180, 0.14)'
        };
        const toneOf = node => node.isArchived ? COLORS.archive : (COLORS[node.category] || COLORS.other);
        const plainTitle = t => String(t || '').replace(/[\p{Extended_Pictographic}️‍]/gu, '').trim();
        const LABEL_MIN_SCALE = 0.1; // below this zoom, doc labels hide (hover still shows them)
        let searchTerm = '';
        const matchesSearch = node => !!searchTerm && (node.title?.toLowerCase().includes(searchTerm) || node.path?.toLowerCase().includes(searchTerm));

        let graphData = null;
        let graph = null;
        window._graph = null;
        let selectedNode = null;
        let hoveredNode = null;

        // =============================================
        // Usage tracking via localStorage (timestamped)
        // =============================================
        const USAGE_STORAGE_KEY = 'docs-graph-usage';
        const USAGE_HISTORY_KEY = 'docs-graph-usage-history';

        function getUsageCounts() {
            try {
                return JSON.parse(localStorage.getItem(USAGE_STORAGE_KEY) || '{}');
            } catch { return {}; }
        }

        function getUsageHistory() {
            try {
                return JSON.parse(localStorage.getItem(USAGE_HISTORY_KEY) || '{}');
            } catch { return {}; }
        }

        function incrementUsage(nodeId) {
            const counts = getUsageCounts();
            counts[nodeId] = (counts[nodeId] || 0) + 1;
            localStorage.setItem(USAGE_STORAGE_KEY, JSON.stringify(counts));
            const history = getUsageHistory();
            if (!history[nodeId]) history[nodeId] = [];
            history[nodeId].push(Date.now());
            if (history[nodeId].length > 500) history[nodeId] = history[nodeId].slice(-500);
            localStorage.setItem(USAGE_HISTORY_KEY, JSON.stringify(history));
        }

        async function renderUsageStats(container, nodeId, nodePath) {
            container.innerHTML = '<div class="usage-note">Loading usage…</div>';

            try {
                const resp = await fetch('/api/docs/analytics?path=' + encodeURIComponent(nodePath));
                if (!resp.ok) throw new Error('API error');
                const data = await resp.json();
                container.innerHTML = '';
                renderAnalyticsPanel(container, data, 'doc');
            } catch (err) {
                container.innerHTML = '<div class="usage-note">Usage unavailable</div>';
            }
        }

        function renderAnalyticsPanel(container, data, type) {
            const usage = data.usage || {};
            const activity = data.activity || {};
            const meta = data.fileMeta || {};
            const now = Date.now();

            const fmtDate = d => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '\u2014';
            const fmtRelative = d => {
                if (!d) return 'never';
                const diff = Math.floor((now - new Date(d).getTime()) / 60000);
                if (diff < 1) return 'just now';
                if (diff < 60) return diff + 'm ago';
                if (diff < 1440) return Math.floor(diff / 60) + 'h ago';
                return Math.floor(diff / 1440) + 'd ago';
            };

            // Stat cards row
            const statsRow = document.createElement('div');
            statsRow.className = 'analytics-stats-row';

            const cards = [
                { value: usage.fileReads || 0, label: 'Reads', sub: 'by agents', color: 'var(--accent)' },
                { value: activity.activeDays || 0, label: 'Active days', sub: 'of ' + (activity.days || 90), color: 'var(--act)' },
                { value: meta.sizeKB ? meta.sizeKB + 'KB' : '\u2014', label: 'Size', sub: '', color: 'var(--review)' }
            ];

            cards.forEach(card => {
                const el = document.createElement('div');
                el.className = 'analytics-card';
                el.innerHTML =
                    '<div class="analytics-card-value" style="color:' + card.color + '">' + card.value + '</div>' +
                    '<div class="analytics-card-label">' + card.label + '</div>' +
                    (card.sub ? '<div class="analytics-card-sub">' + card.sub + '</div>' : '');
                statsRow.appendChild(el);
            });
            container.appendChild(statsRow);

            // Agent breakdown section
            const agents = (usage.agentBreakdown || []);
            if (agents.length > 0) {
                const breakdownSection = document.createElement('div');
                breakdownSection.className = 'analytics-breakdown';

                const breakdownTitle = document.createElement('div');
                breakdownTitle.className = 'analytics-chart-title';
                breakdownTitle.textContent = 'Agent Breakdown';
                breakdownSection.appendChild(breakdownTitle);

                const maxCount = agents[0].count;
                agents.slice(0, 6).forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'breakdown-row';

                    const label = document.createElement('div');
                    label.className = 'breakdown-label';
                    const displayName = item.agent.replace('oh-my-claudecode:', '').replace(/-/g, ' ');
                    label.textContent = displayName;

                    const barWrap = document.createElement('div');
                    barWrap.className = 'breakdown-bar-wrap';

                    const bar = document.createElement('div');
                    bar.className = 'breakdown-bar';
                    bar.style.width = Math.max(4, (item.count / maxCount) * 100) + '%';
                    barWrap.appendChild(bar);

                    const count = document.createElement('div');
                    count.className = 'breakdown-count';
                    count.textContent = item.count;

                    row.appendChild(label);
                    row.appendChild(barWrap);
                    row.appendChild(count);
                    breakdownSection.appendChild(row);
                });

                container.appendChild(breakdownSection);
            }

            // Recent sessions
            const sessions = data.recentSessions || [];
            if (sessions.length > 0) {
                const sessionsSection = document.createElement('div');
                sessionsSection.className = 'analytics-sessions';

                const sessTitle = document.createElement('div');
                sessTitle.className = 'analytics-chart-title';
                sessTitle.textContent = 'Recent Sessions';
                sessionsSection.appendChild(sessTitle);

                sessions.slice(0, 5).forEach(s => {
                    const item = document.createElement('div');
                    item.className = 'session-item';
                    item.innerHTML = '<span class="session-dot"></span><span class="session-date">' + fmtRelative(s) + '</span>';
                    sessionsSection.appendChild(item);
                });

                container.appendChild(sessionsSection);
            }

            // Activity chart (90 days)
            const daily = activity.daily || [];
            if (daily.length > 0) {
                const chartContainer = document.createElement('div');
                chartContainer.className = 'usage-chart-container';

                const chartTitle = document.createElement('div');
                chartTitle.className = 'analytics-chart-title';
                chartTitle.textContent = 'Activity \u2014 Last ' + daily.length + ' Days';
                chartContainer.appendChild(chartTitle);

                const canvas = document.createElement('canvas');
                canvas.className = 'usage-chart';
                const dpr = window.devicePixelRatio || 1;
                const cWidth = container.offsetWidth - 36 || 380;
                const cHeight = 100;
                canvas.style.width = '100%';
                canvas.style.height = cHeight + 'px';
                canvas.width = cWidth * dpr;
                canvas.height = cHeight * dpr;
                chartContainer.appendChild(canvas);

                // Axis
                const axis = document.createElement('div');
                axis.className = 'usage-chart-axis';
                const dayMs = 86400000;
                const fmtShort = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                axis.innerHTML =
                    '<span>' + fmtShort(new Date(now - (daily.length - 1) * dayMs)) + '</span>' +
                    '<span>' + fmtShort(new Date(now - Math.floor(daily.length / 2) * dayMs)) + '</span>' +
                    '<span>' + fmtShort(new Date()) + '</span>';
                chartContainer.appendChild(axis);

                container.appendChild(chartContainer);

                // Draw
                const ctx = canvas.getContext('2d');
                ctx.scale(dpr, dpr);
                const maxVal = Math.max(1, ...daily);
                const barW = cWidth / daily.length;
                const gap = daily.length > 60 ? 1 : 2;

                // Grid
                for (let g = 0; g <= 3; g++) {
                    const y = cHeight - (g / 3) * (cHeight - 8) - 2;
                    ctx.strokeStyle = 'rgba(155,162,180,0.08)';
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cWidth, y); ctx.stroke();
                }

                daily.forEach((val, i) => {
                    const barH = val > 0 ? Math.max(3, (val / maxVal) * (cHeight - 12)) : 1;
                    const x = i * barW + gap / 2;
                    const y = cHeight - barH - 2;
                    const w = barW - gap;

                    const gradient = ctx.createLinearGradient(0, y, 0, y + barH);
                    if (val > 0) {
                        gradient.addColorStop(0, 'rgba(124, 195, 179, 0.85)');
                        gradient.addColorStop(1, 'rgba(124, 195, 179, 0.4)');
                    } else {
                        gradient.addColorStop(0, 'rgba(155,162,180,0.08)');
                        gradient.addColorStop(1, 'rgba(155,162,180,0.04)');
                    }
                    ctx.fillStyle = gradient;
                    const r = Math.min(2, w / 2);
                    ctx.beginPath();
                    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                    ctx.lineTo(x + w, y + barH); ctx.lineTo(x, y + barH);
                    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
                    ctx.fill();

                    if (val > 0 && barH > 16 && barW > 8) {
                        ctx.fillStyle = 'rgba(16,32,28,0.75)';
                        ctx.font = '500 8px Geist, system-ui';
                        ctx.textAlign = 'center';
                        ctx.fillText(val, x + w / 2, y + 10);
                    }
                });
            }

            // Timeline row
            const timeline = document.createElement('div');
            timeline.className = 'usage-dates';
            const items = [];
            if (meta.created) items.push('Created: <strong>' + fmtDate(meta.created) + '</strong>');
            if (meta.modified) items.push('Modified: <strong>' + fmtRelative(meta.modified) + '</strong>');
            if (usage.lastRead) items.push('Last read: <strong>' + fmtRelative(usage.lastRead) + '</strong>');
            timeline.innerHTML = items.map(i => '<div class="usage-date-item">' + i + '</div>').join('');
            container.appendChild(timeline);

            // Verdict - help user decide to keep or remove
            const totalReads = (usage.fileReads || 0);
            const days = activity.activeDays || 0;
            const verdict = document.createElement('div');
            verdict.className = 'analytics-verdict';

            if (totalReads >= 50 && days >= 5) {
                verdict.classList.add('high-usage');
                verdict.innerHTML = '<strong>Heavily used</strong> — actively referenced by agents across many sessions. Core part of the workflow.';
            } else if (totalReads >= 10 || days >= 3) {
                verdict.classList.add('moderate-usage');
                verdict.innerHTML = '<strong>Used now and then</strong> — worth keeping if the content is still relevant.';
            } else if (totalReads >= 1) {
                verdict.classList.add('low-usage');
                verdict.innerHTML = '<strong>Rarely used</strong> — only ' + totalReads + ' read' + (totalReads !== 1 ? 's' : '') + ' in ' + (activity.days || 90) + ' days. Worth a review.';
            } else {
                verdict.classList.add('no-usage');
                verdict.innerHTML = '<strong>Not used</strong> — no reads in the last ' + (activity.days || 90) + ' days. Could be removed or merged.';
            }
            container.appendChild(verdict);
        }

        function getNodeSize(node) {
            if (node.isCategory) return 30;
            if (node.isArchived) return 5;
            const counts = getUsageCounts();
            const clicks = counts[node.id] || 0;
            const maxClicks = Math.max(1, ...Object.values(counts));
            const contentLen = node.contentLength || 0;
            // Tiered sizing based on content length for clear visual distinction
            let sizeTier;
            if (contentLen > 50000) sizeTier = 1.0;        // massive docs (MASTER_PLAN etc)
            else if (contentLen > 20000) sizeTier = 0.75;   // large docs
            else if (contentLen > 8000) sizeTier = 0.5;     // medium docs
            else if (contentLen > 3000) sizeTier = 0.25;    // small docs
            else sizeTier = 0.0;                             // tiny docs
            // Folder bonus
            const folderBonus = node.type === 'folder' ? 0.3 : 0;
            const clickFactor = clicks / maxClicks;
            const combined = sizeTier * 0.7 + clickFactor * 0.1 + folderBonus;
            return 6 + combined * 42; // Range: 6-48 (8x area difference!)
        }

        // =============================================
        // Mermaid initialization
        // =============================================
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            themeVariables: {
                primaryColor: '#2B3040',
                primaryTextColor: '#D3D8E2',
                primaryBorderColor: '#3A4052',
                lineColor: '#868DA2',
                secondaryColor: '#252936',
                tertiaryColor: '#1C1F28',
                background: '#1C1F28',
                mainBkg: '#2B3040',
                nodeBorder: '#4A6A63',
                clusterBkg: '#252936',
                titleColor: '#D3D8E2',
                edgeLabelBackground: '#1C1F28',
                fontFamily: 'Geist, system-ui, sans-serif'
            }
        });

        // =============================================
        // Custom marked renderer for mermaid blocks
        // =============================================
        const renderer = new marked.Renderer();
        const originalCode = renderer.code.bind(renderer);
        renderer.code = function(codeArg, langArg) {
            // marked v12+ passes { text, lang } object; older passes (code, lang)
            let text, lang;
            if (typeof codeArg === 'object' && codeArg !== null) {
                text = codeArg.text;
                lang = codeArg.lang;
            } else {
                text = codeArg;
                lang = langArg;
            }
            if (lang === 'mermaid') {
                const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
                return '<div class="mermaid-diagram" id="' + id + '">' + text + '</div>';
            }
            return originalCode(codeArg, langArg);
        };
        marked.setOptions({ renderer });

        // =============================================
        // Auto-diagram generation from content patterns
        // =============================================
        function autoGenerateDiagrams(bodyEl) {
            let diagramCounter = 0;

            // Pattern A: ASCII flow arrows in <p> tags
            const paragraphs = bodyEl.querySelectorAll('.markdown-body p');
            for (const p of paragraphs) {
                const text = p.textContent;
                // Match lines with arrow chains (at least 2 arrows)
                const arrowMatch = text.match(/(.+?)\s*(?:\u2192|->)\s*(.+)/);
                if (!arrowMatch) continue;
                // Count arrows to ensure it's a chain (2+ segments)
                const arrowCount = (text.match(/\u2192|->/g) || []).length;
                if (arrowCount < 2) continue;

                // Split by arrows
                const parts = text.split(/\s*(?:\u2192|->)\s*/).map(s => s.trim()).filter(Boolean);
                if (parts.length < 3) continue;

                // Build mermaid flowchart
                const lines = ['graph LR'];
                for (let i = 0; i < parts.length; i++) {
                    const nodeId = String.fromCharCode(65 + i);
                    const label = parts[i].replace(/"/g, "'");
                    if (i < parts.length - 1) {
                        const nextId = String.fromCharCode(65 + i + 1);
                        const nextLabel = parts[i + 1].replace(/"/g, "'");
                        if (i === 0) {
                            lines.push('    ' + nodeId + '["' + label + '"] --> ' + nextId + '["' + nextLabel + '"]');
                        } else {
                            lines.push('    ' + nodeId + ' --> ' + nextId + '["' + nextLabel + '"]');
                        }
                    }
                }

                const diagramId = 'auto-' + (++diagramCounter) + '-' + Math.random().toString(36).substr(2, 5);
                const diagramDiv = document.createElement('div');
                diagramDiv.className = 'auto-diagram';
                diagramDiv.innerHTML =
                    '<div class="mermaid-diagram" id="' + diagramId + '">' + lines.join('\n') + '</div>';
                p.insertAdjacentElement('afterend', diagramDiv);
            }

            // Pattern B: Ordered lists with action verbs (3+ items)
            const actionVerbs = /\b(run|create|check|deploy|build|start|install|configure|set|execute|push|pull|add|remove|update|verify|test|open|close|stop|restart|download|upload|copy|move|delete|sign|generate|bump|commit|tag|merge|release|fetch|init)\b/i;
            const orderedLists = bodyEl.querySelectorAll('.markdown-body ol');
            for (const ol of orderedLists) {
                const items = ol.querySelectorAll(':scope > li');
                if (items.length < 3) continue;

                // Check if items contain action verbs
                let actionCount = 0;
                for (const li of items) {
                    if (actionVerbs.test(li.textContent)) actionCount++;
                }
                if (actionCount < 2) continue;

                // Build mermaid flowchart
                const lines = ['graph TD'];
                const stepTexts = [];
                for (const li of items) {
                    let txt = li.textContent.trim();
                    if (txt.length > 40) txt = txt.substring(0, 37) + '...';
                    txt = txt.replace(/"/g, "'");
                    stepTexts.push(txt);
                }
                for (let i = 0; i < stepTexts.length; i++) {
                    const nodeId = 'S' + i;
                    if (i < stepTexts.length - 1) {
                        const nextId = 'S' + (i + 1);
                        lines.push('    ' + nodeId + '["' + stepTexts[i] + '"] --> ' + nextId + '["' + stepTexts[i + 1] + '"]');
                    }
                }

                const diagramId = 'auto-' + (++diagramCounter) + '-' + Math.random().toString(36).substr(2, 5);
                const diagramDiv = document.createElement('div');
                diagramDiv.className = 'auto-diagram';
                diagramDiv.innerHTML =
                    '<div class="mermaid-diagram" id="' + diagramId + '">' + lines.join('\n') + '</div>';
                ol.insertAdjacentElement('afterend', diagramDiv);
            }

            // Pattern D: Tables with state/status/transition columns
            const tables = bodyEl.querySelectorAll('.markdown-body table');
            for (const table of tables) {
                const headers = Array.from(table.querySelectorAll('th')).map(th => th.textContent.toLowerCase());
                const hasStateCol = headers.some(h => /status|state|transition|phase|stage/.test(h));
                if (!hasStateCol) continue;

                const rows = table.querySelectorAll('tbody tr');
                if (rows.length < 2) continue;

                // Find the state column index
                const stateIdx = headers.findIndex(h => /status|state|transition|phase|stage/.test(h));
                const states = [];
                for (const row of rows) {
                    const cells = row.querySelectorAll('td');
                    if (cells[stateIdx]) {
                        let st = cells[stateIdx].textContent.trim();
                        if (st.length > 30) st = st.substring(0, 27) + '...';
                        st = st.replace(/"/g, "'");
                        if (st && !states.includes(st)) states.push(st);
                    }
                }
                if (states.length < 2) continue;

                const lines = ['stateDiagram-v2'];
                for (let i = 0; i < states.length - 1; i++) {
                    lines.push('    ' + states[i].replace(/[^a-zA-Z0-9]/g, '_') + ' --> ' + states[i + 1].replace(/[^a-zA-Z0-9]/g, '_'));
                }

                const diagramId = 'auto-' + (++diagramCounter) + '-' + Math.random().toString(36).substr(2, 5);
                const diagramDiv = document.createElement('div');
                diagramDiv.className = 'auto-diagram';
                diagramDiv.innerHTML =
                    '<div class="mermaid-diagram" id="' + diagramId + '">' + lines.join('\n') + '</div>';
                table.insertAdjacentElement('afterend', diagramDiv);
            }
        }

        // =============================================
        // Overview diagram - document structure as mindmap
        // =============================================
        function generateOverviewDiagram(bodyEl) {
            const headers = bodyEl.querySelectorAll('.markdown-body h2, .markdown-body h3');
            if (headers.length < 3) return;

            const h1 = bodyEl.querySelector('.markdown-body h1');
            const title = h1 ? h1.textContent.trim() : 'Document';

            const lines = ['graph LR'];
            const rootId = 'ROOT';
            lines.push('    ' + rootId + '(("' + (title.length > 25 ? title.substring(0, 22) + '...' : title) + '"))');

            let h2Count = 0;
            let lastH2Id = '';
            for (const h of headers) {
                let text = h.textContent.trim();
                if (text.length > 30) text = text.substring(0, 27) + '...';
                text = text.replace(/"/g, "'");

                if (h.tagName === 'H2') {
                    h2Count++;
                    const id = 'H2_' + h2Count;
                    lastH2Id = id;
                    lines.push('    ' + rootId + ' --> ' + id + '["' + text + '"]');
                } else if (h.tagName === 'H3' && lastH2Id) {
                    const id = 'H3_' + h2Count + '_' + Math.random().toString(36).substr(2, 3);
                    lines.push('    ' + lastH2Id + ' --> ' + id + '["' + text + '"]');
                }

                if (h2Count >= 8) break;
            }

            if (h2Count < 2) return;

            const diagramId = 'overview-' + Math.random().toString(36).substr(2, 5);
            const overviewDiv = document.createElement('div');
            overviewDiv.className = 'auto-diagram overview-diagram';
            overviewDiv.innerHTML = '<div class="overview-label">Document Structure</div>' +
                '<div class="mermaid-diagram" id="' + diagramId + '">' + lines.join('\n') + '</div>';

            const firstH1 = bodyEl.querySelector('.markdown-body h1');
            if (firstH1) {
                firstH1.insertAdjacentElement('afterend', overviewDiv);
            } else {
                bodyEl.querySelector('.markdown-body').prepend(overviewDiv);
            }
        }

        // Render all mermaid diagrams in a container
        async function renderMermaidDiagrams(bodyEl) {
            const mermaidDivs = bodyEl.querySelectorAll('.mermaid-diagram');
            for (const div of mermaidDivs) {
                try {
                    const { svg } = await mermaid.render(div.id + '-svg', div.textContent.trim());
                    div.innerHTML = svg;
                } catch (e) {
                    console.warn('Mermaid render failed:', e);
                    div.innerHTML = '<pre class="mermaid-error">' + div.textContent + '</pre>';
                }
            }
        }

        // =============================================
        // Content panel
        // =============================================
        async function showContentPanel(node) {
            const panel = document.getElementById('contentPanel');
            const titleEl = document.getElementById('contentTitle');
            const pathEl = document.getElementById('contentPath');
            const bodyEl = document.getElementById('contentBody');

            titleEl.textContent = plainTitle(node.title);
            pathEl.textContent = 'docs/' + node.path;
            bodyEl.innerHTML = '<div class="content-loading">Loading...</div>';
            panel.classList.add('visible');

            // Render usage stats (counter + chart)
            renderUsageStats(document.getElementById('usageStats'), node.id, node.path);
            // Re-render graph to update node sizes
            if (graph) graph.nodeColor(graph.nodeColor());

            try {
                const resp = await fetch('/api/docs/content?path=' + encodeURIComponent(node.path));
                if (!resp.ok) throw new Error('Failed to load');
                const data = await resp.json();
                let content = data.content;
                // Strip YAML frontmatter
                if (content.startsWith('---')) {
                    const endIdx = content.indexOf('---', 3);
                    if (endIdx > 0) content = content.substring(endIdx + 3).trim();
                }
                bodyEl.innerHTML = '<div class="markdown-body">' + marked.parse(content) + '</div>';

                // Overview diagram showing document structure
                generateOverviewDiagram(bodyEl);

                // Auto-generate diagrams from content patterns
                autoGenerateDiagrams(bodyEl);

                // Collapse sections into expandable chapters
                collapseSections(bodyEl);

                // Render all mermaid diagrams (explicit + auto-generated)
                await renderMermaidDiagrams(bodyEl);
            } catch (err) {
                bodyEl.innerHTML = '<div class="content-loading">Failed to load document content</div>';
            }
        }

        function collapseSections(bodyEl) {
            const md = bodyEl.querySelector('.markdown-body');
            if (!md) return;

            const headings = Array.from(md.querySelectorAll('h2'));
            if (headings.length < 2) return;

            headings.forEach((h2, idx) => {
                const section = [];
                let sibling = h2.nextElementSibling;
                while (sibling && sibling.tagName !== 'H2') {
                    section.push(sibling);
                    sibling = sibling.nextElementSibling;
                }

                const details = document.createElement('details');
                details.className = 'content-chapter';
                if (idx === 0) details.open = true;

                const summary = document.createElement('summary');
                summary.className = 'chapter-summary';
                summary.innerHTML = h2.innerHTML;
                const badge = document.createElement('span');
                badge.className = 'chapter-badge';
                badge.textContent = section.length + ' items';
                summary.appendChild(badge);

                details.appendChild(summary);

                const content = document.createElement('div');
                content.className = 'chapter-content';
                section.forEach(el => content.appendChild(el));
                details.appendChild(content);

                h2.replaceWith(details);
            });
        }

        function hideContentPanel() {
            document.getElementById('contentPanel').classList.remove('visible');
            selectedNode = null;
            if (graph) graph.nodeColor(graph.nodeColor());
        }

        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') hideContentPanel();
        });

        // Load data and initialize
        async function init() {
            try {
                const response = await fetch('/api/docs?v=' + Date.now());
                graphData = await response.json();

                updateStats();
                buildLegend();
                initGraph();
                const requestedPath = new URLSearchParams(location.search).get('path');
                const requestedNode = graphData.nodes.find(node => node.path === requestedPath);
                if (requestedNode) showContentPanel(requestedNode);
            } catch (error) {
                console.error('Failed to load graph data:', error);
                document.getElementById('graph').innerHTML =
                    '<div class="graph-empty">Could not load the docs map. Run: npm run docs:graph</div>';
            }
        }

        function updateStats() {
            document.getElementById('activeCount').textContent =
                graphData.nodes.filter(n => !n.isArchived && !n.isCategory).length;
            document.getElementById('archivedCount').textContent =
                graphData.nodes.filter(n => n.isArchived && !n.isCategory).length;
        }

        function buildLegend() {
            const categories = [...new Set(graphData.nodes.filter(n => !n.isCategory).map(n => n.category))];
            const legendItems = document.getElementById('legendItems');
            legendItems.innerHTML = '';

            categories.forEach(cat => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML =
                    '<div class="legend-dot" style="background: ' + (COLORS[cat] || COLORS.other) + '"></div>' +
                    '<span class="legend-name">' + cat.charAt(0).toUpperCase() + cat.slice(1).replace(/-/g, ' ') + '</span>';
                item.title = cat.charAt(0).toUpperCase() + cat.slice(1).replace(/-/g, ' ');
                legendItems.appendChild(item);
            });
        }

        function getFilteredData() {
            const hideArchived = document.getElementById('hideArchived').checked;

            let nodes = [...graphData.nodes];
            let links = [...graphData.links];

            if (hideArchived) {
                const visibleIds = new Set(nodes.filter(n => !n.isArchived).map(n => n.id));
                nodes = nodes.filter(n => !n.isArchived);
                links = links.filter(l => {
                    const sourceId = typeof l.source === 'object' ? l.source.id : l.source;
                    const targetId = typeof l.target === 'object' ? l.target.id : l.target;
                    return visibleIds.has(sourceId) && visibleIds.has(targetId);
                });
            }

            return { nodes, links };
        }

        // Keep the whole map in view until the person pans or zooms it themselves.
        let autoFit = true;

        function initGraph() {
            const container = document.getElementById('graph');
            const { nodes, links } = getFilteredData();

            // Pre-assign positions in a large circle so nodes start spread out
            const nodeCount = nodes.length;
            const radius = Math.max(600, nodeCount * 15);
            nodes.forEach((node, i) => {
                const angle = (2 * Math.PI * i) / nodeCount;
                node.x = radius * Math.cos(angle);
                node.y = radius * Math.sin(angle);
            });

            graph = ForceGraph()(container)
                .graphData({ nodes, links });
            window._graph = graph;
            graph
                .backgroundColor(DUSK.surface)
                .nodeColor(toneOf)
                .nodeVal(node => node.isCategory ? 18 : 8)
                .nodeLabel(node => plainTitle(node.title))
                .linkColor(() => DUSK.line)
                .linkWidth(1.25)
                .onNodeClick(handleNodeClick)
                .onNodeHover(handleNodeHover)
                .cooldownTicks(300)
                .warmupTicks(200)
                .d3AlphaDecay(0.01)
                .d3VelocityDecay(0.3)
                .onEngineStop(() => { if (autoFit) graph.zoomToFit(400, 80); });

            // Extreme repulsion to spread nodes apart
            graph.d3Force('charge', d3.forceManyBody().strength(-3000).distanceMax(3000));
            graph.d3Force('link').distance(250).strength(0.1);
            // No center force — it pulls everything together
            graph.d3Force('center', null);
            // Hard collision so labels never overlap
            graph.d3Force('collide', d3.forceCollide().radius(node => getNodeSize(node) + 70).strength(1).iterations(10));
            // Weak radial to prevent flying to infinity
            graph.d3Force('radial', d3.forceRadial(radius * 0.7, 0, 0).strength(0.02));

            // The container is still being laid out when the physics stops, so size the graph to it
            // and refit on every resize, not once.
            let fitTimer = 0;
            const sizeAndFit = () => {
                const w = container.clientWidth, h = container.clientHeight;
                if (!w || !h) return;
                graph.width(w).height(h);
                if (autoFit) { clearTimeout(fitTimer); fitTimer = setTimeout(() => graph.zoomToFit(300, 80), 120); }
            };
            new ResizeObserver(sizeAndFit).observe(container);
            ['wheel', 'pointerdown'].forEach(evt => container.addEventListener(evt, () => { autoFit = false; }, { passive: true }));
            sizeAndFit();

            // Custom node rendering: soft discs, quiet labels, search + selection rings
            graph.nodeCanvasObject((node, ctx, globalScale) => {
                const tone = toneOf(node);
                const nodeSize = getNodeSize(node);

                const isHovered = hoveredNode && hoveredNode.id === node.id;
                const isSelected = selectedNode && selectedNode.id === node.id;
                const isMatch = matchesSearch(node);
                const dimmed = !!searchTerm && !isMatch && !isSelected;

                ctx.save();
                ctx.globalAlpha = dimmed ? 0.22 : 1;

                // Soft disc: tinted fill, slightly brighter core ring
                ctx.beginPath();
                ctx.arc(node.x, node.y, nodeSize, 0, 2 * Math.PI);
                ctx.fillStyle = tone + (isHovered || isSelected || isMatch ? 'e6' : 'a6');
                ctx.fill();
                ctx.strokeStyle = tone;
                ctx.lineWidth = 1.25 / globalScale;
                ctx.stroke();

                // Selection / search ring sits a little outside the disc
                if (isSelected || isMatch) {
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, nodeSize + 5 / globalScale, 0, 2 * Math.PI);
                    ctx.strokeStyle = DUSK.accent;
                    ctx.lineWidth = 2 / globalScale;
                    ctx.stroke();
                }

                // Labels: always visible but quiet; full title on hover
                const labelFontSize = Math.max(11, (node.isCategory ? 14 : 11) / globalScale);
                ctx.font = (node.isCategory || isHovered || isSelected ? '500 ' : '400 ') + labelFontSize + 'px Geist, system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                const labelY = node.y + nodeSize + 6 / globalScale;

                const title = plainTitle(node.title);
                if ((isHovered || isSelected) && !node.isCategory) {
                    const fullLabel = title.length > 40 ? title.substring(0, 37) + '…' : title;
                    const textWidth = ctx.measureText(fullLabel).width;
                    const padX = 8 / globalScale, padY = 4 / globalScale;
                    const w = textWidth + padX * 2, h = labelFontSize + padY * 2;
                    const x = node.x - w / 2, y = labelY - padY;
                    ctx.fillStyle = DUSK.card;
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(x, y, w, h, 8 / globalScale); else ctx.rect(x, y, w, h);
                    ctx.fill();
                    ctx.fillStyle = DUSK.text;
                    ctx.fillText(fullLabel, node.x, labelY);
                } else if (node.isCategory || isMatch || globalScale >= LABEL_MIN_SCALE) {
                    // Quiet when zoomed far out: only category and matching labels remain
                    ctx.fillStyle = node.isCategory ? DUSK.text : (isMatch ? DUSK.text : DUSK.text3);
                    let label = title;
                    if (!node.isCategory && label.length > 14) {
                        label = label.substring(0, 12) + '…';
                    }
                    ctx.fillText(label, node.x, labelY);
                }
                ctx.restore();
            });
        }

        function handleNodeClick(node) {
            if (!node || node.isCategory) return;

            selectedNode = node;

            // If it's a file with a path, show content panel
            if (node.path) {
                showContentPanel(node);
            }

            graph.nodeColor(graph.nodeColor()); // Trigger re-render
        }

        function handleNodeHover(node) {
            document.body.style.cursor = node && !node.isCategory ? 'pointer' : 'default';
            hoveredNode = node;
            // Trigger re-render to show/hide label
            if (graph) graph.nodeColor(graph.nodeColor());
        }

        function refreshGraph() {
            if (!graph) return;
            const { nodes, links } = getFilteredData();
            graph.graphData({ nodes, links });
            autoFit = true;
            setTimeout(() => graph.zoomToFit(400, 50), 500);
        }

        // Event listeners
        document.getElementById('hideArchived').addEventListener('change', refreshGraph);

        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.trim().toLowerCase();
            searchTerm = term;
            document.getElementById('searchBox').classList.toggle('has-q', !!term);
            if (!graph) return;

            graph.nodeColor(node => {
                if (matchesSearch(node)) {
                    return DUSK.accent; // highlight
                }
                return toneOf(node);
            });
        });

        // Usage details stay folded away until asked for
        document.getElementById('usageToggle').addEventListener('click', (e) => {
            const panel = document.getElementById('contentPanel');
            const open = panel.classList.toggle('usage-open');
            e.currentTarget.setAttribute('aria-expanded', String(open));
            e.currentTarget.setAttribute('aria-label', open ? 'Hide usage' : 'Show usage');
        });

        document.getElementById('zoomIn').addEventListener('click', () => {
            graph.zoom(graph.zoom() * 1.5, 300);
        });

        document.getElementById('zoomOut').addEventListener('click', () => {
            graph.zoom(graph.zoom() / 1.5, 300);
        });

        document.getElementById('zoomFit').addEventListener('click', () => {
            graph.zoomToFit(400, 50);
        });

        document.getElementById('contentClose').addEventListener('click', hideContentPanel);

        // Track if initial setup is done
        let isInitialized = false;

        // Initial setup - only runs once
        function setupGraph() {
            if (!graph || isInitialized) return;

            const container = document.getElementById('graph');
            const rect = container.getBoundingClientRect();

            if (rect.width > 0 && rect.height > 0) {
                graph.width(rect.width);
                graph.height(rect.height);
                isInitialized = true;
            }
        }

        // Refresh canvas on tab switch - fixes Chromium rendering bug
        function refreshGraphCanvas() {
            if (!graph) return;
            graph.pauseAnimation();
            requestAnimationFrame(() => {
                if (graph) graph.resumeAnimation();
            });
        }

        // Initialize graph
        async function startGraph() {
            await init();
            requestAnimationFrame(setupGraph);
        }

        // Listen for tab activation from parent
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'tab-activated') {
                console.log('Tab activated - refreshing canvas');
                refreshGraphCanvas();
            }
            if (event.data && event.data.type === 'project-switch') {
                window.location.reload();
            }
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startGraph);
        } else {
            startGraph();
        }
    </script>
</body>
</html>
