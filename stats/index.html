<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../dusk-tokens.css">
    <link rel="stylesheet" href="dusk.css">
</head>
<body>
    <div class="container">
        <header class="bar">
            <h1 class="pt">Stats</h1>
            <span class="grow"></span>
            <button class="tb" id="refreshBtn" type="button" aria-label="Refresh" title="Refresh">
                <svg class="ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
            </button>
        </header>

        <main class="dashboard-grid">
            <!-- Overview -->
            <section class="pane wide health-banner" aria-label="Overview">
                <div class="health-status">
                    <div class="health-indicator" id="healthIndicator">
                        <span id="healthIcon" style="display:grid"><span class="spinner" style="width:18px;height:18px;border-radius:50%;border:2px solid var(--card-2);border-top-color:var(--accent);animation:spin 1s linear infinite"></span></span>
                    </div>
                    <div class="health-text" id="healthText" aria-live="polite">
                        <h2>Loading</h2>
                        <p>Reading the plan</p>
                    </div>
                </div>
                <div class="health-metrics">
                    <div class="health-metric m-done" title="Share of all items that are done">
                        <div class="health-metric-value" id="completionRate">-</div>
                        <div class="health-metric-label"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.5 2.5 4.5-5"/></svg>Done</div>
                    </div>
                    <div class="health-metric m-act" title="Open items in the plan">
                        <div class="health-metric-value" id="activeCount">-</div>
                        <div class="health-metric-label"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12L16 12h5"/></svg>Open</div>
                    </div>
                    <div class="health-metric m-bug" title="Bugs not fixed yet">
                        <div class="health-metric-value" id="openBugs">-</div>
                        <div class="health-metric-label"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="7" width="9" height="13" rx="4.5"/><path d="M12 11v9M9.5 7.5L8 5M14.5 7.5L16 5M7.5 12H4M20 12h-3.5M7.5 16.5l-3 2M16.5 16.5l3 2"/></svg>Bugs</div>
                    </div>
                </div>
                <div class="overall" aria-hidden="true"><div class="track"><div class="fill" id="completionFill"></div></div></div>
            </section>

            <!-- Active Work -->
            <section class="pane">
                <div class="card-header">
                    <h3 class="card-title"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12L16 12h5"/></svg>Active work</h3>
                    <div class="card-subtitle" id="activeSubtitle"></div>
                </div>
                <div class="active-work-list" id="activeWorkList">
                    <div class="empty-state"><span class="spinner"></span></div>
                </div>
            </section>

            <!-- Work on Next -->
            <section class="pane">
                <div class="card-header">
                    <h3 class="card-title"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg>Up next</h3>
                    <div class="card-subtitle" id="workNextSubtitle"></div>
                </div>
                <div class="work-next-list" id="workNextList">
                    <div class="empty-state"><span class="spinner"></span></div>
                </div>
            </section>

            <!-- Recently Completed -->
            <section class="pane">
                <div class="card-header">
                    <h3 class="card-title"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.5 2.5 4.5-5"/></svg>Recently finished</h3>
                    <div class="card-subtitle" id="completedSubtitle"></div>
                </div>
                <div class="completed-list" id="completedList">
                    <div class="empty-state"><span class="spinner"></span></div>
                </div>
            </section>

            <div class="stack">
            <!-- Priority Matrix -->
            <section class="pane">
                <div class="card-header">
                    <h3 class="card-title"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 21V4.5M5.5 4.5h11l-2 4 2 4h-11"/></svg>By priority</h3>
                    <div class="card-subtitle" title="Done out of total">done / all</div>
                </div>
                <div class="priority-matrix" id="priorityMatrix">
                    <div class="empty-state"><span class="spinner"></span></div>
                </div>
            </section>

            <!-- Type Breakdown -->
            <section class="pane">
                <div class="card-header">
                    <h3 class="card-title"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.3V4.5a1 1 0 011-1h7.8l8.2 8.2a1.5 1.5 0 010 2.1l-6.4 6.4a1.5 1.5 0 01-2.1 0z"/><circle cx="8" cy="8" r="1.3"/></svg>By kind</h3>
                    <div class="card-subtitle" title="Items still open">open</div>
                </div>
                <div class="type-breakdown" id="typeBreakdown">
                    <div class="empty-state"><span class="spinner"></span></div>
                </div>
            </section>

            </div>

            <!-- Open Bugs - Full Width -->
            <section class="pane wide">
                <div class="card-header">
                    <h3 class="card-title"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="7" width="9" height="13" rx="4.5"/><path d="M12 11v9M9.5 7.5L8 5M14.5 7.5L16 5M7.5 12H4M20 12h-3.5M7.5 16.5l-3 2M16.5 16.5l3 2"/></svg>Open bugs</h3>
                    <div class="card-subtitle" id="openBugsSubtitle"></div>
                </div>
                <div class="open-bugs-list" id="openBugsList">
                    <div class="empty-state"><span class="spinner"></span></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // API configuration - same as kanban board
        const API_BASE = window.location.origin;

        // Parse MASTER_PLAN.md for detailed metrics
        async function fetchAndParse() {
            try {
                const response = await fetch(`${API_BASE}/api/master-plan?v=${Date.now()}`);
                if (!response.ok) throw new Error('Failed to fetch MASTER_PLAN.md');
                const json = await response.json();
                const text = json.content;
                return parseMarkdown(text);
            } catch (error) {
                console.error('Error fetching MASTER_PLAN:', error);
                throw error;
            }
        }

        function parseMarkdown(text) {
            const data = {
                health: { status: 'good', message: '', completion: 0 },
                active: [],
                workOnNext: [],
                completed: [],
                openBugs: [],
                priorities: {
                    p1: { done: 0, open: 0, items: [] },
                    p2: { done: 0, open: 0, items: [] },
                    p3: { done: 0, open: 0, items: [] }
                },
                types: {
                    tasks: { total: 0, done: 0, label: 'Tasks', icon: '📋' },
                    bugs: { total: 0, done: 0, label: 'Bugs', icon: '🐛' },
                    roads: { total: 0, done: 0, label: 'Roadmap', icon: '🗺️' },
                    issues: { total: 0, done: 0, label: 'Issues', icon: '⚠️' },
                    ideas: { total: 0, done: 0, label: 'Ideas', icon: '💡' }
                }
            };

            // Split into lines for parsing
            const lines = text.split('\n');

            // Parse table rows for items
            const typeMap = {
                'TASK': 'tasks',
                'BUG': 'bugs',
                'ROAD': 'roads',
                'ISSUE': 'issues',
                'IDEA': 'ideas'
            };

            // Track unique IDs
            const seenIds = new Set();
            const doneIds = new Set();

            // Find all IDs and their status
            lines.forEach((line, index) => {
                // Match item IDs
                const idMatches = line.match(/(?:~~)?(TASK|BUG|ROAD|ISSUE|IDEA)-(\d+)(?:~~)?/g);
                if (!idMatches) return;

                idMatches.forEach(match => {
                    const isDone = match.startsWith('~~') && match.endsWith('~~');
                    const cleanId = match.replace(/~~/g, '');
                    const [type] = cleanId.split('-');
                    const typeKey = typeMap[type];

                    if (!typeKey || seenIds.has(cleanId)) return;
                    seenIds.add(cleanId);

                    if (isDone) {
                        doneIds.add(cleanId);
                        data.types[typeKey].done++;
                    }
                    data.types[typeKey].total++;
                });
            });

            // Helper function to parse status (matching Kanban logic)
            function parseTaskStatus(statusText) {
                if (!statusText) return 'todo';
                const text = statusText.toUpperCase();

                // Done patterns
                const donePatterns = ['DONE', 'COMPLETE', 'COMPLETED', 'FINISHED', 'CLOSED', 'RESOLVED', 'FIXED', 'SHIPPED', '✅', '✓'];
                // Review/Monitoring patterns
                const reviewPatterns = ['MONITORING', '👀'];
                // In-progress patterns
                const inProgressPatterns = ['IN_PROGRESS', 'IN PROGRESS', 'IN-PROGRESS', 'PAUSED'];

                for (const p of donePatterns) if (text.includes(p)) return 'done';
                for (const p of reviewPatterns) if (text.includes(p)) return 'review';
                for (const p of inProgressPatterns) if (text.includes(p)) return 'in-progress';
                return 'todo';
            }

            // Extract active items from ### task headers across ALL sections
            // Scan entire document for ### TASK-*/BUG-* headers with IN PROGRESS or REVIEW status
            const seenActive = new Set();
            const taskHeaderPattern = /^###\s+(?:~~)?(?:.*?)((?:TASK|BUG|ISSUE|FEATURE|ROAD)-\d+)(?:~~)?[:\s]+(.+?)(?:\s*\(([^)]+)\))?\s*$/gm;
            let match;

            while ((match = taskHeaderPattern.exec(text)) !== null) {
                const id = match[1];
                const title_raw = match[2] || '';
                const statusText = match[3] || '';

                // Skip done/strikethrough
                if (match[0].includes('~~') && !match[0].match(/^###\s+[^~]/)) continue;

                const parsedStatus = parseTaskStatus(statusText || title_raw);
                // Include in-progress, review, AND todo tasks (skip only done)
                if (parsedStatus === 'done') continue;
                if (seenActive.has(id)) continue;

                seenActive.add(id);
                const status = parsedStatus === 'review' ? 'monitoring' : parsedStatus === 'in-progress' ? 'progress' : 'todo';

                // Clean up title
                let title = title_raw.replace(/\*\*/g, '').replace(/~~.*?~~/g, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
                if (!title || title.length < 3) title = id;

                // Try to find files from nearby lines
                const afterHeader = text.slice(match.index + match[0].length, match.index + match[0].length + 500);
                const filesMatch = afterHeader.match(/\*\*(?:Files?|Primary Files?)\*\*:\s*([^\n]+)/i);
                const files = filesMatch ? filesMatch[1].trim() : '';

                data.active.push({ id, title, status, files });
            }

            // Also check table rows for active items (dependency tables)
            const depTablePattern = /\|\s*(?:\*\*)?(TASK|BUG|ROAD|ISSUE)-(\d+)(?:\*\*)?\s*\|\s*([^|\n]+)\|([^|\n]+)\|/g;
            while ((match = depTablePattern.exec(text)) !== null) {
                const id = `${match[1]}-${match[2]}`;
                if (match[0].includes('~~') || match[0].includes('✅') || seenActive.has(id)) continue;

                const statusCol = match[3].trim();
                const parsedStatus = parseTaskStatus(statusCol);
                // Include in-progress, review, AND todo tasks (skip only done)
                if (parsedStatus === 'done') continue;

                seenActive.add(id);
                const status = parsedStatus === 'review' ? 'monitoring' : parsedStatus === 'in-progress' ? 'progress' : 'todo';
                const filesCol = match[4].trim();

                const titlePattern = new RegExp(`###\\s*(?:~~)?${id}(?:~~)?[:\\s]+([^\\n(]+)`, 'i');
                const titleMatch = text.match(titlePattern);
                let title = titleMatch ? titleMatch[1].trim() : id;
                title = title.replace(/\*\*/g, '').replace(/~~.*?~~/g, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
                if (!title || title.length < 3) title = id;

                data.active.push({ id, title, status, files: filesCol });
            }

            // Sort: in-progress first, then review, then todo
            const statusOrder = { progress: 0, monitoring: 1, todo: 2 };
            data.active.sort((a, b) => (statusOrder[a.status] ?? 3) - (statusOrder[b.status] ?? 3));

            // Extract completed items with dates
            const completedPattern = /~~(TASK|BUG|ROAD|ISSUE|IDEA)-(\d+)~~[^~\n]*?(?:DONE|FIXED|✅)[^\n]*?(?:Dec\s*(\d+)|(\d{4}))?/gi;
            while ((match = completedPattern.exec(text)) !== null) {
                const id = `${match[1]}-${match[2]}`;
                const type = match[1].toLowerCase();
                let dateStr = match[3] ? `Dec ${match[3]}` : (match[4] || 'Recently');

                // Find title
                const titlePattern = new RegExp(`###\\s*~~${id}~~[:\\s]+([^\\n(]+)`, 'i');
                const titleMatch = text.match(titlePattern);
                let title = titleMatch ? titleMatch[1].trim() : '';

                // If no title from section header, try table
                if (!title) {
                    const tablePattern = new RegExp(`\\|\\s*~~${id}~~\\s*\\|[^|]*\\|[^|]*([^|]+)`, 'i');
                    const tableMatch = text.match(tablePattern);
                    if (tableMatch) title = tableMatch[1].trim();
                }

                // Clean up
                title = title.replace(/~~.*?~~/g, '').replace(/\*\*/g, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
                if (!title) title = id;

                data.completed.push({ id, title, type, date: dateStr });
            }

            // Dedupe completed list
            const uniqueCompleted = [];
            const seenCompleted = new Set();
            data.completed.forEach(item => {
                if (!seenCompleted.has(item.id)) {
                    seenCompleted.add(item.id);
                    uniqueCompleted.push(item);
                }
            });
            data.completed = uniqueCompleted.slice(0, 15);

            // Parse priorities
            const priorityPattern = /\|\s*(?:~~)?(TASK|BUG|ROAD|ISSUE|IDEA)-(\d+)(?:~~)?\s*\|[^|]*\|[^|]*(P[0-3])[^|]*\|/gi;
            while ((match = priorityPattern.exec(text)) !== null) {
                const id = `${match[1]}-${match[2]}`;
                const priority = match[3].toLowerCase();
                const isDone = doneIds.has(id);

                if (priority === 'p0' || priority === 'p1') {
                    if (isDone) data.priorities.p1.done++;
                    else data.priorities.p1.open++;
                } else if (priority === 'p2') {
                    if (isDone) data.priorities.p2.done++;
                    else data.priorities.p2.open++;
                } else if (priority === 'p3') {
                    if (isDone) data.priorities.p3.done++;
                    else data.priorities.p3.open++;
                }
            }

            // Parse open bugs from bug table
            // Format: | BUG-XXX | Bug description | Priority | Status |
            const bugTablePattern = /\|\s*BUG-(\d+)\s*\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|/g;
            while ((match = bugTablePattern.exec(text)) !== null) {
                const id = `BUG-${match[1]}`;
                // Skip if this bug is already marked as done (~~BUG-XXX~~)
                const donePattern = new RegExp(`~~BUG-${match[1]}~~`);
                if (donePattern.test(text)) continue;

                const title = match[2].trim();
                let priority = match[3].trim().toUpperCase();
                const notes = match[4].trim();

                // Normalize priority (P1-HIGH → HIGH, P2-MEDIUM → MEDIUM, etc.)
                if (priority.includes('HIGH') || priority === 'P1' || priority === 'P0') {
                    priority = 'high';
                } else if (priority.includes('MEDIUM') || priority === 'P2') {
                    priority = 'medium';
                } else if (priority.includes('LOW') || priority === 'P3') {
                    priority = 'low';
                } else {
                    priority = 'low'; // N/A, etc.
                }

                data.openBugs.push({ id, title, priority, notes });
            }

            // Parse "Work on Next" - high priority items not yet in progress
            // Look for READY, PLANNED, or TODO items with high priority
            const workNextPattern = /\|\s*(?:\*\*)?(TASK|BUG|ROAD|ISSUE)-(\d+)(?:\*\*)?\s*\|([^|]+)\|([^|]+)\|([^|]*)\|?([^|]*)?/gi;
            const activeIds = new Set(data.active.map(a => a.id));
            const seenWorkNext = new Set();

            while ((match = workNextPattern.exec(text)) !== null) {
                const id = `${match[1]}-${match[2]}`;
                // Skip if done (~~), already active, or already seen
                if (match[0].includes('~~') || activeIds.has(id) || seenWorkNext.has(id) || doneIds.has(id)) continue;

                const col2 = match[3].trim();
                const col3 = match[4].trim();
                const col4 = match[5] ? match[5].trim() : '';

                // Check if it's a TODO/READY/PLANNED item (not in progress)
                const status = parseTaskStatus(col2);
                if (status === 'in-progress' || status === 'review' || status === 'done') continue;

                // Check for priority in any column
                let priority = 'low';
                let title = '';
                [col2, col3, col4].forEach(col => {
                    const upper = col.toUpperCase();
                    if (upper.includes('P0') || upper.includes('P1') || upper.includes('CRITICAL') || upper.includes('HIGH')) {
                        priority = 'high';
                    } else if ((upper.includes('P2') || upper.includes('MEDIUM')) && priority !== 'high') {
                        priority = 'medium';
                    }
                    // Title is usually the longer text column
                    if (col.length > title.length && !col.includes('P0') && !col.includes('P1') && !col.includes('P2') && !col.includes('P3')) {
                        title = col;
                    }
                });

                // Only include high/medium priority items
                if (priority === 'low') continue;

                seenWorkNext.add(id);

                // Find better title from section header if available
                const titlePattern = new RegExp(`###\\s*(?:\\*\\*)?${id}(?:\\*\\*)?[:\\s]+([^\\n(]+)`, 'i');
                const titleMatch = text.match(titlePattern);
                if (titleMatch) {
                    title = titleMatch[1].trim().replace(/\*\*/g, '').replace(/~~.*?~~/g, '');
                }
                if (!title || title.length < 3) title = col3 || col2;

                const type = match[1].toLowerCase();
                data.workOnNext.push({ id, title, priority, type, status: col2 });
            }

            // Sort work on next by priority (high first) and type (bugs first)
            data.workOnNext.sort((a, b) => {
                const prioOrder = { high: 0, medium: 1, low: 2 };
                const typeOrder = { bug: 0, task: 1, road: 2, issue: 3 };
                if (prioOrder[a.priority] !== prioOrder[b.priority]) {
                    return prioOrder[a.priority] - prioOrder[b.priority];
                }
                return (typeOrder[a.type] || 3) - (typeOrder[b.type] || 3);
            });

            // Limit to top 5
            data.workOnNext = data.workOnNext.slice(0, 5);

            // Calculate health
            const totalItems = Object.values(data.types).reduce((sum, t) => sum + t.total, 0);
            const doneItems = Object.values(data.types).reduce((sum, t) => sum + t.done, 0);
            const completion = totalItems > 0 ? Math.round((doneItems / totalItems) * 100) : 0;

            const openP1 = data.priorities.p1.open;
            const openBugs = data.types.bugs.total - data.types.bugs.done;

            if (openP1 >= 3 || openBugs >= 5) {
                data.health.status = 'critical';
                data.health.message = openP1 >= 3 ? `${openP1} critical items need attention` : `${openBugs} bugs need fixing`;
            } else if (openP1 >= 1 || openBugs >= 3) {
                data.health.status = 'warning';
                data.health.message = 'Some high-priority items pending';
            } else {
                data.health.status = 'good';
                data.health.message = 'Project is progressing well';
            }
            data.health.completion = completion;
            data.health.activeCount = data.active.length;
            data.health.openBugs = openBugs;

            return data;
        }

        // Dusk icons (stroke SVG, 24 grid). Text labels live in aria-label/title.
        const ICON_PATHS = {
            check: '<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.5 2.5 4.5-5"/>',
            alert: '<path d="M10.3 4.6L3.2 17a2 2 0 001.7 3h14.2a2 2 0 001.7-3L13.7 4.6a2 2 0 00-3.4 0z"/><path d="M12 10v3.5M12 16.5h.01"/>',
            stop: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5M12 16h.01"/>',
            progress: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" fill="currentColor" stroke="none"/>',
            review: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.5"/>',
            todo: '<circle cx="12" cy="12" r="8"/>',
            flag: '<path d="M5.5 21V4.5M5.5 4.5h11l-2 4 2 4h-11"/>',
            bug: '<rect x="7.5" y="7" width="9" height="13" rx="4.5"/><path d="M12 11v9M9.5 7.5L8 5M14.5 7.5L16 5M7.5 12H4M20 12h-3.5M7.5 16.5l-3 2M16.5 16.5l3 2"/>',
            task: '<rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
            road: '<path d="M9 4.5L3.5 6.5v13L9 17.5l6 2 5.5-2v-13L15 6.5z"/><path d="M9 4.5v13M15 6.5v13"/>',
            issue: '<path d="M10.3 4.6L3.2 17a2 2 0 001.7 3h14.2a2 2 0 001.7-3L13.7 4.6a2 2 0 00-3.4 0z"/><path d="M12 10v3.5M12 16.5h.01"/>',
            idea: '<path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 00-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0012 3z"/>',
            spark: '<path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/>',
            inbox: '<path d="M4 13l2.5-7.5h11L20 13v5a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 18z"/><path d="M4 13h4.5l1 2h5l1-2H20"/>'
        };
        function icon(name, cls = '') {
            return `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON_PATHS[name] || ICON_PATHS.todo}</svg>`;
        }
        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function emptyState(iconName, text) {
            return `<div class="empty-state">${icon(iconName)}<div>${esc(text)}</div></div>`;
        }

        function renderHealth(data) {
            const indicator = document.getElementById('healthIndicator');
            const healthText = document.getElementById('healthText');
            const iconEl = document.getElementById('healthIcon');

            indicator.className = 'health-indicator ' + data.health.status;
            healthText.className = 'health-text ' + data.health.status;

            const states = {
                good: { icon: 'check', title: 'On track' },
                warning: { icon: 'alert', title: 'Needs attention' },
                critical: { icon: 'stop', title: 'Action required' }
            };
            const s = states[data.health.status] || states.good;
            iconEl.innerHTML = icon(s.icon);
            indicator.setAttribute('title', s.title);
            healthText.innerHTML = `<h2>${s.title}</h2><p>${esc(data.health.message)}</p>`;

            document.getElementById('completionRate').textContent = data.health.completion + '%';
            document.getElementById('activeCount').textContent = data.health.activeCount;
            document.getElementById('openBugs').textContent = data.health.openBugs;
            const fill = document.getElementById('completionFill');
            if (fill) fill.style.width = data.health.completion + '%';
        }

        function renderActiveWork(data) {
            const container = document.getElementById('activeWorkList');
            const subtitle = document.getElementById('activeSubtitle');

            if (data.active.length === 0) {
                container.innerHTML = emptyState('spark', 'Nothing in progress');
                subtitle.textContent = '';
                return;
            }

            const inProgressCount = data.active.filter(i => i.status === 'progress').length;
            const todoCount = data.active.filter(i => i.status === 'todo').length;
            const parts = [];
            if (inProgressCount) parts.push(`${inProgressCount} active`);
            if (todoCount) parts.push(`${todoCount} planned`);
            subtitle.textContent = parts.join(' · ') || `${data.active.length}`;

            const statusLabel = { progress: 'In progress', monitoring: 'In review', todo: 'Planned' };
            const statusIcon = { progress: 'progress', monitoring: 'review', todo: 'todo' };

            container.innerHTML = data.active.map(item => {
                const tip = [item.id, item.title, item.files].filter(Boolean).join('\n');
                return `
                <div class="row active-item ${item.status}" title="${esc(tip)}">
                    <span class="st s-${item.status}" role="img" aria-label="${statusLabel[item.status] || esc(item.status)}">${icon(statusIcon[item.status] || 'todo')}</span>
                    <span class="t active-item-title">${esc(item.title)}</span>
                    <span class="rid active-item-id">${esc(item.id)}</span>
                </div>`;
            }).join('');
        }

        function renderWorkOnNext(data) {
            const container = document.getElementById('workNextList');
            const subtitle = document.getElementById('workNextSubtitle');

            if (data.workOnNext.length === 0) {
                container.innerHTML = emptyState('spark', 'No urgent items waiting');
                subtitle.textContent = '';
                return;
            }

            subtitle.textContent = `${data.workOnNext.length} ready`;

            container.innerHTML = data.workOnNext.map(item => {
                const prioLabel = item.priority === 'high' ? 'High priority' : 'Medium priority';
                const tip = `${item.id} · ${item.type}\nStatus: ${item.status}`;
                return `
                <div class="row work-next-item ${item.priority}" title="${esc(tip)}">
                    <span class="st p-${item.priority}" role="img" aria-label="${prioLabel}">${icon('flag')}</span>
                    <span class="t work-next-title">${esc(item.title)}</span>
                    ${item.type === 'bug' ? `<span class="st ty-bug" role="img" aria-label="Bug">${icon('bug')}</span>` : ''}
                    <span class="rid work-next-id">${esc(item.id)}</span>
                </div>`;
            }).join('');
        }

        function renderCompleted(data) {
            const container = document.getElementById('completedList');
            const subtitle = document.getElementById('completedSubtitle');

            if (data.completed.length === 0) {
                container.innerHTML = emptyState('inbox', 'Nothing finished yet');
                return;
            }

            subtitle.textContent = `${data.completed.length}`;

            container.innerHTML = data.completed.map(item => `
                <div class="row completed-item" title="${esc(item.id + ' · ' + item.type)}">
                    <span class="st c-done" role="img" aria-label="Done">${icon('check')}</span>
                    <span class="t completed-item-title">${esc(item.title)}</span>
                    <span class="rid completed-item-id">${esc(item.id)}</span>
                    ${item.date && item.date !== 'Recently' ? `<span class="meta completed-item-date">${esc(item.date)}</span>` : ''}
                </div>
            `).join('');
        }

        function renderPriorityMatrix(data) {
            const container = document.getElementById('priorityMatrix');

            const priorities = [
                { key: 'p1', label: 'P1', name: 'Critical', color: 'var(--p1)', ...data.priorities.p1 },
                { key: 'p2', label: 'P2', name: 'Medium', color: 'var(--p2)', ...data.priorities.p2 },
                { key: 'p3', label: 'P3', name: 'Low', color: 'var(--plan)', ...data.priorities.p3 }
            ];

            container.innerHTML = priorities.map(p => {
                const total = p.done + p.open;
                const donePercent = total > 0 ? (p.done / total) * 100 : 0;
                return `
                    <div class="hb priority-row" title="${p.label} ${p.name}: ${p.done} done, ${p.open} open">
                        <span class="n priority-label ${p.key}"><span style="color:${p.color};display:flex">${icon('flag')}</span>${p.name}</span>
                        <div class="track" role="progressbar" aria-label="${p.label} done" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(donePercent)}"><i class="priority-bar done" style="width:${donePercent}%;background:var(--done)"></i></div>
                        <span class="v priority-counts"><b>${p.done}</b>/${total}</span>
                    </div>
                `;
            }).join('');
        }

        function renderTypeBreakdown(data) {
            const container = document.getElementById('typeBreakdown');

            const types = [
                { key: 'tasks', ...data.types.tasks },
                { key: 'bugs', ...data.types.bugs },
                { key: 'roads', ...data.types.roads },
                { key: 'issues', ...data.types.issues },
                { key: 'ideas', ...data.types.ideas }
            ];
            const colors = { task: 'var(--plan)', bug: 'var(--pause)', road: 'var(--review)', issue: 'var(--act)', idea: 'var(--accent)' };

            container.innerHTML = types.map(t => {
                const percent = t.total > 0 ? Math.round((t.done / t.total) * 100) : 0;
                const key = t.key === 'roads' ? 'road' : t.key.slice(0, -1);

                return `
                    <div class="hb type-row" title="${t.label}: ${t.done} of ${t.total} done (${percent}%)">
                        <span class="n type-name"><span class="type-icon ty-${key}" style="display:flex">${icon(key)}</span>${t.label}</span>
                        <div class="track" role="progressbar" aria-label="${t.label} done" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}"><i style="width:${percent}%;background:${colors[key]};opacity:.85"></i></div>
                        <span class="v type-stat-value ${key}"><b>${t.total - t.done}</b></span>
                    </div>
                `;
            }).join('');
        }

        function renderOpenBugs(data) {
            const container = document.getElementById('openBugsList');
            const subtitle = document.getElementById('openBugsSubtitle');

            if (data.openBugs.length === 0) {
                container.innerHTML = emptyState('spark', 'No open bugs');
                subtitle.textContent = '';
                return;
            }

            subtitle.textContent = `${data.openBugs.length}`;

            // Sort by priority: high first, then medium, then low
            const priorityOrder = { high: 0, medium: 1, low: 2 };
            const sortedBugs = [...data.openBugs].sort((a, b) =>
                priorityOrder[a.priority] - priorityOrder[b.priority]
            );
            const prioLabel = { high: 'High priority', medium: 'Medium priority', low: 'Low priority' };

            container.innerHTML = sortedBugs.map(bug => `
                <article class="open-bug-item ${bug.priority}">
                    <div class="open-bug-header">
                        <span class="open-bug-priority p-${bug.priority}" role="img" aria-label="${prioLabel[bug.priority]}" title="${prioLabel[bug.priority]}" style="display:flex">${icon('flag')}</span>
                        <span class="open-bug-id">${esc(bug.id)}</span>
                    </div>
                    <div class="open-bug-title">${esc(bug.title)}</div>
                    ${bug.notes ? `<div class="open-bug-notes" title="${esc(bug.notes)}">${esc(bug.notes)}</div>` : ''}
                </article>
            `).join('');
        }

        async function init() {
            try {
                const data = await fetchAndParse();
                renderHealth(data);
                renderActiveWork(data);
                renderWorkOnNext(data);
                renderCompleted(data);
                renderPriorityMatrix(data);
                renderTypeBreakdown(data);
                renderOpenBugs(data);
            } catch (error) {
                console.error('Failed to initialize:', error);
                document.getElementById('healthText').innerHTML = `
                    <h2 style="color: var(--p1)">Could not load</h2>
                    <p>The plan file could not be read</p>
                `;
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', (e) => {
            const btn = e.currentTarget;
            btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin');
            init();
        });

        let isInitialized = false;

        function setupDashboard() {
            if (isInitialized) return;
            init();
            isInitialized = true;
        }

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'tab-activated') {
                init();
            }
            if (event.data && event.data.type === 'project-switch') {
                window.location.reload();
            }
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setupDashboard);
        } else {
            setupDashboard();
        }
    </script>
</body>
</html>
