<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dependencies & Locks - Dev Maestro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../dusk-tokens.css">
    <link rel="stylesheet" href="dusk.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <svg class="ic header-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 8.5v7M18 11.5c0 4-12 1-12 4"/>
                </svg>
                <h1>Dependencies</h1>
            </div>

            <div class="stats-bar" role="group" aria-label="Summary">
                <div class="stat s-locks" title="Active locks">
                    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg>
                    <span class="stat-value" id="stat-locks">0</span>
                    <span class="stat-label sr">Active locks</span>
                </div>
                <div class="stat s-blocks" title="Blocked tasks">
                    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg>
                    <span class="stat-value" id="stat-blocked">0</span>
                    <span class="stat-label sr">Blocked tasks</span>
                </div>
                <div class="stat s-deps" title="Dependencies">
                    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>
                    <span class="stat-value" id="stat-deps">0</span>
                    <span class="stat-label sr">Dependencies</span>
                </div>
            </div>

            <div class="header-actions">
                <div class="connection-status" title="Live updates">
                    <div class="connection-dot" id="connection-dot"></div>
                    <span id="connection-text">Connected</span>
                </div>
                <div class="legend-wrap">
                    <button class="tb" type="button" aria-label="What the colors mean" aria-haspopup="true">
                        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>
                    </button>
                    <div class="legend" role="note">
                        <div class="legend-item"><div class="legend-dot" style="background: var(--locks)"></div><span>Locked by a session</span></div>
                        <div class="legend-item"><div class="legend-dot" style="background: var(--deps)"></div><span>Depends on</span></div>
                        <div class="legend-item"><div class="legend-dot" style="background: var(--blocks)"></div><span>Blocks</span></div>
                        <div class="legend-item"><div class="legend-dot" style="background: var(--done)"></div><span>Completed</span></div>
                    </div>
                </div>
                <button class="tb refresh-btn" type="button" onclick="refreshAll()" aria-label="Refresh" title="Refresh">
                    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
                </button>
            </div>
        </header>

        <main class="panels">
            <section class="locks-panel">
                <div class="panel-header">
                    <h2 class="panel-title">
                        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg>
                        Locks
                    </h2>
                </div>
                <div class="locks-grid" id="locks-container">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        Loading locks
                    </div>
                </div>
            </section>

            <section class="deps-panel">
                <div class="panel-header">
                    <h2 class="panel-title">
                        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>
                        Task dependencies
                    </h2>
                </div>
                <div class="deps-container" id="deps-container">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        Loading dependencies
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // State
        let locks = [];
        let dependencies = [];
        let activeLockIds = new Set();
        let taskTitles = {};

        // Initialize
        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            await refreshAll();
            setupSSE();
        }

        async function refreshAll() {
            const btn = document.querySelector('.refresh-btn');
            if (btn) { btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin'); }
            await Promise.all([
                loadLocks(),
                loadDependencies()
            ]);
        }

        // Load active locks
        async function loadLocks() {
            try {
                const response = await fetch('/api/locks?t=' + Date.now());
                const data = await response.json();
                locks = data.locks || [];
                activeLockIds = new Set(locks.map(l => l.task_id));
                renderLocks();
                updateStats();
            } catch (error) {
                console.error('Failed to load locks:', error);
                document.getElementById('locks-container').innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" stroke-width="1.5">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <p>Failed to load locks</p>
                    </div>
                `;
            }
        }

        // Render locks grid
        function renderLocks() {
            const container = document.getElementById('locks-container');

            if (locks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" stroke-width="1.5">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
                        </svg>
                        <p>No locks</p>
                        <p class="subtext">Every task is free to pick up</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = locks.map(lock => `
                <div class="lock-card" role="button" tabindex="0" aria-label="Open ${esc(lock.task_id)} on the board" onclick="jumpToTask('${esc(lock.task_id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();jumpToTask('${esc(lock.task_id)}')}">
                    <div class="lock-card-header">
                        <div class="lock-task-id">
                            <span class="lock-pulse" aria-hidden="true"></span>
                            ${esc(lock.task_id)}
                        </div>
                        <div class="lock-session" title="Session">${esc(lock.session_short)}</div>
                    </div>
                    <div class="lock-meta" title="Locked at">
                        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
                        <span>${esc(lock.locked_at)}</span>
                    </div>
                    ${(lock.files || []).length > 0 ? `
                        <div class="lock-files">
                            ${lock.files.map(f => `<span class="lock-file" title="${esc(f)}">${esc(f)}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Load dependencies from MASTER_PLAN
        async function loadDependencies() {
            try {
                const response = await fetch('/api/master-plan?t=' + Date.now());
                const data = await response.json();
                dependencies = parseDependencies(data.content);
                renderDependencies();
                updateStats();
            } catch (error) {
                console.error('Failed to load dependencies:', error);
                document.getElementById('deps-container').innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" stroke-width="1.5">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <p>Failed to load dependencies</p>
                    </div>
                `;
            }
        }

        // Parse dependencies from MASTER_PLAN content
        function parseDependencies(content) {
            const deps = [];
            const lines = content.split('\n');

            // Find dependency table
            let inDepTable = false;
            let headerParsed = false;
            let colIndices = { id: -1, status: -1, depends: -1, blocks: -1, title: -1 };
            taskTitles = {};

            for (const line of lines) {
                // Look for dependency table header (matches "| ID |" with "Dependencies" column)
                if (line.includes('| ID |') && (line.includes('Depend') || line.includes('Status'))) {
                    inDepTable = true;
                    const cols = line.split('|').map(c => c.trim().toLowerCase());
                    colIndices.id = cols.findIndex(c => c === 'id');
                    colIndices.status = cols.findIndex(c => c === 'status');
                    colIndices.depends = cols.findIndex(c => c.includes('depend') || c === 'deps');
                    colIndices.blocks = cols.findIndex(c => c.includes('block'));
                    colIndices.title = cols.findIndex(c => c === 'task' || c === 'title' || c === 'name');
                    // If no blocks column, use depends column for both
                    if (colIndices.blocks === -1) colIndices.blocks = colIndices.depends;
                    continue;
                }

                // Skip separator line
                if (inDepTable && line.match(/^\|\s*-+/)) {
                    headerParsed = true;
                    continue;
                }

                // Exit table on empty line or non-table content
                if (inDepTable && headerParsed && (!line.startsWith('|') || line.trim() === '')) {
                    inDepTable = false;
                    headerParsed = false;
                    continue;
                }

                // Parse table rows
                if (inDepTable && headerParsed && line.startsWith('|')) {
                    const cells = line.split('|').map(c => c.trim());

                    if (cells.length > Math.max(colIndices.id, colIndices.depends, colIndices.blocks)) {
                        const idCell = cells[colIndices.id] || '';
                        const statusCell = cells[colIndices.status] || '';
                        const dependsCell = cells[colIndices.depends] || '';
                        const blocksCell = cells[colIndices.blocks] || '';

                        // Extract task ID (handle strikethrough)
                        const idMatch = idCell.match(/(~~)?(\*\*)?([A-Z]+-\d+)(\*\*)?(~~)?/);
                        if (!idMatch) continue;

                        const taskId = idMatch[3];
                        if (colIndices.title > -1 && cells[colIndices.title]) {
                            taskTitles[taskId] = cells[colIndices.title].replace(/~~|\*\*/g, '').trim();
                        }
                        const isDone = idCell.includes('~~') || statusCell.toLowerCase().includes('done');
                        const isInProgress = statusCell.toLowerCase().includes('progress');

                        // Parse depends on
                        const dependsOn = extractTaskIds(dependsCell);
                        for (const depId of dependsOn) {
                            deps.push({
                                source: taskId,
                                target: depId,
                                type: 'depends',
                                sourceDone: isDone,
                                sourceInProgress: isInProgress,
                                targetDone: depId.includes('~~') || dependsCell.includes('~~' + depId)
                            });
                        }

                        // No separate "blocks" column: read the same links the other way round
                        // (if A depends on B, then B blocks A) instead of repeating them.
                        if (colIndices.blocks === colIndices.depends) {
                            for (const depId of dependsOn) {
                                const depDone = dependsCell.includes('~~' + depId);
                                deps.push({
                                    source: depId,
                                    target: taskId,
                                    type: 'blocks',
                                    sourceDone: depDone,
                                    sourceInProgress: false,
                                    targetDone: isDone
                                });
                            }
                            continue;
                        }

                        // Parse blocks
                        const blocks = extractTaskIds(blocksCell);
                        for (const blockId of blocks) {
                            deps.push({
                                source: taskId,
                                target: blockId,
                                type: 'blocks',
                                sourceDone: isDone,
                                sourceInProgress: isInProgress,
                                targetDone: blockId.includes('~~') || blocksCell.includes('~~' + blockId)
                            });
                        }
                    }
                }
            }

            return deps;
        }

        // Extract task IDs from a cell
        function extractTaskIds(cell) {
            if (!cell || cell === '-' || cell.trim() === '') return [];
            const matches = cell.match(/(?:~~)?([A-Z]+-\d+)(?:~~)?/g) || [];
            return matches.map(m => m.replace(/~~/g, ''));
        }

        // Render dependencies
        function renderDependencies() {
            const container = document.getElementById('deps-container');

            // Filter out completed dependencies and group by type
            const activeDeps = dependencies.filter(d => !d.sourceDone || !d.targetDone);
            const dependsOn = activeDeps.filter(d => d.type === 'depends');
            const blocks = activeDeps.filter(d => d.type === 'blocks');

            if (dependencies.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" stroke-width="1.5">
                            <circle cx="18" cy="5" r="3"/>
                            <circle cx="6" cy="12" r="3"/>
                            <circle cx="18" cy="19" r="3"/>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                        </svg>
                        <p>No dependencies</p>
                        <p class="subtext">Add them in the plan's dependency table</p>
                    </div>
                `;
                return;
            }

            let html = '';

            // Render "depends on" relationships
            if (dependsOn.length > 0) {
                html += `
                    <div class="dep-group">
                        <div class="dep-group-title">
                            <svg viewBox="0 0 24 24" aria-hidden="true" style="color: var(--deps)">
                                <polyline points="15 18 9 12 15 6"/>
                            </svg>
                            Depends on <span class="n">${dependsOn.length}</span>
                        </div>
                        ${dependsOn.map(d => renderDepRow(d)).join('')}
                    </div>
                `;
            }

            // Render "blocks" relationships
            if (blocks.length > 0) {
                html += `
                    <div class="dep-group">
                        <div class="dep-group-title">
                            <svg viewBox="0 0 24 24" aria-hidden="true" style="color: var(--blocks)">
                                <polyline points="9 18 15 12 9 6"/>
                            </svg>
                            Blocks <span class="n">${blocks.length}</span>
                        </div>
                        ${blocks.map(d => renderDepRow(d)).join('')}
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // Render a single dependency row
        function renderDepRow(dep) {
            const sourceClass = dep.sourceDone ? 'done' : (activeLockIds.has(dep.source) ? 'locked' : 'source');
            const targetClass = dep.targetDone ? 'done' : (activeLockIds.has(dep.target) ? 'locked' : 'target');
            const arrowClass = dep.type === 'depends' ? 'depends' : 'blocks';
            const arrowLabel = dep.type === 'depends' ? 'depends on' : 'blocks';
            const rowTip = [
                taskTitles[dep.source] ? `${dep.source}: ${taskTitles[dep.source]}` : dep.source,
                arrowLabel,
                taskTitles[dep.target] ? `${dep.target}: ${taskTitles[dep.target]}` : dep.target
            ].join('\n');

            // Status indicator
            let status = '';
            if (dep.sourceDone && dep.targetDone) {
                status = '<span class="dep-status done">Both done</span>';
            } else if (dep.targetDone && dep.type === 'depends') {
                status = '<span class="dep-status done">Ready</span>';
            } else if (activeLockIds.has(dep.source)) {
                status = '<span class="dep-status in-progress">Locked</span>';
            } else if (dep.sourceInProgress) {
                status = '<span class="dep-status in-progress">In progress</span>';
            }

            return `
                <div class="dep-row" role="button" tabindex="0" title="${esc(rowTip)}" aria-label="${esc(dep.source + ' ' + arrowLabel + ' ' + dep.target)}" onclick="jumpToTask('${esc(dep.source)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();jumpToTask('${esc(dep.source)}')}">
                    <div class="dep-task">
                        <span class="dep-task-id ${sourceClass}">${esc(dep.source)}</span>
                    </div>
                    <div class="dep-arrow ${arrowClass}">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12 5 19 12 12 19"/>
                        </svg>
                        <span>${arrowLabel}</span>
                    </div>
                    <div class="dep-task">
                        <span class="dep-task-id ${targetClass}">${esc(dep.target)}</span>
                    </div>
                    <span class="dep-title">${esc(taskTitles[dep.type === 'blocks' ? dep.target : dep.source] || '')}</span>
                    ${status}
                </div>
            `;
        }

        // Update stats
        function updateStats() {
            document.getElementById('stat-locks').textContent = locks.length;
            document.getElementById('stat-blocked').textContent = dependencies.filter(d => d.type === 'blocks' && !d.sourceDone).length;
            document.getElementById('stat-deps').textContent = dependencies.length;
        }

        // Jump to task in kanban
        function jumpToTask(taskId) {
            // Send message to parent to switch to kanban and highlight task
            window.parent.postMessage({ type: 'jump-to-task', taskId }, '*');

            // Also try to scroll in kanban if same-origin
            try {
                const kanbanFrame = window.parent.document.querySelector('iframe[data-src*="kanban"]');
                if (kanbanFrame && kanbanFrame.contentWindow) {
                    kanbanFrame.contentWindow.postMessage({ type: 'highlight-task', taskId }, '*');
                }
            } catch (e) {
                // Cross-origin, ignore
            }
        }

        // Setup SSE for real-time updates
        function setupSSE() {
            const eventSource = new EventSource('/api/events');

            eventSource.onopen = () => {
                document.getElementById('connection-dot').classList.remove('disconnected');
                document.getElementById('connection-text').textContent = 'Connected';
            };

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'locks-changed') {
                    console.log('Locks changed, reloading...');
                    loadLocks();
                }

                if (data.type === 'file-changed') {
                    console.log('File changed, reloading dependencies...');
                    loadDependencies();
                }
            };

            eventSource.onerror = () => {
                document.getElementById('connection-dot').classList.add('disconnected');
                document.getElementById('connection-text').textContent = 'Reconnecting...';
            };
        }

        // Listen for tab activation
        window.addEventListener('message', (event) => {
            if (event.data?.type === 'tab-activated') {
                refreshAll();
            }
        });
    </script>
</body>
</html>
